# Tiny Society's Steam achievements, mapped onto what the harbour records.
#
# Each achievement has a Steam API id, its name in English, Simplified
# Chinese and Japanese, the kinds of recorded Event whose arrival can unlock
# it (`events`), and the condition over the World's history that must hold
# (`unlock`):
#
#   page:<season>          that season's page of the Book has been filled
#   years:<n>              the Book has closed n years
#   project:<id>[:<step>]  a town project has reached that step (or its last)
#   finds:<n|all>          that many entries of the book of finds are found
#   almanac:all            every day of the almanac has been lived
#   heart:<name>           every beat of that resident's heart is reached
#   hearts:<n>             that many residents' hearts are complete
#
# `tiny_society::achievements::unlocked` computes which are unlocked from a
# World alone, so the same World always unlocks the same ones, on any
# machine and on any replay. Talking to Steam is P6's.

[[achievement]]
id = "BOOK_FIRST_PAGE"
en = "The First Page"
zh = "第一页"
ja = "最初のページ"
events = "page_filled"
unlock = "page:spring"

