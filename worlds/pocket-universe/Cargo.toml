[package]
name = "pocket-universe"
version = "0.30.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
storylets = { path = "../../systems/storylets" }
lives = { path = "../../systems/lives" }
hands = { path = "../../systems/hands" }
conversation = { path = "../../systems/conversation" }
calendar = { path = "../../systems/calendar" }
chronicle = { path = "../../systems/chronicle" }
days = { path = "../../systems/days" }
world-core = { path = "../../crates/world-core" }
world-host = { path = "../../crates/world-host" }
world-persistence = { path = "../../crates/world-persistence" }
world-projection = { path = "../../crates/world-projection" }


[dev-dependencies]
# The old full-history scans, to test what the index finds against.
lives = { path = "../../systems/lives", features = ["scan-reference"] }
world-gpui = { path = "../../crates/world-gpui" }
world-compare = { path = "../../crates/world-compare" }
world-library = { path = "../../crates/world-library" }
world-document = { path = "../../crates/world-document" }
world-i18n = { path = "../../crates/world-i18n" }
serde_json = "1"
