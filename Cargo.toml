[workspace]
members = [
  "crates/world-core",
  "crates/world-theme",
  "crates/world-agent",
  "crates/world-pi-rpc",
  "crates/world-pack-protocol",
  "crates/world-pack-bundle",
  "crates/world-pack-process",
  "crates/world-pack-catalog",
  "crates/world-pack-server",
  "crates/world-projection",
  "crates/world-compare",
  "crates/world-gpui",
  "crates/world-persistence",
  "crates/world-document",
  "crates/world-integrity",
  "crates/world-host",
  "crates/world-builtins",
  "crates/world-library",
  "crates/world-observer",
  "crates/world-voice",
  "crates/world-i18n",
  "crates/world-sound",
  "systems/society-basic",
  "systems/storylets",
  "systems/lives",
  "systems/hands",
  "systems/conversation",
  "systems/calendar",
  "systems/days",
  "worlds/tiny-society",
  "worlds/pocket-universe",
  "apps/tiny-society-pack",
  "apps/pocket-universe-pack",
  "apps/world-machine-desktop",
]
resolver = "2"

# The simulation runs years of days in its tests; build it optimised even
# in debug so those tests stay quick.
[profile.dev.package.world-core]
opt-level = 2

[profile.dev.package.lives]
opt-level = 2

[profile.dev.package.storylets]
opt-level = 2

[profile.dev.package.hands]
opt-level = 2

[profile.dev.package.calendar]
opt-level = 2

[profile.dev.package.tiny-society]
opt-level = 2

[profile.dev.package.pocket-universe]
opt-level = 2

[profile.dev.package.tiny-skia]
opt-level = 3

# Its tests render minutes of sound sample by sample.
[profile.dev.package.world-sound]
opt-level = 2
