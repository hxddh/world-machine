name: M221 minimal lock

on:
  push:
    branches:
      - agent/m221-rust-analyst-turn-client

permissions:
  contents: write

jobs:
  minimize-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m221-rust-analyst-turn-client
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore base lock and add only workspace metadata
        shell: bash
        run: |
          git show origin/main:Cargo.lock > Cargo.lock
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Cargo.lock")
          text = path.read_text()

          analyst_block = '''[[package]]
          name = "world-analyst-client"
          version = "0.1.0"
          dependencies = [
           "serde",
           "serde_json",
          ]

          '''
          marker = '[[package]]\nname = "world-builtins"'
          if 'name = "world-analyst-client"' not in text:
              if marker not in text:
                  raise SystemExit("world-builtins marker not found")
              text = text.replace(marker, analyst_block + marker, 1)

          cli_start = text.index('[[package]]\nname = "world-cli"')
          cli_end = text.index('\n[[package]]', cli_start + 1)
          cli = text[cli_start:cli_end]
          if ' "world-investigation-local",' not in cli:
              needle = ' "world-investigation",\n'
              if needle not in cli:
                  raise SystemExit("world-cli investigation dependency not found")
              cli = cli.replace(needle, needle + ' "world-investigation-local",\n', 1)
              text = text[:cli_start] + cli + text[cli_end:]

          path.write_text(text)
          PY
      - name: Validate exact lock without re-resolution
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Commit minimal lockfile
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already has the minimal valid diff."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "M221: minimize Cargo.lock changes"
          git push origin HEAD:agent/m221-rust-analyst-turn-client
