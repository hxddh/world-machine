name: M115 apply durable library summary

on:
  push:
    branches:
      - agent/m115-durable-library-summary
    paths:
      - scripts/m115-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m115-durable-library-summary
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply durable summary patch
        run: python scripts/m115_patch.py
      - name: Format and compile generic crates
        shell: bash
        run: |
          cargo fmt --all
          cargo check -p world-document -p world-library
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "world-machine-m115"
          git config user.email "actions@users.noreply.github.com"
          git add crates/world-document/src/lib.rs crates/world-library/src/lib.rs crates/world-library/src/revision/background.rs crates/world-library/src/revision/fork.rs crates/world-library/src/save_as.rs crates/world-library/src/revision/metadata_regression.rs apps/world-machine-desktop/src/main.rs apps/world-machine-desktop/src/strategy_compare.rs
          git diff --cached --quiet && { echo "patch produced no product changes" >&2; exit 1; }
          git commit -m "M115: persist durable World summaries for My Worlds"
          git push origin HEAD:agent/m115-durable-library-summary
