name: M117 wire My Worlds summary

on:
  push:
    branches:
      - agent/m117-wire-library-summary
    paths:
      - scripts/m117-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m117-wire-library-summary
      - uses: dtolnay/rust-toolchain@stable
      - name: Wire durable summary into My Worlds
        run: python scripts/m117_patch.py
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit product change
        shell: bash
        run: |
          git config user.name "world-machine-m117"
          git config user.email "actions@users.noreply.github.com"
          git add apps/world-machine-desktop/src/main.rs
          git diff --cached --quiet && { echo "patch produced no product changes" >&2; exit 1; }
          git commit -m "M117: render durable summaries in My Worlds"
          git push origin HEAD:agent/m117-wire-library-summary
