name: M148 patch

on:
  push:
    branches:
      - agent/m148-relation-lifetime-effects

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m148-relation-lifetime-effects
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply relation lifetime projection patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          world_path = Path('crates/world-core/src/world.rs')
          world = world_path.read_text()
          old = "\n".join([
              "    pub fn state(&self) -> &WorldState {",
              "        &self.state",
              "    }",
              "",
              "    pub fn world_time(&self) -> u64 {",
          ])
          new = "\n".join([
              "    pub fn state(&self) -> &WorldState {",
              "        &self.state",
              "    }",
              "",
              "    pub fn baseline_state(&self) -> &WorldState {",
              "        &self.baseline",
              "    }",
              "",
              "    pub fn world_time(&self) -> u64 {",
          ])
          assert world.count(old) == 1, f'world accessor match count: {world.count(old)}'
          world_path.write_text(world.replace(old, new))

          path = Path('crates/world-projection/src/lib.rs')
          text = path.read_text()
          old_import = "use world_core::{Entity, EntityId, Event, EventId, StateChange, Value, World};"
          new_import = "use world_core::{Entity, EntityId, Event, EventId, RelationId, StateChange, Value, World};"
          assert text.count(old_import) == 1, f'import match count: {text.count(old_import)}'
          text = text.replace(old_import, new_import)

          old_inspectors = "\n".join([
              "pub fn inspectors_from_world(world: &World) -> BTreeMap<SelectionId, InspectorProjection> {",
              "    let mut inspectors = BTreeMap::new();",
              "    for entity in world.state().entities() {",
              "        inspectors.insert(",
              "            SelectionId::Entity(entity.id),",
              "            inspector_for_entity(entity, world),",
              "        );",
              "    }",
          ])
          new_inspectors = "\n".join([
              "pub fn inspectors_from_world(world: &World) -> BTreeMap<SelectionId, InspectorProjection> {",
              "    let recorded_change_events = recorded_entity_change_events(world);",
              "    let mut inspectors = BTreeMap::new();",
              "    for entity in world.state().entities() {",
              "        inspectors.insert(",
              "            SelectionId::Entity(entity.id),",
              "            inspector_for_entity(entity, world, &recorded_change_events),",
              "        );",
              "    }",
          ])
          assert text.count(old_inspectors) == 1, f'inspectors match count: {text.count(old_inspectors)}'
          text = text.replace(old_inspectors, new_inspectors)

          old_sig = "fn inspector_for_entity(entity: &Entity, world: &World) -> InspectorProjection {"
          new_sig = "\n".join([
              "fn inspector_for_entity(",
              "    entity: &Entity,",
              "    world: &World,",
              "    recorded_change_events: &BTreeMap<EntityId, Vec<EventId>>,",
              ") -> InspectorProjection {",
          ])
          assert text.count(old_sig) == 1, f'entity inspector sig match count: {text.count(old_sig)}'
          text = text.replace(old_sig, new_sig)

          old_call = "    let recorded_changes = recorded_entity_change_rows(entity.id, world);"
          new_call = "\n".join([
              "    let recorded_changes =",
              "        recorded_entity_change_rows(entity.id, world, recorded_change_events);",
          ])
          assert text.count(old_call) == 1, f'recorded call match count: {text.count(old_call)}'
          text = text.replace(old_call, new_call)

          start = text.index("fn recorded_entity_change_rows(")
          end = text.index("fn inspector_for_event", start)
          replacement = "\n".join([
              "fn recorded_entity_change_rows(",
              "    entity: EntityId,",
              "    world: &World,",
              "    recorded_change_events: &BTreeMap<EntityId, Vec<EventId>>,",
              ") -> Vec<InspectorRow> {",
              "    let Some(event_ids) = recorded_change_events.get(&entity) else {",
              "        return Vec::new();",
              "    };",
              "",
              "    event_ids",
              "        .iter()",
              "        .rev()",
              "        .filter_map(|event_id| world.event(*event_id))",
              "        .map(|event| InspectorRow {",
              "            label: format!(",
              "                \"World time {} · {}\",",
              "                event.world_time,",
              "                humanize(&event.kind)",
              "            ),",
              "            value: SelectionId::Event(event.id).stable_key(),",
              "        })",
              "        .collect()",
              "}",
              "",
              "fn recorded_entity_change_events(world: &World) -> BTreeMap<EntityId, Vec<EventId>> {",
              "    let mut relation_endpoints = world",
              "        .baseline_state()",
              "        .relations()",
              "        .map(|relation| (relation.id, (relation.from, relation.to)))",
              "        .collect::<BTreeMap<RelationId, (EntityId, EntityId)>>();",
              "    let mut events_by_entity = BTreeMap::<EntityId, Vec<EventId>>::new();",
              "",
              "    for event in world.events() {",
              "        let mut affected = BTreeSet::new();",
              "        for change in &event.changes {",
              "            match change {",
              "                StateChange::CreateEntity(entity) => {",
              "                    affected.insert(entity.id);",
              "                }",
              "                StateChange::RemoveEntity(entity) => {",
              "                    affected.insert(*entity);",
              "                    relation_endpoints",
              "                        .retain(|_, (from, to)| *from != *entity && *to != *entity);",
              "                }",
              "                StateChange::SetComponent { entity, .. }",
              "                | StateChange::RemoveComponent { entity, .. } => {",
              "                    affected.insert(*entity);",
              "                }",
              "                StateChange::CreateRelation(relation) => {",
              "                    affected.insert(relation.from);",
              "                    affected.insert(relation.to);",
              "                    relation_endpoints.insert(relation.id, (relation.from, relation.to));",
              "                }",
              "                StateChange::RemoveRelation(relation) => {",
              "                    if let Some((from, to)) = relation_endpoints.remove(relation) {",
              "                        affected.insert(from);",
              "                        affected.insert(to);",
              "                    }",
              "                }",
              "                StateChange::SetRelationProperty { relation, .. }",
              "                | StateChange::RemoveRelationProperty { relation, .. } => {",
              "                    if let Some((from, to)) = relation_endpoints.get(relation).copied() {",
              "                        affected.insert(from);",
              "                        affected.insert(to);",
              "                    }",
              "                }",
              "            }",
              "        }",
              "",
              "        for entity in affected {",
              "            events_by_entity.entry(entity).or_default().push(event.id);",
              "        }",
              "    }",
              "",
              "    events_by_entity",
              "}",
              "",
          ])
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
          cargo fmt --all
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/world-core/src/world.rs crates/world-projection/src/lib.rs
          git commit -m "M148: reconstruct relation lifetime effects"
          git push origin HEAD:agent/m148-relation-lifetime-effects
