name: M140 Patch

on:
  push:
    branches:
      - agent/m140-entity-history-event-navigation

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[m140-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m140-entity-history-event-navigation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply M140 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/world-strategy-gpui/src/lib.rs')
          s = p.read_text()

          old = '''use world_projection::{
              InspectorProjection, ProjectionCommand, ProjectionSnapshot, SelectionId, TimelineItem, WhyNode,
          };'''
          new = '''use world_projection::{
              InspectorProjection, ProjectionCommand, ProjectionSnapshot, SelectionId, TimelineItem, WhyNode,
              ENTITY_HISTORY_SECTION,
          };'''
          assert old in s
          s = s.replace(old, new, 1)

          old = 'const EVIDENCE_CAUSE_LIMIT: usize = 6;'
          new = 'const EVIDENCE_CAUSE_LIMIT: usize = 6;\nconst ENTITY_HISTORY_LIMIT: usize = 6;'
          assert old in s
          s = s.replace(old, new, 1)

          old = '''            .child(self.render_evidence_inspector(inspector));

              if let SelectionId::Event(event) = selected.selection {'''
          new = '''            .child(self.render_evidence_inspector(inspector));

              if let SelectionId::Entity(entity) = selected.selection {
                  let history = snapshot.entity_history(entity);
                  if !history.is_empty() {
                      let mut history_list = div().flex().flex_col().gap_2();
                      for item in history.iter().take(ENTITY_HISTORY_LIMIT) {
                          history_list = history_list.child(
                              self.render_entity_history_event(selected.side, item, cx),
                          );
                      }
                      if let Some(notice) = hidden_notice(
                          history.len(),
                          ENTITY_HISTORY_LIMIT,
                          "recorded entity changes",
                      ) {
                          history_list = history_list.child(truncation_notice(notice));
                      }
                      panel = panel
                          .child(div().text_sm().child("Recorded changes to this entity"))
                          .child(
                              div()
                                  .text_xs()
                                  .text_color(rgb(0x66705f))
                                  .child("Recorded events whose StateChanges directly changed this entity. Select one to inspect the event and continue tracing its causes on the same future."),
                          )
                          .child(history_list);
                  }
              }

              if let SelectionId::Event(event) = selected.selection {'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    fn render_evidence_inspector(&self, inspector: &InspectorProjection) -> Div {
              let mut sections = div().flex().flex_col().gap_3();
              for section in &inspector.sections {'''
          new = '''    fn render_entity_history_event(
              &self,
              side: ComparisonSide,
              item: &TimelineItem,
              cx: &mut Context<Self>,
          ) -> impl IntoElement {
              let selection = item.id;
              let selected = self.is_selected(side, selection);
              div()
                  .id(SharedString::from(format!(
                      "entity-history-{}-{}",
                      side.key(),
                      selection.stable_key()
                  )))
                  .p_2()
                  .rounded_md()
                  .border_1()
                  .border_color(if selected {
                      rgb(0x4e6fb3)
                  } else {
                      rgb(0xe2e4e8)
                  })
                  .bg(rgb(0xffffff))
                  .cursor_pointer()
                  .flex()
                  .flex_col()
                  .gap_1()
                  .child(div().text_sm().child(item.title.clone()))
                  .child(
                      div()
                          .text_xs()
                          .text_color(rgb(0x555555))
                          .child(item.subtitle.clone()),
                  )
                  .child(
                      div()
                          .text_xs()
                          .text_color(rgb(0x777777))
                          .child(format!("World time {}", item.world_time)),
                  )
                  .on_click(cx.listener(move |this, _, _, cx| this.select(side, selection, cx)))
          }

          fn render_evidence_inspector(&self, inspector: &InspectorProjection) -> Div {
              let mut sections = div().flex().flex_col().gap_3();
              for section in &inspector.sections {
                  if section.title == ENTITY_HISTORY_SECTION {
                      continue;
                  }'''
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          cargo fmt --all
      - name: Commit M140
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/world-strategy-gpui/src/lib.rs
          git commit -m "M140: navigate entity history events [m140-patch]"
          git push origin HEAD:agent/m140-entity-history-event-navigation
