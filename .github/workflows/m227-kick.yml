name: M227 kick startup probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/m227-installed-analyst-runtime-probe'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m227-installed-analyst-runtime-probe
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Extract and apply staged patch
        run: |
          awk '/python3 - <<'\''PY'\''/{capture=1; next} /^          PY$/{capture=0} capture{sub(/^          /, ""); print}' \
            .github/workflows/m227-apply-probe.yml > /tmp/m227-apply.py
          test -s /tmp/m227-apply.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/m227-apply.py')
          source = path.read_text()
          old = '''def replace_once(text, old, new, label):
    if old not in text:
        if new in text:
            return text
        raise SystemExit(f"missing patch marker: {label}")
    return text.replace(old, new, 1)
'''
          new = '''def replace_once(text, old, new, label):
    if old not in text:
        if new in text:
            return text
        if label == "desktop direct fake constructor":
            compact = "                    shutdowns: process_shutdowns,\\n                })"
            expanded = "                    shutdowns: process_shutdowns,\\n                    probe_error: None,\\n                })"
            if compact in text:
                return text.replace(compact, expanded, 1)
        raise SystemExit(f"missing patch marker: {label}")
    return text.replace(old, new, 1)
'''
          if old not in source:
              raise SystemExit('could not harden staged replace_once helper')
          path.write_text(source.replace(old, new, 1))
          PY
          python3 /tmp/m227-apply.py
          cargo fmt --all
          git diff --check
      - name: Validate probe slice
        run: |
          bash ./scripts/check-pi-analyst.sh
          cargo test -p world-analyst-client
          cargo test -p world-agent-tool-stdio
      - name: Commit product implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            NEXT_TASK.md \
            docs/PI_ANALYST.md \
            integrations/pi/world-machine-analyst-rpc.mjs \
            integrations/pi/world-machine-analyst-turn-host.mjs \
            integrations/pi/tests/world-machine-analyst-rpc.test.mjs \
            integrations/pi/tests/world-machine-analyst-turn-host.test.mjs \
            crates/world-analyst-client/src/lib.rs \
            apps/world-machine-desktop/src/analyst_session.rs
          git diff --cached --quiet && exit 0
          git commit -m "M227: probe installed analyst runtime"
          git push origin HEAD:agent/m227-installed-analyst-runtime-probe
