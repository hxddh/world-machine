name: M53A Rustfmt

on:
  push:
    branches:
      - m53a-harden-process-pack-runtime

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m53a-harden-process-pack-runtime
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: |
          rm -f .github/workflows/m53a-rustfmt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "M53A: apply workspace rustfmt" || exit 0
          git push origin HEAD:m53a-harden-process-pack-runtime
