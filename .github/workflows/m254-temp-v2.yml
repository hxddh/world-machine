name: M254 Temp V2
on:
  push:
    branches:
      - agent/m254-bound-pi-rpc-record-framing
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m254-bound-pi-rpc-record-framing
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Recover, apply, and validate M254 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/m254-temp.yml').read_text()
          start_marker = "          cat > /tmp/m254.py <<'PY'\n"
          end_marker = "          PY\n          python /tmp/m254.py"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          recovered = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          needle = "              text = p.read_text()\n              if old not in text:\n"
          replacement = """              text = p.read_text()\n              if (\n                  old not in text\n                  and path.endswith(\"world-machine-analyst-rpc.mjs\")\n                  and old.startswith(\"  #acceptChunk(chunk) {\")\n              ):\n                  start = text.index(\"  #acceptChunk(chunk) {\")\n                  finish = text.index(\"  #finish(error) {\", start)\n                  end_marker = \"    for (const waiter of waiters) waiter.reject(error);\\n  }\\n\"\n                  end = text.index(end_marker, finish) + len(end_marker)\n                  p.write_text(text[:start] + new + text[end:])\n                  return\n              if old not in text:\n"""
          if needle not in recovered:
              raise SystemExit('could not inject structured M254 replacement fallback')
          recovered = recovered.replace(needle, replacement, 1)
          recovered = recovered.replace(
              'raise SystemExit(f"pattern not found in {path}")',
              'raise SystemExit(f"pattern not found in {path}: {old[:160]!r}")',
          )
          Path('/tmp/m254.py').write_text(recovered)
          PY
          python /tmp/m254.py
          node --check integrations/pi/world-machine-analyst-rpc.mjs
          node --test integrations/pi/tests/world-machine-analyst-rpc.test.mjs integrations/pi/tests/world-machine-analyst-rpc-abort.test.mjs
          bash ./scripts/check-pi-analyst.sh
          cargo fmt --all -- --check
          git rm .github/workflows/m254-temp.yml .github/workflows/m254-temp-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add integrations/pi/world-machine-analyst-rpc.mjs integrations/pi/tests/world-machine-analyst-rpc.test.mjs
          git commit -m 'M254: bound Pi analyst RPC record framing'
          git push origin HEAD:agent/m254-bound-pi-rpc-record-framing
