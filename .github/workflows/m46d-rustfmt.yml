name: M46D Rustfmt

on:
  push:
    branches:
      - m46c-generic-world-fork
    paths:
      - .github/workflows/m46d-rustfmt.yml

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m46c-generic-world-fork
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "M46D: apply rustfmt"
          git push origin HEAD:m46c-generic-world-fork
