name: M155 patch

on:
  push:
    branches:
      - agent/m155-display-inspector-sections

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m155-display-inspector-sections
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Centralize display inspector sections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          projection_path = Path('crates/world-projection/src/lib.rs')
          projection = projection_path.read_text()
          old_struct = "\n".join([
              "pub struct InspectorProjection {",
              "    pub selection: SelectionId,",
              "    pub title: String,",
              "    pub subtitle: String,",
              "    pub sections: Vec<InspectorSection>,",
              "}",
              "",
              "#[derive(Clone, Debug, PartialEq)]",
              "pub struct InspectorSection {",
          ])
          new_struct = "\n".join([
              "pub struct InspectorProjection {",
              "    pub selection: SelectionId,",
              "    pub title: String,",
              "    pub subtitle: String,",
              "    pub sections: Vec<InspectorSection>,",
              "}",
              "",
              "impl InspectorProjection {",
              "    pub fn display_sections(&self) -> impl Iterator<Item = &InspectorSection> {",
              "        self.sections",
              "            .iter()",
              "            .filter(|section| section.title != ENTITY_HISTORY_SECTION)",
              "    }",
              "}",
              "",
              "#[derive(Clone, Debug, PartialEq)]",
              "pub struct InspectorSection {",
          ])
          assert projection.count(old_struct) == 1, f'projection struct match count: {projection.count(old_struct)}'
          projection_path.write_text(projection.replace(old_struct, new_struct))

          world_path = Path('crates/world-gpui/src/macos.rs')
          world = world_path.read_text()
          old_import = "\n".join([
              "    BriefingItem, CanvasItemKind, CollectionItem, InspectorProjection, ProjectionCommand,",
              "    ProjectionIntent, ProjectionSnapshot, SelectionId, TimelineItem, WhyNode,",
              "    ENTITY_HISTORY_SECTION,",
              "};",
          ])
          new_import = "\n".join([
              "    BriefingItem, CanvasItemKind, CollectionItem, InspectorProjection, ProjectionCommand,",
              "    ProjectionIntent, ProjectionSnapshot, SelectionId, TimelineItem, WhyNode,",
              "};",
          ])
          assert world.count(old_import) == 1, f'world import count: {world.count(old_import)}'
          world = world.replace(old_import, new_import)
          old_loop = "\n".join([
              "    for section in &inspector.sections {",
              "        if section.title == ENTITY_HISTORY_SECTION {",
              "            continue;",
              "        }",
              "        let mut rows = div().flex().flex_col().gap_1();",
          ])
          new_loop = "\n".join([
              "    for section in inspector.display_sections() {",
              "        let mut rows = div().flex().flex_col().gap_1();",
          ])
          assert world.count(old_loop) == 1, f'world loop count: {world.count(old_loop)}'
          world_path.write_text(world.replace(old_loop, new_loop))

          strategy_path = Path('crates/world-strategy-gpui/src/lib.rs')
          strategy = strategy_path.read_text()
          old_import = "\n".join([
              "use world_projection::{",
              "    InspectorProjection, ProjectionCommand, ProjectionSnapshot, SelectionId, TimelineItem, WhyNode,",
              "    ENTITY_HISTORY_SECTION,",
              "};",
          ])
          new_import = "\n".join([
              "use world_projection::{",
              "    InspectorProjection, ProjectionCommand, ProjectionSnapshot, SelectionId, TimelineItem, WhyNode,",
              "};",
          ])
          assert strategy.count(old_import) == 1, f'strategy import count: {strategy.count(old_import)}'
          strategy = strategy.replace(old_import, new_import)
          old_loop = "\n".join([
              "        for section in &inspector.sections {",
              "            if section.title == ENTITY_HISTORY_SECTION {",
              "                continue;",
              "            }",
              "            let mut rows = div().flex().flex_col().gap_1();",
          ])
          new_loop = "\n".join([
              "        for section in inspector.display_sections() {",
              "            let mut rows = div().flex().flex_col().gap_1();",
          ])
          assert strategy.count(old_loop) == 1, f'strategy loop count: {strategy.count(old_loop)}'
          strategy_path.write_text(strategy.replace(old_loop, new_loop))
          PY
          cargo fmt --all
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/world-projection/src/lib.rs crates/world-gpui/src/macos.rs crates/world-strategy-gpui/src/lib.rs
          git commit -m "M155: centralize display inspector sections"
          git push origin HEAD:agent/m155-display-inspector-sections
