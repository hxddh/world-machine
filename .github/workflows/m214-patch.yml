name: M214 read-only analyst tool host patch

on:
  push:
    branches:
      - agent/m214-readonly-tool-host
    paths:
      - .github/workflows/m214-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Apply M214 patch
        run: python3 .github/m214_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Check boundaries
        run: bash ./scripts/check-boundaries.sh
      - name: Test agent tools
        run: cargo test -p world-agent-tools
      - name: Test investigation regression
        run: cargo test -p world-investigation
      - name: Clippy
        run: cargo clippy -p world-agent-tools -p world-investigation --all-targets -- -D warnings
      - name: Commit implementation
        run: |
          git config user.name hxddh
          git config user.email hxddh@users.noreply.github.com
          git add NEXT_TASK.md crates/world-agent-tools/src/lib.rs
          if ! git diff --cached --quiet; then
            git commit -m "M214: add read-only analyst tool host"
            git push
          fi
