name: M194 implementation patch

on:
  push:
    branches:
      - agent/m194-causal-path

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m194-causal-path
          fetch-depth: 0
      - name: Apply implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          patch = Path('.github/m194_patch.py')
          source = patch.read_text()
          write_at = source.index('lib.write_text(text)')
          failing_at = source.rfind('text = replace_once(', 0, write_at)
          if failing_at < 0:
              raise SystemExit('could not locate final staged replace_once')
          patch.write_text(source[:failing_at] + source[write_at:])
          PY
          python3 .github/m194_patch.py
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('crates/world-query/src/lib.rs')
          text = lib.read_text()
          anchor = '''            (
                QueryError::SelectionNotVisibleInEitherWorld("relation-5".into()),'''
          insertion = '''            (
                QueryError::NoCausalPath {
                    from: "event-1".into(),
                    to: "event-9".into(),
                },
                r#"{"error":"no-causal-path","details":{"from":"event-1","to":"event-9"}}"#,
            ),
''' + anchor
          if text.count(anchor) != 1:
              raise SystemExit(f'NoCausalPath serde anchor count: {text.count(anchor)}')
          lib.write_text(text.replace(anchor, insertion, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Boundary checks
        run: bash ./scripts/check-boundaries.sh
      - name: Query tests
        run: cargo test -p world-query
      - name: CLI tests
        run: cargo test -p world-cli
      - name: Focused clippy
        run: cargo clippy -p world-query -p world-cli --all-targets -- -D warnings
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/world-query/src/lib.rs crates/world-query/tests/causal_path.rs crates/world-cli/tests/machine_query_causal_path.rs NEXT_TASK.md
          git diff --cached --check
          git commit -m "M194: add machine causal path"
          git push origin HEAD:agent/m194-causal-path
