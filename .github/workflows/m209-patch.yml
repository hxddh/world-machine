name: M209 read-only investigation orchestrator patch

on:
  push:
    branches:
      - agent/m209-readonly-investigation-orchestrator
    paths:
      - .github/workflows/m209-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Apply M209 patch
        run: python .github/m209_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Check boundaries
        run: bash ./scripts/check-boundaries.sh
      - name: Test investigation crate
        run: cargo test -p world-investigation
      - name: Clippy investigation crate
        run: cargo clippy -p world-investigation --all-targets -- -D warnings
      - name: Test world-query regression
        run: cargo test -p world-query
      - name: Commit implementation
        run: |
          git config user.name hxddh
          git config user.email hxddh@users.noreply.github.com
          git add Cargo.toml Cargo.lock NEXT_TASK.md scripts/check-boundaries.sh crates/world-investigation
          if ! git diff --cached --quiet; then
            git commit -m "M209: add read-only investigation orchestrator"
            git push
          fi
