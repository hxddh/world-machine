name: M57 Catalog Path Fix

on:
  push:
    branches:
      - m57-pack-authoring-sdk

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m57-pack-authoring-sdk
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - run: python scripts/m57_catalog_path_fix.py
      - run: cargo fmt --all
      - run: cargo test -p world-pack-catalog
      - run: cargo clippy -p world-pack-catalog --all-targets -- -D warnings
      - name: Commit catalog path fix
        run: |
          rm -f scripts/m57_catalog_path_fix.py .github/workflows/m57-catalog-path.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "M57: canonicalize missing catalog paths through existing ancestors" || exit 0
          git push origin HEAD:m57-pack-authoring-sdk
