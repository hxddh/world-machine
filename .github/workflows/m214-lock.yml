name: M214 generate host lockfile

on:
  push:
    branches:
      - agent/m214-analyst-tool-host
    paths:
      - .github/workflows/m214-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate host and generate lockfile
        run: |
          cargo fmt --all -- --check
          cargo test -p world-agent-tool-host
          cargo clippy -p world-agent-tool-host --all-targets -- -D warnings
      - name: Commit lockfile
        run: |
          git config user.name hxddh
          git config user.email hxddh@users.noreply.github.com
          git add Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: update lockfile for analyst tool host"
            git push
          fi
