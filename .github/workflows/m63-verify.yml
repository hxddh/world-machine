name: M63 Pocket Universe Agent Minds Verify

on:
  push:
    branches: [m63-pocket-universe-agent-minds]
    paths:
      - '.github/workflows/m63-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m63-pocket-universe-agent-minds
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python scripts/m63_agent_minds.py
      - run: python scripts/m63_agent_test_fix.py
      - run: python scripts/m63_agent_import_fix.py
      - run: cargo fmt --all
      - run: cargo test -p pocket-universe
      - run: cargo test -p pocket-universe-pack
      - run: cargo clippy -p pocket-universe -p pocket-universe-pack --all-targets -- -D warnings
      - run: bash ./scripts/check-boundaries.sh
      - name: Commit verified agent-mind slice
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock worlds/pocket-universe apps/pocket-universe-pack
          git commit -m 'M63: give Pocket Universe actors replaceable minds'
          git push origin HEAD:m63-pocket-universe-agent-minds
