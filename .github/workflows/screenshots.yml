name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-screenshots:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gpui-macos

      - name: Build World Machine.app
        run: bash apps/world-machine-desktop/macos/build-app.sh

      - name: Prepare a demonstration library
        run: |
          LIB="$RUNNER_TEMP/world-machine/Worlds"
          mkdir -p "$LIB"
          cargo run -p pocket-universe --example demo_world -- "$LIB"
          # Tiny Society is the Pack that tells the canvas where things are, so
          # it is the only World here the window draws as a place rather than
          # as a list. Without it these shots say nothing about that drawing.
          cargo run -p tiny-society --example demo_world -- "$LIB"
          echo "WM_LIB=$LIB" >> "$GITHUB_ENV"

      - name: Launch the app and capture the screen
        run: |
          set -x
          APP="$PWD/target/bundle/World Machine.app"
          mkdir -p shots
          system_profiler SPDisplaysDataType | grep -E "Resolution|UI Looks" || true
          # LaunchServices-launched apps read the user session environment.
          launchctl setenv WORLD_MACHINE_LIBRARY_DIR "$WM_LIB"
          launchctl setenv WORLD_MACHINE_NO_UPDATE_CHECK 1
          launchctl setenv RUST_LOG info
          launchctl setenv RUST_BACKTRACE 1
          open -a "$APP" --stdout "$RUNNER_TEMP/app.stdout.log" --stderr "$RUNNER_TEMP/app.stderr.log"
          sleep 8
          screencapture -x shots/00-home-first-launch.png
          # Included Packs are installed and probed in the background on first
          # launch; give that time to finish before the settled Home shot.
          sleep 30
          screencapture -x shots/01-home.png
          open -a "$APP" "$WM_LIB/ares-pocket-colony.world"
          sleep 15
          screencapture -x shots/02-world-pressure.png
          open -a "$APP" "$WM_LIB/maple-street-1987.world"
          sleep 15
          screencapture -x shots/03-world-fresh.png
          # The drawn town: a shut bakery and an empty mooring.
          open -a "$APP" "$WM_LIB/harbour-town.world"
          sleep 15
          screencapture -x shots/03b-world-drawn.png
          # How much of a big window the layout actually uses is a question
          # the shots above cannot answer: both windows open at their default
          # size. Seed the remembered geometry with a rectangle the size of the
          # runner's screen and reopen, so there is a wide shot to compare.
          osascript -e 'tell application "World Machine" to quit' || true
          sleep 3
          STATE="$HOME/Library/Application Support/World Machine/Window State.json"
          mkdir -p "$(dirname "$STATE")"
          WIDE='{"x":0,"y":25,"width":1024,"height":740}'
          printf '{"version":1,"home":%s,"world":%s}\n' "$WIDE" "$WIDE" > "$STATE"
          cat "$STATE"
          open -a "$APP"
          sleep 12
          screencapture -x shots/04-home-wide.png
          open -a "$APP" "$WM_LIB/ares-pocket-colony.world"
          sleep 12
          screencapture -x shots/05-world-wide.png
          open -a "$APP" "$WM_LIB/harbour-town.world"
          sleep 12
          screencapture -x shots/05b-world-drawn-wide.png
          # Full screen is a green-button/⌃⌘F affordance rather than anything
          # the app draws, so the only way to know it works is to ask for it.
          #
          # It does not work here, and the control shot below is how we know:
          # cmd-m, which the app binds itself, does not minimize the window
          # either. GitHub's macOS runners grant no Accessibility permission,
          # so System Events accepts the command, osascript exits 0, and the
          # keystroke goes nowhere. Both shots are kept because they cost
          # nothing and would start working if that ever changed, but neither
          # is evidence about the app today: anything needing keyboard or
          # mouse input has to be checked on a real Mac.
          osascript -e 'tell application "System Events" to keystroke "f" using {control down, command down}' \
            || echo "UI scripting refused: full screen not exercised"
          sleep 8
          screencapture -x shots/06-fullscreen-attempt.png
          # A window that did not go full screen has two possible causes, and
          # they need different fixes: the app has no such shortcut, or the
          # runner never delivered the keystroke. cmd-m is bound by the app
          # itself, so this shot tells the two apart — a minimized window here
          # means UI scripting works and shot 06 is about the app.
          osascript -e 'tell application "System Events" to keystroke "m" using {command down}' \
            || echo "UI scripting refused: the minimize control shot proves nothing"
          sleep 5
          screencapture -x shots/07-ui-scripting-control.png
          osascript -e 'tell application "World Machine" to quit' || true
          sleep 2
          launchctl unsetenv WORLD_MACHINE_LIBRARY_DIR || true
          launchctl unsetenv WORLD_MACHINE_NO_UPDATE_CHECK || true
          launchctl unsetenv RUST_LOG || true
          launchctl unsetenv RUST_BACKTRACE || true
          ls -la shots
          ls -la "$WM_LIB" "$WM_LIB/.world-machine-packs" || true
          echo "===== app stdout"; cat "$RUNNER_TEMP/app.stdout.log" || true
          echo "===== app stderr"; cat "$RUNNER_TEMP/app.stderr.log" || true
          echo "===== window state after the wide run"; cat "$STATE" || true
          echo "===== fonts"; fc-list 2>/dev/null | wc -l || true; ls /System/Library/Fonts | head -5
          echo "===== gpu"; system_profiler SPDisplaysDataType || true
          cp "$RUNNER_TEMP"/app.*.log shots/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: world-machine-screenshots-${{ matrix.runner }}
          path: shots/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish screenshots to a branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="screenshots/run-$GITHUB_RUN_ID-${{ matrix.runner }}"
          git checkout -b "$BRANCH"
          mkdir -p docs/screenshots
          cp shots/* docs/screenshots/
          git add docs/screenshots
          git commit -m "screenshots: capture from run $GITHUB_RUN_ID on ${{ matrix.runner }}"
          git push origin "$BRANCH"
