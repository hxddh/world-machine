name: Nightly bars

# The claims that carry the product (three-year variety, the ten-year
# wire fit, Chinese coverage, the red team on unseen sets, the five-player
# harnesses, the painter's frame budget) live in `#[ignore]`d tests: each
# takes from seconds to minutes in a release build, too long for every
# push. This workflow runs every one of them, every night, in release,
# along with the rest of the workspace in release (which is how the
# release-only strip failure of v0.23 went unseen: CI builds debug).
#
# A release is built only from a commit this workflow passed on
# (release-package.yml's nightly-gate), so run it by hand on the commit
# before cutting a release tag:
#   gh workflow run nightly.yml --ref main
# A red scheduled night opens an issue (report-red-night, below).
#
# It also soaks the release app for two hours in its real window (the
# `soak` job, scripts/soak.sh): memory, frames, no growth.
#
# It is also where the tests too slow for every pull request run: the
# tile painter's slow picture bars, which ci.yml skips by name (its SLOW
# list), run here in release with the rest of the workspace. Nothing here
# skips them (scripts/check-workflows.py holds that).

on:
  schedule:
    # 03:17 UTC, off the hour so it is not queued behind every other cron.
    - cron: '17 3 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Tests that are tools, not bars: they write pictures, sheets, sounds or
  # fixtures for a person to look at or to check in, or print numbers for a
  # review, and assert nothing (several panic without their environment
  # variable). They are skipped by name, as substrings of the test path.
  #
  #   write_people_sheet, write_person_sheet  world-projection: drawing sheets (WORLD_MACHINE_SHEET)
  #   write_sheets                           both Packs: drawing sheets (WORLD_MACHINE_SHEET)
  #   write_contact_sheets                   world-gpui: contact sheets (WORLD_GPUI_CONTACT_SHEET)
  #   composition_pictures                   world-gpui: pictures to look at (WORLD_GPUI_PICTURES)
  #   sketch_the_panels_and_the_ages         world-gpui: pictures to look at (WORLD_GPUI_SKETCH)
  #   write_sounds                           world-sound: audio to listen to (WORLD_MACHINE_SOUNDS)
  #   write_untranslated                     world-builtins: a list for translators
  #   show_lines                             world-builtins: prints lines for translators
  #   write_place_fixtures                   pocket-universe: regenerates world-gpui fixtures
  #   write_this_release_save                both Packs: write a release's save to check in
  #                                          (WORLD_PACK_WRITE_RELEASE; docs/SAVES.md)
  #   show_sixty_periods, show_sixty_days, show_stories, probe_parts, measure_a_year
  #                                          both Packs: print for a review, assert nothing
  #   time_a_year_old_world                  pocket-universe: prints timings, asserts nothing
  #   judge_prompts_are_written              both Packs: writes the judge's prompts for a person
  #                                          to answer (WORLD_MACHINE_JUDGE_DIR); panics without it
  #   judged_metrics                         testkit: reads those answers back and prints the
  #                                          numbers (WORLD_MACHINE_JUDGE_DIR); panics without it
  #   a_blind_fresh_set_is_heard             tiny-society: measures a blind hearing set kept
  #                                          outside the repository, once a release, by hand
  #                                          (FRESH_DIR); panics without it
  TOOLS: >-
    --skip write_people_sheet
    --skip write_person_sheet
    --skip write_sheets
    --skip write_contact_sheets
    --skip composition_pictures
    --skip sketch_the_panels_and_the_ages
    --skip write_sounds
    --skip write_untranslated
    --skip show_lines
    --skip write_place_fixtures
    --skip write_this_release_save
    --skip show_sixty_periods
    --skip show_sixty_days
    --skip show_stories
    --skip probe_parts
    --skip measure_a_year
    --skip time_a_year_old_world
    --skip judge_prompts_are_written
    --skip judged_metrics
    --skip a_blind_fresh_set_is_heard
  # Wall-clock budgets run in their own job below, so a slow shared runner
  # shows up as a timing failure and never hides whether the long bars held.
  TIMING: >-
    --skip a_three_year_world_paints_within_its_frame_budget
    --skip a_three_year_snapshot_takes_under_fifteen_milliseconds
    --skip a_three_year_turn_with_its_save_takes_under_thirty_five_milliseconds
    --skip a_three_year_first_look_after_a_day_takes_under_twenty_milliseconds
    --skip a_three_year_world_holds_at_most_a_hundred_megabytes_after_twenty_days
    --skip at_three_years_turns_under_thirty_milliseconds_with_its_save
    --skip at_three_years_looks_again_under_fifteen_milliseconds
    --skip rendering_the_full_mix_costs_little

jobs:
  long-bars:
    name: Every ignored bar, and the workspace, in release
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - name: Make room for a release build of the workspace
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: nightly-release
          save-if: ${{ github.event_name == 'schedule' }}
      - name: Build the workspace's tests in release
        run: cargo test --release --locked --workspace --exclude world-machine-desktop --no-run
      # Both Packs' long tests (three years of lives, stories, towns, plots
      # and agency; the careful player; the red team's later blind sets; the
      # five-player harnesses), world-library's three years, Chinese
      # coverage in world-builtins and Pocket Universe, the process Packs'
      # long worlds and the ten-year wire fit, and world-sound's bars, with
      # everything that is not ignored alongside, all in release.
      - name: Run every bar in release
        # TOOLS and TIMING are lists of flags, split on purpose.
        run: |
          # shellcheck disable=SC2086
          cargo test --release --locked --workspace --exclude world-machine-desktop \
            --no-fail-fast -- --include-ignored $TOOLS $TIMING

  timing-bars:
    name: Frame and snapshot budgets in release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: nightly-timing
          save-if: ${{ github.event_name == 'schedule' }}
      # These assert wall-clock budgets. GitHub's shared runners are slower
      # and noisier than the machines the budgets were set on, so a red run
      # here is a prompt to measure on a quiet machine, not proof on its own.
      # The tile painter (the strip, covers, postcards and goldens) paints a
      # three-year World's still layers in under a second and plans a frame
      # over them in 8 ms. Its other bar, that the World window never
      # waited for painting, measured the tile painter's off-thread path and
      # went with it when the window moved to the living stage (84f2f3ef);
      # the living stage's 120 Hz bar is reported by ci.yml's
      # living-stage-macos job and judged on a real Mac.
      - name: The tile painter paints a three-year World within its frame budget
        run: >-
          cargo test --release --locked -p world-gpui --lib -- --ignored
          a_three_year_world_paints_within_its_frame_budget
      - name: Each Pocket Universe place turns in under 30 ms and looks again in under 15 ms at three years
        run: >-
          cargo test --release --locked -p world-library --test pocket_three_years --
          --ignored --test-threads=1
      - name: Rendering the full sound mix costs little
        run: >-
          cargo test --release --locked -p world-sound --test bars --
          --test-threads=1 rendering_the_full_mix_costs_little
      - name: A three-year snapshot takes under 15 ms
        run: >-
          cargo test --release --locked -p world-library --test three_years --
          --ignored --test-threads=1 a_three_year_snapshot_takes_under_fifteen_milliseconds
      # The first-look (20 ms) and memory (100 MB) bars of v0.27 are measured
      # but not yet met (see docs/KNOWN_ISSUES.md), so they report without
      # failing the night, as the turn bar below does.
      - name: The first look at a three-year World after a day takes under 20 ms (measured)
        continue-on-error: true
        run: >-
          cargo test --release --locked -p tiny-society --test first_look --
          --ignored --test-threads=1 a_three_year_first_look_after_a_day_takes_under_twenty_milliseconds
      - name: A three-year World holds at most 100 MB after 20 days (measured)
        continue-on-error: true
        run: >-
          cargo test --release --locked -p world-library --test three_years --
          --ignored --test-threads=1 a_three_year_world_holds_at_most_a_hundred_megabytes_after_twenty_days
      # The 35 ms turn bar is measured but not yet met on shared runners
      # (see docs/KNOWN_ISSUES.md), so it reports without failing the night.
      - name: A three-year turn with its save (measured)
        continue-on-error: true
        run: >-
          cargo test --release --locked -p world-library --test three_years --
          --ignored --test-threads=1 a_three_year_turn_with_its_save_takes_under_thirty_five_milliseconds

  # The soak (1.0 P7): the release app in its real window (Linux, Xvfb, as
  # the release shots run it) driven for two hours through a World's many
  # sittings, playing freely: cards answered, days passed, Sleep now,
  # mornings, talk, the hands, the camera and the drawer. scripts/soak.sh
  # samples its memory and reads its frame logs; scripts/soak-analyze.py
  # fails the night on a panic, any unpainted frame, RSS growing past its
  # bound after warm-up, the frame time's p95 regressing, or a driver that
  # stopped moving the World (docs/TESTING.md has the bounds). Nightly
  # only: never on a pull request (scripts/check-workflows.py holds that).
  soak:
    name: Two hours in the real window, no growth (release, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - name: Make room for a release build of the app
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: soak
          save-if: ${{ github.event_name == 'schedule' }}
      - name: Install the window's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xdotool x11-utils x11-apps imagemagick \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libx11-xcb-dev libvulkan-dev mesa-vulkan-drivers \
            libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev \
            fonts-dejavu-core fonts-noto-cjk
      - name: Soak the release app for two hours
        env:
          SOAK_MINUTES: "120"
        run: bash scripts/soak.sh "$RUNNER_TEMP/soak"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: soak
          path: ${{ runner.temp }}/soak
          if-no-files-found: error
          retention-days: 30

  # A red scheduled night is noticed: it opens an issue (or comments on the
  # one still open), and the next green night closes it. Nights started by
  # hand or by a release report in their own run.
  report-red-night:
    name: Report a red night
    needs: [long-bars, timing-bars, soak]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the red-night issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LONG: ${{ needs.long-bars.result }}
          TIMING: ${{ needs.timing-bars.result }}
          SOAK: ${{ needs.soak.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The nightly bars are red"
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [[ "$LONG" == "success" && "$TIMING" == "success" && "$SOAK" == "success" ]]; then
              if [[ -n "$number" ]]; then
                  gh issue close "$number" --comment "Green again on $GITHUB_SHA: $RUN_URL"
              fi
              exit 0
          fi
          body="The scheduled nightly on \`$GITHUB_SHA\` was red: long bars $LONG, timing bars $TIMING, soak $SOAK.

          $RUN_URL

          No release is published from a commit whose nightly is not green (release-package.yml, nightly-gate)."
          if [[ -n "$number" ]]; then
              gh issue comment "$number" --body "$body"
          else
              gh issue create --title "$title" --body "$body"
          fi
