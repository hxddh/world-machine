name: M259 Implement V2

on:
  push:
    branches:
      - agent/m259-bound-tool-host-stdin-jsonl

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m259-bound-tool-host-stdin-jsonl
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply M259 patch and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/m259-implement.yml').read_text()
          start = workflow.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = workflow.index("          PY\n", start)
          script = workflow[start:end]
          lines = []
          for line in script.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines)
          exec(compile(script, 'm259-original-patch', 'exec'))

          p = Path('crates/world-agent-tool-stdio/src/main.rs')
          s = p.read_text()
          old = '\n'.join([
              '        let source = include_str!("main.rs");',
              '        assert!(source.contains("MAX_TOOL_REQUEST_BYTES"));',
              '        assert!(source.contains(',
              '            "serve_json_lines_with_limit(host, reader, writer, MAX_TOOL_REQUEST_BYTES)"',
              '        ));',
              '        assert!(!source.contains("reader.lines().enumerate()"));',
          ])
          new = '\n'.join([
              '        let source = include_str!("main.rs");',
              '        let production = source.split("#[cfg(test)]").next().unwrap();',
              '        assert!(production.contains("MAX_TOOL_REQUEST_BYTES"));',
              '        assert!(production.contains(',
              '            "serve_json_lines_with_limit(host, reader, writer, MAX_TOOL_REQUEST_BYTES)"',
              '        ));',
              '        assert!(!production.contains("reader.lines().enumerate()"));',
          ])
          if old not in s:
              raise SystemExit('production source regression block not found')
          p.write_text(s.replace(old, new))
          PY
          cargo fmt --all
          cargo test -p world-agent-tool-stdio
          cargo clippy -p world-agent-tool-stdio --all-targets -- -D warnings
          bash ./scripts/check-boundaries.sh
          bash ./scripts/check-pi-analyst.sh
          cargo fmt --all -- --check
          git rm .github/workflows/m259-implement.yml .github/workflows/m259-implement-v2.yml
          git add crates/world-agent-tool-stdio/src/main.rs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'M259: bound tool-host stdin JSONL framing'
          git push origin HEAD:agent/m259-bound-tool-host-stdin-jsonl
