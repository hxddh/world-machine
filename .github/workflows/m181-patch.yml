name: M181 patch
on:
  push:
    branches:
      - agent/m181-cli-evidence-path
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m181-cli-evidence-path
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: semantic
      - name: Apply shortest evidence path command
        run: |
          python3 .github/scripts/m181_cli_evidence_path.py
          cargo fmt --all
          cargo test -p world-cli
          cargo clippy -p world-cli --all-targets -- -D warnings
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/world-cli/src/main.rs
          if git diff --cached --quiet; then
            echo "No patch produced" >&2
            exit 1
          fi
          git commit -m "M181: query shortest evidence paths from CLI"
          git push origin HEAD:agent/m181-cli-evidence-path
