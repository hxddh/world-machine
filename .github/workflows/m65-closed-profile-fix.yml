name: M65 Closed Mind Provenance

on:
  push:
    branches: [m65-pocket-universe-mind-provenance]
    paths:
      - '.github/workflows/m65-closed-profile-fix.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m65-pocket-universe-mind-provenance
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python scripts/m65_closed_profile_fix.py
      - run: cargo fmt --all
      - run: cargo test -p pocket-universe
      - run: cargo test -p pocket-universe-pack
      - run: cargo clippy -p pocket-universe -p pocket-universe-pack --all-targets -- -D warnings
      - run: bash ./scripts/check-boundaries.sh
      - name: Commit closed provenance profiles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worlds/pocket-universe/src/lib.rs
          git commit -m 'M65: restrict durable mind provenance to a closed set'
          git push origin HEAD:m65-pocket-universe-mind-provenance
