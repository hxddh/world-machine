name: M118 bound lineage preview

on:
  push:
    branches:
      - agent/m118-bounded-lineage-preview
    paths:
      - scripts/m118-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m118-bounded-lineage-preview
      - uses: dtolnay/rust-toolchain@stable
      - name: Bound My Worlds lineage preview
        run: python scripts/m118_patch.py
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit product change
        shell: bash
        run: |
          git config user.name "world-machine-m118"
          git config user.email "actions@users.noreply.github.com"
          git add apps/world-machine-desktop/src/main.rs
          git diff --cached --quiet && { echo "patch produced no product changes" >&2; exit 1; }
          git commit -m "M118: bound lineage links in My Worlds"
          git push origin HEAD:agent/m118-bounded-lineage-preview
