name: M74 apply external Pack test isolation

on:
  push:
    branches:
      - m74-pack-test-isolation
    paths:
      - '.github/workflows/m74-apply-test-isolation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m74-pack-test-isolation
      - name: Harden external Pack test temp directories
        run: |
          python3 scripts/m74_harden_pack_test_dirs.py
          cargo fmt --all
      - name: Commit hardening and remove one-shot helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m74-apply-test-isolation.yml scripts/m74_harden_pack_test_dirs.py
          git add apps/tiny-society-pack/tests/external_pack.rs apps/pocket-universe-pack/tests/external_pack.rs apps/micro-company-pack/tests/external_pack.rs
          git commit -m "M74: isolate external Pack test directories"
          git push origin HEAD:m74-pack-test-isolation
