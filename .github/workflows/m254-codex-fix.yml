name: M254 Codex Fix
on:
  push:
    branches:
      - agent/m254-bound-pi-rpc-record-framing
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m254-bound-pi-rpc-record-framing
      - name: Apply Codex fixes and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def rep(path, old_lines, new_lines):
              p = Path(path)
              text = p.read_text()
              old = '\n'.join(old_lines)
              new = '\n'.join(new_lines)
              if old not in text:
                  raise SystemExit(f'pattern missing in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          rpc = 'integrations/pi/world-machine-analyst-rpc.mjs'
          rep(rpc,
              ['    this.closed = false;', '    this.busy = false;'],
              ['    this.closed = false;', '    this.terminationPromise = null;', '    this.busy = false;'])
          rep(rpc,
              ['    try {', '      return await Promise.race(races);', '    } catch (error) {', '      recordPromise.catch(() => {});', '      throw error;', '    } finally {'],
              ['    try {', '      const record = await Promise.race(races);', '      if (this.closedError) throw this.closedError;', '      return record;', '    } catch (error) {', '      recordPromise.catch(() => {});', '      throw error;', '    } finally {'])
          rep(rpc,
              ['    this.records.length = 0;', '    this.#finish(error);', '    this.kill();'],
              ['    this.records.length = 0;', '    void this.#terminateAfterBrokenTurn(error);'])
          rep(rpc,
              ['  async #terminateAfterBrokenTurn(error) {', '    this.closed = true;', '    this.#finish(error);', '    if (this.child.exitCode !== null || this.child.signalCode !== null) return;', '', '    const exited = once(this.child, "exit");', '    this.child.kill("SIGTERM");', '    await settledBefore(exited, DEFAULT_SHUTDOWN_TIMEOUT_MS);', '    if (this.child.exitCode === null && this.child.signalCode === null) {', '      this.child.kill("SIGKILL");', '    }', '  }'],
              ['  #terminateAfterBrokenTurn(error) {', '    if (this.terminationPromise) return this.terminationPromise;', '    this.closed = true;', '    this.#finish(error);', '    this.terminationPromise = (async () => {', '      if (this.child.exitCode !== null || this.child.signalCode !== null) return;', '', '      const exited = once(this.child, "exit");', '      this.child.kill("SIGTERM");', '      await settledBefore(exited, DEFAULT_SHUTDOWN_TIMEOUT_MS);', '      if (this.child.exitCode === null && this.child.signalCode === null) {', '        this.child.kill("SIGKILL");', '      }', '    })().catch(() => {});', '    return this.terminationPromise;', '  }'])

          tests = 'integrations/pi/tests/world-machine-analyst-rpc.test.mjs'
          rep(tests,
              ['function controlledSession(onRequest, options = {}) {', '  const child = new EventEmitter();'],
              ['function controlledSession(onRequest, options = {}, control = {}) {', '  const child = new EventEmitter();'])
          rep(tests,
              ['  child.signalCode = null;', '  child.kill = (signal = "SIGTERM") => {', '    if (child.exitCode !== null || child.signalCode !== null) return false;', '    child.signalCode = signal;', '    queueMicrotask(() => child.emit("exit", null, signal));', '    return true;', '  };'],
              ['  child.signalCode = null;', '  const killSignals = [];', '  child.kill = (signal = "SIGTERM") => {', '    if (child.exitCode !== null || child.signalCode !== null) return false;', '    killSignals.push(signal);', '    if (signal === "SIGTERM" && control.ignoreSigterm === true) return true;', '    child.signalCode = signal;', '    queueMicrotask(() => child.emit("exit", null, signal));', '    return true;', '  };'])
          rep(tests,
              ['  return { session: new PiAnalystRpcSession(child, options), child };'],
              ['  return { session: new PiAnalystRpcSession(child, options), child, killSignals };'])
          marker = 'test("Pi RPC framing never recovers from an oversized prefix in the same chunk", async () => {'
          text = Path(tests).read_text()
          at = text.index(marker)
          addition = '''test("Pi RPC framing rejects the active turn when a later same-chunk record overflows", async () => {\n  const maxRecordBytes = 160;\n  const { session, child } = controlledSession((request, stdout) => {\n    stdout.write(\n      `${promptAck(request.id)}\\n${JSON.stringify({ type: "agent_settled" })}\\n${"x".repeat(maxRecordBytes + 2)}\\n`,\n    );\n  }, { maxRecordBytes });\n\n  await assert.rejects(\n    session.prompt("question", { timeoutMs: 2000 }),\n    (error) => error instanceof PiAnalystRpcProtocolError && /record exceeded/.test(error.message),\n  );\n  assert.equal(child.signalCode, "SIGTERM");\n});\n\ntest("Pi RPC framing escalates idle overflow termination to SIGKILL", async () => {\n  const maxRecordBytes = 32;\n  const { session, child, killSignals } = controlledSession(\n    () => {},\n    { maxRecordBytes },\n    { ignoreSigterm: true },\n  );\n\n  child.stdout.write(Buffer.alloc(maxRecordBytes + 2, 0x78));\n  await assert.rejects(\n    session.prompt("after idle overflow", { timeoutMs: 2000 }),\n    (error) => error instanceof PiAnalystRpcProtocolError && /record exceeded/.test(error.message),\n  );\n  await new Promise((resolve) => setTimeout(resolve, 1100));\n  assert.deepEqual(killSignals, ["SIGTERM", "SIGKILL"]);\n  assert.equal(child.signalCode, "SIGKILL");\n});\n\n'''
          Path(tests).write_text(text[:at] + addition + text[at:])
          PY
          node --check integrations/pi/world-machine-analyst-rpc.mjs
          node --test integrations/pi/tests/world-machine-analyst-rpc.test.mjs integrations/pi/tests/world-machine-analyst-rpc-abort.test.mjs
          bash ./scripts/check-pi-analyst.sh
          cargo fmt --all -- --check
          git rm .github/workflows/m254-codex-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add integrations/pi/world-machine-analyst-rpc.mjs integrations/pi/tests/world-machine-analyst-rpc.test.mjs
          git commit -m 'M254: make framing contamination win terminal races'
          git push origin HEAD:agent/m254-bound-pi-rpc-record-framing
