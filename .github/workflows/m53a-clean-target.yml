name: M53A Clean Build Artifacts

on:
  push:
    branches:
      - m53a-harden-process-pack-runtime

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m53a-harden-process-pack-runtime
      - name: Remove tracked build artifacts
        run: |
          git rm -r --ignore-unmatch target
          printf '/target/\n' > .gitignore
          rm -f .github/workflows/m53a-clean-target.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "M53A: remove tracked build artifacts" || exit 0
          git push origin HEAD:m53a-harden-process-pack-runtime
