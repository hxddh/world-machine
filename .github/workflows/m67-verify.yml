name: M67 Pocket Universe Relationships Verify

on:
  push:
    branches: [m67-pocket-universe-relationships]
    paths:
      - '.github/workflows/m67-verify.yml'
      - 'scripts/m67_relationships.py'
      - 'scripts/m67_why_test_fix.py'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m67-pocket-universe-relationships
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python scripts/m67_relationships.py
      - run: python scripts/m67_why_test_fix.py
      - run: cargo fmt --all
      - run: cargo test -p pocket-universe
      - run: cargo test -p pocket-universe-pack
      - run: cargo clippy -p pocket-universe -p pocket-universe-pack --all-targets -- -D warnings
      - run: bash ./scripts/check-boundaries.sh
      - name: Commit verified relationship slice
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock worlds/pocket-universe apps/pocket-universe-pack
          git commit -m 'M67: make agent relationships durable and steerable'
          git push origin HEAD:m67-pocket-universe-relationships
