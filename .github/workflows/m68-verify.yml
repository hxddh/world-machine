name: M68 Pocket Universe Social Perception Verify

on:
  push:
    branches: [m68-pocket-universe-social-perception]
    paths:
      - '.github/workflows/m68-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m68-pocket-universe-social-perception
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python scripts/m68_social_perception.py
      - run: cargo fmt --all
      - run: cargo test -p pocket-universe
      - run: cargo test -p pocket-universe-pack
      - run: cargo clippy -p pocket-universe -p pocket-universe-pack --all-targets -- -D warnings
      - run: bash ./scripts/check-boundaries.sh
      - name: Commit verified social-perception slice
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock worlds/pocket-universe apps/pocket-universe-pack
          git commit -m 'M68: make agent minds relationship-aware'
          git push origin HEAD:m68-pocket-universe-social-perception
