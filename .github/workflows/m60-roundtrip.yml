name: M60 Durable Roundtrip Consistency

on:
  push:
    branches: [m60-pack-activation-probe]
    paths:
      - '.github/workflows/m60-roundtrip.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m60-pack-activation-probe
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python scripts/m60_roundtrip_consistency.py
      - run: cargo fmt --all
      - run: cargo test -p world-pack-process
      - run: cargo clippy -p world-pack-process --all-targets -- -D warnings
      - name: Exercise real external Pack launch concurrency repeatedly
        run: |
          for run in 1 2 3; do
            echo "tiny-society-pack pass $run"
            cargo test -p tiny-society-pack
          done
      - run: bash ./scripts/check-boundaries.sh
      - name: Commit round-trip consistency and launch retry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/world-pack-process/src/lib.rs
          git commit -m 'M60: harden durable activation probe launches'
          git push origin HEAD:m60-pack-activation-probe
