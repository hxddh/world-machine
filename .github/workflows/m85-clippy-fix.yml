name: M85 strict Clippy fix

on:
  push:
    branches:
      - m85-clippy-fix

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m85-clippy-fix
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Fix and validate initializer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/world-library/src/lib.rs')
          text = path.read_text()
          old = '''    fn snapshot_display_title_ignores_blank_titles() {\n        let mut snapshot = ProjectionSnapshot::default();\n        snapshot.title = "   ".into();\n        assert_eq!(snapshot_display_title(&snapshot), None);\n\n        snapshot.title = "  A Living World  ".into();'''
          new = '''    fn snapshot_display_title_ignores_blank_titles() {\n        let mut snapshot = ProjectionSnapshot {\n            title: "   ".into(),\n            ..ProjectionSnapshot::default()\n        };\n        assert_eq!(snapshot_display_title(&snapshot), None);\n\n        snapshot.title = "  A Living World  ".into();'''
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo clippy -p world-library --all-targets -- -D warnings
          cargo test -p world-library
          git diff --check
      - name: Commit fix and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m85-clippy-fix.yml
          git add crates/world-library/src/lib.rs
          git commit -m 'M85: satisfy strict Clippy for title test'
          git push origin HEAD:m85-clippy-fix
