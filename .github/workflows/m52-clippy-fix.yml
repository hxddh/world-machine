name: M52 Clippy Fix

on:
  push:
    branches:
      - m52-pack-process-protocol

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m52-pack-process-protocol
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged
      - run: cargo fmt --all
      - name: Commit fixed sources
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "M52: apply clippy fixes to Pack protocol"
          git push origin HEAD:m52-pack-process-protocol
