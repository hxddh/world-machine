name: M52 Clippy Diagnostics

on:
  push:
    branches:
      - m52-pack-process-protocol

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m52-pack-process-protocol
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Capture clippy diagnostics
        run: cargo clippy -p world-pack-protocol --all-targets --message-format=short -- -D warnings > M52_CLIPPY_LOG.txt 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add M52_CLIPPY_LOG.txt
          git commit -m "M52: capture clippy diagnostics" || exit 0
          git push origin HEAD:m52-pack-process-protocol
