name: M150 patch

on:
  push:
    branches:
      - agent/m150-entity-lifetime-evidence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m150-entity-lifetime-evidence
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Reset evidence on entity recreation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/world-projection/src/lib.rs')
          text = path.read_text()
          old = "\n".join([
              "                StateChange::CreateEntity(entity) => {",
              "                    affected.insert(entity.id);",
              "                }",
          ])
          new = "\n".join([
              "                StateChange::CreateEntity(entity) => {",
              "                    events_by_entity.remove(&entity.id);",
              "                    affected.insert(entity.id);",
              "                }",
          ])
          assert text.count(old) == 1, f'expected one CreateEntity projection match, found {text.count(old)}'
          path.write_text(text.replace(old, new))
          PY
          cargo fmt --all
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/world-projection/src/lib.rs
          git commit -m "M150: reset evidence on entity recreation"
          git push origin HEAD:agent/m150-entity-lifetime-evidence
