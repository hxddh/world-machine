name: M64 Pocket Universe Pi Mind Verify

on:
  push:
    branches: [m64-pocket-universe-pi-mind]
    paths:
      - '.github/workflows/m64-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m64-pocket-universe-pi-mind
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python scripts/m64_pi_mind.py
      - run: python scripts/m64_test_dep.py
      - run: python scripts/m64_archive_value_fix.py
      - run: cargo fmt --all
      - run: cargo test -p pocket-universe
      - run: cargo test -p pocket-universe-pack
      - run: cargo clippy -p pocket-universe -p pocket-universe-pack --all-targets -- -D warnings
      - run: bash ./scripts/check-boundaries.sh
      - name: Commit verified Pi mind slice
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock worlds/pocket-universe apps/pocket-universe-pack
          git commit -m 'M64: add opt-in Pi mind to Pocket Universe Pack'
          git push origin HEAD:m64-pocket-universe-pi-mind
