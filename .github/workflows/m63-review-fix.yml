name: M63 Review Hardening

on:
  push:
    branches: [m63-pocket-universe-agent-minds]
    paths:
      - '.github/workflows/m63-review-fix.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m63-pocket-universe-agent-minds
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python scripts/m63_review_fix.py
      - run: cargo fmt --all
      - run: cargo test -p pocket-universe
      - run: cargo test -p pocket-universe-pack
      - run: cargo clippy -p pocket-universe -p pocket-universe-pack --all-targets -- -D warnings
      - run: bash ./scripts/check-boundaries.sh
      - name: Commit review hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worlds/pocket-universe/src/lib.rs worlds/pocket-universe/src/projection.rs
          git commit -m 'M63: make agent turns world-atomic'
          git push origin HEAD:m63-pocket-universe-agent-minds
