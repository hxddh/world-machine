name: M256 Remove Runner Limit
on:
  push:
    branches:
      - agent/m256-bound-analyst-turn-host-stdin-framing
permissions:
  contents: write
jobs:
  tighten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m256-bound-analyst-turn-host-stdin-framing
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Keep runner production surface fixed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('integrations/pi/world-machine-analyst-turn-host.mjs')
          text = p.read_text()
          old = "\n".join([
              '  env = process.env,',
              '  signalSource = process,',
              '  maxInputRecordBytes = DEFAULT_MAX_ANALYST_TURN_INPUT_RECORD_BYTES,',
              '} = {}) {',
              '  validateInputRecordLimit(maxInputRecordBytes);',
              '  const config = parseProcessArgs(argv);',
          ])
          new = "\n".join([
              '  env = process.env,',
              '  signalSource = process,',
              '} = {}) {',
              '  const config = parseProcessArgs(argv);',
          ])
          if old not in text:
              raise SystemExit('runner limit option block not found')
          text = text.replace(old, new, 1)
          old = '    for await (const line of readAnalystTurnLines(stdin, maxInputRecordBytes)) {'
          new = '    for await (const line of readAnalystTurnLines(stdin)) {'
          if old not in text:
              raise SystemExit('runner reader call not found')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY

          python - <<'PY'
          from pathlib import Path
          p = Path('integrations/pi/tests/world-machine-analyst-turn-host-framing.test.mjs')
          text = p.read_text()
          start_marker = 'test("turn-host framing failure shuts down the restricted Pi child", async () => {'
          end_marker = '\n\nasync function waitForFile'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('cleanup test replacement markers not found')
          replacement = "\n".join([
              'test("turn-host framing input failure shuts down the restricted Pi child", async () => {',
              '  const temp = await mkdtemp(join(tmpdir(), "world-machine-m256-framing-"));',
              '  const fakePi = join(temp, "fake-pi.mjs");',
              '  const readyFile = join(temp, "ready.txt");',
              '  await writeFile(',
              '    fakePi,',
              '    [',
              '      "#!/usr/bin/env node",',
              '      \'import { writeFileSync } from "node:fs";\',',
              '      "writeFileSync(process.env.FAKE_PI_READY_FILE, String(process.pid));",',
              '      "setInterval(() => {}, 1000);",',
              '      "",',
              '    ].join("\\n"),',
              '  );',
              '  await chmod(fakePi, 0o755);',
              '',
              '  const stdin = {',
              '    async *[Symbol.asyncIterator]() {',
              '      await waitForFile(readyFile);',
              '      throw new AnalystTurnHostInputError("analyst turn input record exceeded the transport limit");',
              '    },',
              '    destroy() {},',
              '  };',
              '  const stdout = new PassThrough();',
              '  const signalSource = new EventEmitter();',
              '  const run = runAnalystTurnHost({',
              '    stdin,',
              '    stdout,',
              '    argv: ["left.world", "right.world", "--provider", "fake", "--model", "fake"],',
              '    env: {',
              '      ...process.env,',
              '      PI_PROGRAM: fakePi,',
              '      WORLD_MACHINE_ANALYST_PROGRAM: process.execPath,',
              '      FAKE_PI_READY_FILE: readyFile,',
              '    },',
              '    signalSource,',
              '  });',
              '',
              '  try {',
              '    await assert.rejects(run, /record exceeded/);',
              '    const piPid = Number(await readFile(readyFile, "utf8"));',
              '    assert.ok(Number.isInteger(piPid) && piPid > 0);',
              '    assert.equal(',
              '      processExists(piPid),',
              '      false,',
              '      "restricted Pi child must not survive framing input failure",',
              '    );',
              '  } finally {',
              '    await rm(temp, { recursive: true, force: true });',
              '  }',
              '});',
              '',
              'test("turn-host framing reader limit cannot exceed the production ceiling", async () => {',
              '  await assert.rejects(',
              '    collectLines([], 64 * 1024 * 1024 + 1),',
              '    (error) => error instanceof AnalystTurnHostInputError && /1\\.\\.=67108864/.test(error.message),',
              '  );',
              '});',
          ])
          p.write_text(text[:start] + replacement + text[end:])
          PY

          node --check integrations/pi/world-machine-analyst-turn-host.mjs
          node --test integrations/pi/tests/world-machine-analyst-turn-host-framing.test.mjs integrations/pi/tests/world-machine-analyst-turn-host.test.mjs integrations/pi/tests/world-machine-analyst-turn-host-termination.test.mjs
          bash ./scripts/check-pi-analyst.sh
          cargo fmt --all -- --check
          git rm .github/workflows/m256-remove-runner-limit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add integrations/pi/world-machine-analyst-turn-host.mjs integrations/pi/tests/world-machine-analyst-turn-host-framing.test.mjs
          git commit -m 'M256: keep turn-host runner surface fixed'
          git push origin HEAD:agent/m256-bound-analyst-turn-host-stdin-framing
