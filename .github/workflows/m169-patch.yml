name: M169 patch

on:
  push:
    branches:
      - agent/m169-endpoint-role

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m169-endpoint-role
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply typed Relation endpoint roles
        run: |
          python3 .github/scripts/m169_patch.py
          cargo fmt --all
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/world-projection/src/lib.rs crates/world-projection/tests/entity_relation_adjacency.rs crates/world-pack-protocol/tests/entity_relation_adjacency_roundtrip.rs
          git commit -m "M169: preserve typed Relation endpoint roles"
          git push origin HEAD:agent/m169-endpoint-role
