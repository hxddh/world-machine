name: M57 Pack Authoring SDK

on:
  push:
    branches:
      - m57-pack-authoring-sdk

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m57-pack-authoring-sdk
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - run: python scripts/m57_apply.py
      - run: cargo fmt --all
      - run: cargo test -p world-pack-server
      - run: cargo test -p tiny-society-pack
      - run: cargo clippy -p world-pack-server -p tiny-society-pack --all-targets -- -D warnings
      - run: bash ./scripts/check-boundaries.sh
      - name: Commit authoring SDK
        run: |
          rm -f scripts/m57_apply.py .github/workflows/m57-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "M57: add external Rust Pack authoring SDK" || exit 0
          git push origin HEAD:m57-pack-authoring-sdk
