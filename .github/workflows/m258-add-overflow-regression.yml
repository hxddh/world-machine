name: M258 Add Overflow Regression
on:
  push:
    branches:
      - agent/m258-bound-world-cli-query-stdin
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m258-bound-world-cli-query-stdin
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Add process-level streaming overflow regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/world-cli/tests/machine_query_transport.rs')
          text = p.read_text()
          text = text.replace(
              'use std::io::Write;\n',
              'use std::io::{Read, Write};\n',
              1,
          )
          text = text.replace(
              'use std::time::{SystemTime, UNIX_EPOCH};\n',
              'use std::time::{Duration, Instant, SystemTime, UNIX_EPOCH};\n',
              1,
          )
          anchor = "\n".join([
              '#[test]',
              'fn malformed_stdin_json_is_a_transport_failure() {',
          ])
          test = "\n".join([
              '#[test]',
              'fn oversized_stdin_fails_before_eof_and_before_query_execution() {',
              '    const MAX_STDIN_BYTES: usize = 64 * 1024 * 1024;',
              '    const CHUNK_BYTES: usize = 64 * 1024;',
              '',
              '    let mut child = Command::new(env!("CARGO_BIN_EXE_world-cli"))',
              '        .args([',
              '            "evidence-query",',
              '            "definitely-missing-m258.world",',
              '            "-",',
              '        ])',
              '        .stdin(Stdio::piped())',
              '        .stdout(Stdio::piped())',
              '        .stderr(Stdio::piped())',
              '        .spawn()',
              '        .unwrap();',
              '',
              '    let chunk = vec![b\'x\'; CHUNK_BYTES];',
              '    let mut remaining = MAX_STDIN_BYTES + 1;',
              '    while remaining > 0 {',
              '        let count = remaining.min(chunk.len());',
              '        match child',
              '            .stdin',
              '            .as_mut()',
              '            .expect("stdin should remain open during overflow")',
              '            .write_all(&chunk[..count])',
              '        {',
              '            Ok(()) => remaining -= count,',
              '            Err(error) if error.kind() == std::io::ErrorKind::BrokenPipe => break,',
              '            Err(error) => panic!("failed to stream oversized stdin: {error}"),',
              '        }',
              '    }',
              '',
              '    let deadline = Instant::now() + Duration::from_secs(10);',
              '    let status = loop {',
              '        if let Some(status) = child.try_wait().unwrap() {',
              '            break status;',
              '        }',
              '        assert!(',
              '            Instant::now() < deadline,',
              '            "world-cli waited for EOF after stdin was already oversized"',
              '        );',
              '        std::thread::sleep(Duration::from_millis(10));',
              '    };',
              '',
              '    assert!(!status.success());',
              '    let mut stdout = Vec::new();',
              '    child.stdout.take().unwrap().read_to_end(&mut stdout).unwrap();',
              '    assert!(stdout.is_empty(), "oversized stdin must not emit a query envelope");',
              '    let mut stderr_bytes = Vec::new();',
              '    child',
              '        .stderr',
              '        .take()',
              '        .unwrap()',
              '        .read_to_end(&mut stderr_bytes)',
              '        .unwrap();',
              '    let stderr = String::from_utf8_lossy(&stderr_bytes);',
              '    assert!(stderr.contains("machine query stdin exceeded the 67108864-byte transport limit"));',
              '    assert!(!stderr.contains("definitely-missing-m258.world"));',
              '}',
              '',
          ])
          if anchor not in text:
              raise SystemExit('malformed stdin test anchor not found')
          text = text.replace(anchor, test + anchor, 1)
          p.write_text(text)
          PY

          cargo fmt --all
          cargo test -p world-cli --test machine_query_transport oversized_stdin_fails_before_eof_and_before_query_execution -- --exact
          cargo test -p world-cli
          cargo clippy -p world-cli --all-targets -- -D warnings
          bash ./scripts/check-boundaries.sh
          bash ./scripts/check-pi-analyst.sh
          cargo fmt --all -- --check

          git rm .github/workflows/m258-add-overflow-regression.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/world-cli/tests/machine_query_transport.rs
          git commit -m 'M258: test machine-query stdin overflow end to end'
          git push origin HEAD:agent/m258-bound-world-cli-query-stdin
