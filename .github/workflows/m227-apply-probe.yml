          path = Path('crates/world-analyst-client/src/lib.rs')
          s = path.read_text()
          s = replace_once(
              s,
              '''pub enum AnalystTurnRequest {
    Ask {
        id: String,
        prompt: String,
        #[serde(skip_serializing_if = "Option::is_none")]
        timeout_ms: Option<u64>,
    },
}''',
              '''pub enum AnalystTurnRequest {
    Probe {
        id: String,
        #[serde(skip_serializing_if = "Option::is_none")]
        timeout_ms: Option<u64>,
    },
    Ask {
        id: String,
        prompt: String,
        #[serde(skip_serializing_if = "Option::is_none")]
        timeout_ms: Option<u64>,
    },
}''',
