name: M227 apply startup probe

on:
  push:
    branches:
      - agent/m227-installed-analyst-runtime-probe

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m227-installed-analyst-runtime-probe
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply M227 probe patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  if new in text:
                      return text
                  raise SystemExit(f"missing patch marker: {label}")
              return text.replace(old, new, 1)

          def replace_between(text, start, end, new, label):
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f"missing start marker: {label}")
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f"missing end marker: {label}")
              return text[:a] + new + text[b:]

          # Pi RPC: add a non-model get_state probe on the same restricted process.
          path = Path('integrations/pi/world-machine-analyst-rpc.mjs')
          s = path.read_text()
          s = replace_once(
              s,
              'const DEFAULT_SHUTDOWN_TIMEOUT_MS = 1000;\nconst DEFAULT_PROMPT_TIMEOUT_MS = 120000;',
              'const DEFAULT_SHUTDOWN_TIMEOUT_MS = 1000;\nconst DEFAULT_PROBE_TIMEOUT_MS = 10000;\nconst DEFAULT_PROMPT_TIMEOUT_MS = 120000;',
              'rpc probe timeout',
          )
          s = replace_once(
              s,
              '    this.nextRequestNumber = 1;\n',
              '    this.nextRequestNumber = 1;\n    this.nextProbeNumber = 1;\n',
              'rpc probe sequence',
          )
          probe_method = '''  async probe({ signal, timeoutMs = DEFAULT_PROBE_TIMEOUT_MS } = {}) {
            if (this.busy) {
              throw new PiAnalystRpcProtocolError("Pi analyst RPC session is single-flight");
            }
            if (this.closed || this.closedError) {
              throw this.closedError ?? new PiAnalystRpcTransportError("Pi analyst RPC session is closed");
            }
            if (!Number.isSafeInteger(timeoutMs) || timeoutMs <= 0) {
              throw new PiAnalystRpcProtocolError(
                "Pi analyst probe timeout must be a positive safe integer",
              );
            }
            if (signal?.aborted) {
              const error = new PiAnalystRpcTransportError("Pi analyst probe aborted before dispatch");
              await this.#terminateAfterBrokenTurn(error);
              throw error;
            }

            const requestId = `world-analyst-probe-${this.nextProbeNumber++}`;
            this.busy = true;
            try {
              await this.#write({ id: requestId, type: "get_state" });
              const response = await this.#nextRecordWithInterruption(
                signal,
                timeoutMs,
                requestId,
                "probe",
              );
              if (!response || response.type !== "response") {
                throw new PiAnalystRpcProtocolError(
                  "Pi analyst probe received an event before get_state response",
                  { requestId, response },
                );
              }
              if (response.id !== requestId || response.command !== "get_state") {
                throw new PiAnalystRpcProtocolError("Pi analyst probe correlation mismatch", {
                  expectedId: requestId,
                  actualId: response.id,
                  command: response.command,
                });
              }
              if (response.success !== true) {
                throw new PiAnalystRpcCommandError("Pi analyst get_state probe was rejected", {
                  requestId,
                  response,
                });
              }
              if (!response.data || typeof response.data !== "object" || Array.isArray(response.data)) {
                throw new PiAnalystRpcProtocolError("Pi analyst get_state probe returned invalid state", {
                  requestId,
                  response,
                });
              }
              return { requestId };
            } catch (error) {
              if (!(error instanceof PiAnalystRpcCommandError)) {
                await this.#terminateAfterBrokenTurn(error);
              }
              throw error;
            } finally {
              this.busy = false;
            }
          }

'''
          s = replace_once(s, '  async prompt(message, { signal, timeoutMs = DEFAULT_PROMPT_TIMEOUT_MS } = {}) {\n', probe_method + '  async prompt(message, { signal, timeoutMs = DEFAULT_PROMPT_TIMEOUT_MS } = {}) {\n', 'rpc probe method')
          s = replace_once(
              s,
              '  async #nextRecordWithInterruption(signal, timeoutMs, requestId) {',
              '  async #nextRecordWithInterruption(signal, timeoutMs, requestId, operation = "prompt") {',
              'rpc interruption signature',
          )
          s = replace_once(
              s,
              'new PiAnalystRpcTransportError("Pi analyst prompt aborted", {',
              'new PiAnalystRpcTransportError(`Pi analyst ${operation} aborted`, {',
              'rpc abort operation label',
          )
          s = replace_once(
              s,
              'new PiAnalystRpcTransportError("Pi analyst prompt timed out", {',
              'new PiAnalystRpcTransportError(`Pi analyst ${operation} timed out`, {',
              'rpc timeout operation label',
          )
          path.write_text(s)

          # Stable M220 protocol v1: additive probe/ready operation, no model prompt.
          path = Path('integrations/pi/world-machine-analyst-turn-host.mjs')
          s = path.read_text()
          new_handle = '''  async handle(request, { signal } = {}) {
            const parsed = parseRequest(request);
            try {
              const options = {};
              if (parsed.timeoutMs !== undefined) options.timeoutMs = parsed.timeoutMs;
              if (signal !== undefined) options.signal = signal;
              if (parsed.op === "probe") {
                await this.session.probe(options);
                return envelope({ type: "ready", id: parsed.id });
              }
              const turn = await this.session.prompt(parsed.prompt, options);
              return envelope({
                type: "result",
                id: parsed.id,
                turn: normalizeTurn(turn),
              });
            } catch (error) {
              return envelope({
                type: "error",
                id: parsed.id,
                error: mapSessionError(error),
              });
            }
          }

'''
          s = replace_between(s, '  async handle(request, { signal } = {}) {', '  async shutdown() {', new_handle, 'turn host handle')
          new_parse = '''function parseRequest(value) {
            if (!value || typeof value !== "object" || Array.isArray(value)) {
              throw new AnalystTurnHostInputError("analyst turn request must be a JSON object");
            }
            if (value.op !== "ask" && value.op !== "probe") {
              throw new AnalystTurnHostInputError("analyst turn request op must be `ask` or `probe`");
            }
            const allowed = value.op === "ask"
              ? new Set(["id", "op", "prompt", "timeout_ms"])
              : new Set(["id", "op", "timeout_ms"]);
            for (const key of Object.keys(value)) {
              if (!allowed.has(key)) {
                throw new AnalystTurnHostInputError(`unknown analyst turn request field: ${key}`);
              }
            }
            if (typeof value.id !== "string" || value.id.length === 0) {
              throw new AnalystTurnHostInputError("analyst turn request id must be a non-empty string");
            }
            if (value.op === "ask" && (typeof value.prompt !== "string" || value.prompt.length === 0)) {
              throw new AnalystTurnHostInputError("analyst turn request prompt must be a non-empty string");
            }
            let timeoutMs;
            if (value.timeout_ms !== undefined) {
              if (!Number.isSafeInteger(value.timeout_ms) || value.timeout_ms <= 0) {
                throw new AnalystTurnHostInputError("analyst turn timeout_ms must be a positive integer");
              }
              timeoutMs = value.timeout_ms;
            }
            return {
              id: value.id,
              op: value.op,
              prompt: value.prompt,
              timeoutMs,
            };
          }

'''
