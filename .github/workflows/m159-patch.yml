name: M159 patch

on:
  push:
    branches:
      - agent/m159-relation-evidence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m159-relation-evidence
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply projection patch
        run: |
          python3 .github/scripts/m159_patch.py
          cargo fmt --all
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/world-projection/src/lib.rs crates/world-projection/tests/relation_event_evidence.rs
          git commit -m "M159: project Relation evidence history"
          git push origin HEAD:agent/m159-relation-evidence
