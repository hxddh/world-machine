name: M252 Fix Take
on:
  push:
    branches:
      - agent/m252-bound-analyst-response-framing
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m252-bound-analyst-response-framing
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Patch bounded reader ownership and validate stable
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/world-analyst-client/src/lib.rs')
          source = path.read_text()
          replacements = [
              (
                  '    let mut limited = (&mut *reader).take(read_limit as u64);',
                  '    let mut limited = std::io::Read::take(reader, read_limit as u64);',
              ),
              (
                  '        assert!(helper.contains("(&mut *reader).take(read_limit as u64)"));',
                  '        assert!(helper.contains("std::io::Read::take(reader, read_limit as u64)"));',
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one replacement, found {count}: {old}')
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          cargo fmt --all
          cargo clippy -p world-analyst-client --all-targets -- -D warnings
          cargo test -p world-analyst-client
          git rm .github/workflows/m252-fix-take.yml
          git add crates/world-analyst-client/src/lib.rs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'M252: keep bounded reader borrowed'
          git push origin HEAD:agent/m252-bound-analyst-response-framing
