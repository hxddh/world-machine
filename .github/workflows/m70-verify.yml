name: M70 Micro Company Verify

on:
  push:
    branches: [m70-micro-company-external-pack]
    paths:
      - '.github/workflows/m70-verify.yml'
      - 'apps/micro-company-pack/tests/external_pack.rs'
      - 'scripts/m70_profile_guard_test.py'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m70-micro-company-external-pack
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python scripts/m70_profile_guard_test.py
      - run: cargo fmt --all
      - run: cargo test -p micro-company
      - run: cargo test -p micro-company-pack
      - run: cargo clippy -p micro-company -p micro-company-pack --all-targets -- -D warnings
      - run: bash ./scripts/check-boundaries.sh
      - name: Commit verified Micro Company slice
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock worlds/micro-company apps/micro-company-pack
          if ! git diff --cached --quiet; then
            git commit -m 'M70: verify Micro Company external Pack'
            git push origin HEAD:m70-micro-company-external-pack
          fi
