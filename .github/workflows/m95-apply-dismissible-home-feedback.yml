name: M95 dismissible Home feedback

on:
  push:
    branches:
      - m95-dismissible-home-feedback

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m95-dismissible-home-feedback
      - uses: dtolnay/rust-toolchain@stable
      - name: Add an explicit Dismiss action to fixed Home feedback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/world-machine-desktop/src/main.rs')
          text = path.read_text()

          old = '''            shell = shell.child(\n                div()\n                    .id("world-machine-home-status")\n                    .w_full()\n                    .px_4()\n                    .child(\n                        div()\n                            .p_3()\n                            .rounded_md()\n                            .bg(rgb(background))\n                            .text_color(rgb(foreground))\n                            .text_sm()\n                            .child(status.message.clone()),\n                    ),\n            );'''
          new = '''            shell = shell.child(\n                div()\n                    .id("world-machine-home-status")\n                    .w_full()\n                    .px_4()\n                    .child(\n                        div()\n                            .p_3()\n                            .rounded_md()\n                            .bg(rgb(background))\n                            .text_color(rgb(foreground))\n                            .text_sm()\n                            .flex()\n                            .items_center()\n                            .justify_between()\n                            .gap_3()\n                            .child(div().flex_1().child(status.message.clone()))\n                            .child(\n                                div()\n                                    .id("dismiss-world-machine-home-status")\n                                    .cursor_pointer()\n                                    .p_2()\n                                    .rounded_md()\n                                    .border_1()\n                                    .border_color(rgb(foreground))\n                                    .text_xs()\n                                    .child("Dismiss")\n                                    .on_click(cx.listener(|this, _, _, cx| {\n                                        this.status = None;\n                                        cx.notify();\n                                    })),\n                            ),\n                    ),\n            );'''
          assert old in text, 'Home status banner changed unexpectedly'
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          cargo fmt --all
          cargo test -p world-machine-desktop
          git diff --check
      - name: Commit dismissible feedback and remove helper
        if: success()
        shell: bash
        run: |
          rm .github/workflows/m95-apply-dismissible-home-feedback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/world-machine-desktop/src/main.rs \
                  .github/workflows/m95-apply-dismissible-home-feedback.yml
          git commit -m "M95: make fixed Home feedback dismissible"
          git push origin HEAD:m95-dismissible-home-feedback
