name: M259 Implement

on:
  push:
    branches:
      - agent/m259-bound-tool-host-stdin-jsonl

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m259-bound-tool-host-stdin-jsonl
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Implement bounded tool-host stdin framing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/world-agent-tool-stdio/src/main.rs')
          s = p.read_text()
          s = s.replace(
              'const USAGE: &str = "Usage: world-agent-tool-stdio <left.world> <right.world>\\n\\nReads one world-machine-readonly-tools JSON request per stdin line and writes one response per line. The World archive pair is fixed at process startup.";\n',
              'const USAGE: &str = "Usage: world-agent-tool-stdio <left.world> <right.world>\\n\\nReads one world-machine-readonly-tools JSON request per stdin line and writes one response per line. The World archive pair is fixed at process startup.";\nconst MAX_TOOL_REQUEST_BYTES: usize = 64 * 1024 * 1024;\n'
          )
          old = "\n".join([
              'fn serve_json_lines<E, R, W>(',
              '    host: &mut ReadOnlyJsonToolHost<E>,',
              '    reader: R,',
              '    mut writer: W,',
              ') -> Result<(), StdioAdapterError>',
              'where',
              '    E: fmt::Display,',
              '    R: BufRead,',
              '    W: Write,',
              '{',
              '    for (index, line) in reader.lines().enumerate() {',
              '        let line_number = index + 1;',
              '        let line = line.map_err(StdioAdapterError::Read)?;',
              '        if line.trim().is_empty() {',
              '            continue;',
              '        }',
              '        let request = serde_json::from_str::<Value>(&line).map_err(|source| {',
              '            StdioAdapterError::InvalidJson {',
              '                line: line_number,',
              '                source,',
              '            }',
              '        })?;',
              '        let response =',
              '            host.handle_json(request)',
              '                .map_err(|source| StdioAdapterError::InvalidHostRequest {',
              '                    line: line_number,',
              '                    source,',
              '                })?;',
              '        serde_json::to_writer(&mut writer, &response).map_err(StdioAdapterError::Serialize)?;',
              '        writer.write_all(b"\\n").map_err(StdioAdapterError::Write)?;',
              '        writer.flush().map_err(StdioAdapterError::Write)?;',
              '    }',
              '    Ok(())',
              '}',
          ])
          new = "\n".join([
              'fn serve_json_lines<E, R, W>(',
              '    host: &mut ReadOnlyJsonToolHost<E>,',
              '    reader: R,',
              '    writer: W,',
              ') -> Result<(), StdioAdapterError>',
              'where',
              '    E: fmt::Display,',
              '    R: BufRead,',
              '    W: Write,',
              '{',
              '    serve_json_lines_with_limit(host, reader, writer, MAX_TOOL_REQUEST_BYTES)',
              '}',
              '',
              'fn serve_json_lines_with_limit<E, R, W>(',
              '    host: &mut ReadOnlyJsonToolHost<E>,',
              '    mut reader: R,',
              '    mut writer: W,',
              '    max_bytes: usize,',
              ') -> Result<(), StdioAdapterError>',
              'where',
              '    E: fmt::Display,',
              '    R: BufRead,',
              '    W: Write,',
              '{',
              '    let mut line_number = 0;',
              '    loop {',
              '        let next_line = line_number + 1;',
              '        let Some(line) = read_bounded_json_line(&mut reader, max_bytes, next_line)? else {',
              '            break;',
              '        };',
              '        line_number = next_line;',
              '        if line.trim().is_empty() {',
              '            continue;',
              '        }',
              '        let request = serde_json::from_str::<Value>(&line).map_err(|source| {',
              '            StdioAdapterError::InvalidJson {',
              '                line: line_number,',
              '                source,',
              '            }',
              '        })?;',
              '        let response =',
              '            host.handle_json(request)',
              '                .map_err(|source| StdioAdapterError::InvalidHostRequest {',
              '                    line: line_number,',
              '                    source,',
              '                })?;',
              '        serde_json::to_writer(&mut writer, &response).map_err(StdioAdapterError::Serialize)?;',
              '        writer.write_all(b"\\n").map_err(StdioAdapterError::Write)?;',
              '        writer.flush().map_err(StdioAdapterError::Write)?;',
              '    }',
              '    Ok(())',
              '}',
              '',
              'fn read_bounded_json_line<R: BufRead>(',
              '    reader: &mut R,',
              '    max_bytes: usize,',
              '    line: usize,',
              ') -> Result<Option<String>, StdioAdapterError> {',
              '    let max_raw_bytes = max_bytes',
              '        .checked_add(1)',
              '        .ok_or(StdioAdapterError::RecordTooLarge { line, max_bytes })?;',
              '    let mut record = Vec::new();',
              '',
              '    loop {',
              '        let buffer = reader.fill_buf().map_err(StdioAdapterError::Read)?;',
              '        if buffer.is_empty() {',
              '            if record.is_empty() {',
              '                return Ok(None);',
              '            }',
              '            if record.len() > max_bytes {',
              '                return Err(StdioAdapterError::RecordTooLarge { line, max_bytes });',
              '            }',
              '            return strict_utf8_line(record).map(Some);',
              '        }',
              '',
              '        if let Some(newline) = buffer.iter().position(|byte| *byte == b\'\\n\') {',
              '            let part = &buffer[..newline];',
              '            let total_raw = record.len().saturating_add(part.len());',
              '            let ends_cr = part',
              '                .last()',
              '                .copied()',
              '                .or_else(|| record.last().copied())',
              '                == Some(b\'\\r\');',
              '            let payload_bytes = total_raw.saturating_sub(usize::from(ends_cr));',
              '            if payload_bytes > max_bytes {',
              '                return Err(StdioAdapterError::RecordTooLarge { line, max_bytes });',
              '            }',
              '            record.extend_from_slice(part);',
              '            reader.consume(newline + 1);',
              '            if ends_cr {',
              '                record.pop();',
              '            }',
              '            return strict_utf8_line(record).map(Some);',
              '        }',
              '',
              '        let total_raw = record.len().saturating_add(buffer.len());',
              '        if total_raw > max_raw_bytes {',
              '            return Err(StdioAdapterError::RecordTooLarge { line, max_bytes });',
              '        }',
              '        if total_raw == max_raw_bytes && buffer.last().copied() != Some(b\'\\r\') {',
              '            return Err(StdioAdapterError::RecordTooLarge { line, max_bytes });',
              '        }',
              '',
              '        record.extend_from_slice(buffer);',
              '        let consumed = buffer.len();',
              '        reader.consume(consumed);',
              '    }',
              '}',
              '',
              'fn strict_utf8_line(bytes: Vec<u8>) -> Result<String, StdioAdapterError> {',
              '    String::from_utf8(bytes).map_err(|error| {',
              '        StdioAdapterError::Read(io::Error::new(io::ErrorKind::InvalidData, error))',
              '    })',
              '}',
          ])
          if old not in s:
              raise SystemExit('serve_json_lines block not found')
          s = s.replace(old, new)
          s = s.replace(
              'enum StdioAdapterError {\n    Read(io::Error),\n',
              'enum StdioAdapterError {\n    Read(io::Error),\n    RecordTooLarge { line: usize, max_bytes: usize },\n'
          )
          s = s.replace(
              '            Self::Read(error) => write!(f, "failed to read stdin: {error}"),\n',
              '            Self::Read(error) => write!(f, "failed to read stdin: {error}"),\n            Self::RecordTooLarge { line, max_bytes } => write!(\n                f,\n                "stdin JSON record on line {line} exceeded the {max_bytes}-byte transport limit"\n            ),\n'
          )
          s = s.replace(
              '            Self::Read(error) | Self::Write(error) => Some(error),\n',
              '            Self::Read(error) | Self::Write(error) => Some(error),\n            Self::RecordTooLarge { .. } => None,\n'
          )
          marker = "\n".join([
              '    #[test]',
              '    fn framing_skips_blank_lines_and_emits_one_json_line_per_request() {',
          ])
          idx = s.index(marker)
          tests = "\n".join([
              '    fn echo_host() -> ReadOnlyJsonToolHost<Infallible> {',
              '        let mut registry = ReadOnlyJsonToolRegistry::<Infallible>::new();',
              '        registry.register(EchoTool).unwrap();',
              '        ReadOnlyJsonToolHost::new(registry)',
              '    }',
              '',
              '    #[test]',
              '    fn bounded_reader_preserves_lf_crlf_eof_and_utf8_semantics() {',
              '        let mut lf = Cursor::new(b"abcd\\nrest");',
              '        assert_eq!(read_bounded_json_line(&mut lf, 4, 1).unwrap(), Some("abcd".into()));',
              '        assert_eq!(read_bounded_json_line(&mut lf, 4, 2).unwrap(), Some("rest".into()));',
              '',
              '        let mut crlf = Cursor::new(b"abcd\\r\\n");',
              '        assert_eq!(read_bounded_json_line(&mut crlf, 4, 1).unwrap(), Some("abcd".into()));',
              '',
              '        let mut eof = Cursor::new(b"abcd");',
              '        assert_eq!(read_bounded_json_line(&mut eof, 4, 1).unwrap(), Some("abcd".into()));',
              '',
              '        let mut lone_cr = Cursor::new(b"abc\\r");',
              '        assert_eq!(read_bounded_json_line(&mut lone_cr, 4, 1).unwrap(), Some("abc\\r".into()));',
              '',
              '        let mut utf8 = Cursor::new("éé\\n".as_bytes());',
              '        assert_eq!(read_bounded_json_line(&mut utf8, 4, 1).unwrap(), Some("éé".into()));',
              '    }',
              '',
              '    #[test]',
              '    fn bounded_reader_handles_chunk_splits_and_multiple_records() {',
              '        let input = Cursor::new(b"one\\ntwo\\nthree");',
              '        let mut reader = BufReader::with_capacity(2, input);',
              '        assert_eq!(read_bounded_json_line(&mut reader, 5, 1).unwrap(), Some("one".into()));',
              '        assert_eq!(read_bounded_json_line(&mut reader, 5, 2).unwrap(), Some("two".into()));',
              '        assert_eq!(read_bounded_json_line(&mut reader, 5, 3).unwrap(), Some("three".into()));',
              '        assert_eq!(read_bounded_json_line(&mut reader, 5, 4).unwrap(), None);',
              '    }',
              '',
              '    #[test]',
              '    fn bounded_reader_rejects_oversize_and_invalid_utf8() {',
              '        let mut newline = Cursor::new(b"abcde\\n");',
              '        assert!(matches!(',
              '            read_bounded_json_line(&mut newline, 4, 7),',
              '            Err(StdioAdapterError::RecordTooLarge { line: 7, max_bytes: 4 })',
              '        ));',
              '',
              '        let mut eof = Cursor::new(b"abcde");',
              '        assert!(matches!(',
              '            read_bounded_json_line(&mut eof, 4, 8),',
              '            Err(StdioAdapterError::RecordTooLarge { line: 8, max_bytes: 4 })',
              '        ));',
              '',
              '        let mut invalid = Cursor::new(vec![0xff, b\'\\n\']);',
              '        assert!(matches!(',
              '            read_bounded_json_line(&mut invalid, 4, 9),',
              '            Err(StdioAdapterError::Read(error)) if error.kind() == io::ErrorKind::InvalidData',
              '        ));',
              '    }',
              '',
              '    struct PanicAfterFirstFill {',
              '        bytes: Vec<u8>,',
              '        consumed: bool,',
              '    }',
              '',
              '    impl std::io::Read for PanicAfterFirstFill {',
              '        fn read(&mut self, _buf: &mut [u8]) -> io::Result<usize> {',
              '            unreachable!("BufRead path should not call Read::read")',
              '        }',
              '    }',
              '',
              '    impl BufRead for PanicAfterFirstFill {',
              '        fn fill_buf(&mut self) -> io::Result<&[u8]> {',
              '            assert!(!self.consumed, "overflow reader waited for another fill/EOF");',
              '            Ok(&self.bytes)',
              '        }',
              '',
              '        fn consume(&mut self, amount: usize) {',
              '            self.consumed = amount > 0;',
              '        }',
              '    }',
              '',
              '    #[test]',
              '    fn no_newline_overflow_fails_before_waiting_for_eof() {',
              '        let mut reader = PanicAfterFirstFill {',
              '            bytes: b"abcde".to_vec(),',
              '            consumed: false,',
              '        };',
              '        assert!(matches!(',
              '            read_bounded_json_line(&mut reader, 4, 1),',
              '            Err(StdioAdapterError::RecordTooLarge { line: 1, max_bytes: 4 })',
              '        ));',
              '        assert!(!reader.consumed);',
              '    }',
              '',
              '    #[test]',
              '    fn pending_cr_headroom_accepts_exact_limit_crlf() {',
              '        let input = Cursor::new(b"abcd\\r\\n");',
              '        let mut reader = BufReader::with_capacity(5, input);',
              '        assert_eq!(read_bounded_json_line(&mut reader, 4, 1).unwrap(), Some("abcd".into()));',
              '    }',
              '',
              '    #[test]',
              '    fn physical_line_numbers_include_ignored_blank_lines() {',
              '        let mut host = echo_host();',
              '        let input = Cursor::new(b"\\n   \\n{not-json}\\n");',
              '        let mut output = Vec::new();',
              '        let error = serve_json_lines_with_limit(&mut host, input, &mut output, 64).unwrap_err();',
              '        assert!(matches!(error, StdioAdapterError::InvalidJson { line: 3, .. }));',
              '        assert!(output.is_empty());',
              '    }',
              '',
              '    #[test]',
              '    fn first_complete_request_is_flushed_before_second_record_overflow() {',
              '        let mut host = echo_host();',
              '        let first = b"{\\\"op\\\":\\\"list-tools\\\"}\\n";',
              '        let mut input = first.to_vec();',
              '        input.extend_from_slice(&vec![b\'x\'; 65]);',
              '        let mut output = Vec::new();',
              '        let error = serve_json_lines_with_limit(',
              '            &mut host,',
              '            Cursor::new(input),',
              '            &mut output,',
              '            64,',
              '        )',
              '        .unwrap_err();',
              '        assert!(matches!(',
              '            error,',
              '            StdioAdapterError::RecordTooLarge { line: 2, max_bytes: 64 }',
              '        ));',
              '        let output = String::from_utf8(output).unwrap();',
              '        let mut lines = output.lines();',
              '        let first_response: Value = serde_json::from_str(lines.next().unwrap()).unwrap();',
              '        assert_eq!(first_response["type"], "catalog");',
              '        assert!(lines.next().is_none());',
              '    }',
              '',
              '    #[test]',
              '    fn production_framing_uses_fixed_bounded_reader() {',
              '        let source = include_str!("main.rs");',
              '        assert!(source.contains("MAX_TOOL_REQUEST_BYTES"));',
              '        assert!(source.contains("serve_json_lines_with_limit(host, reader, writer, MAX_TOOL_REQUEST_BYTES)"));',
              '        assert!(!source.contains("reader.lines().enumerate()"));',
              '    }',
              '',
          ])
          s = s[:idx] + tests + s[idx:]
          p.write_text(s)
          PY
          cargo fmt --all
          cargo test -p world-agent-tool-stdio
          cargo clippy -p world-agent-tool-stdio --all-targets -- -D warnings
          bash ./scripts/check-boundaries.sh
          bash ./scripts/check-pi-analyst.sh
          cargo fmt --all -- --check
          git rm .github/workflows/m259-implement.yml
          git add crates/world-agent-tool-stdio/src/main.rs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'M259: bound tool-host stdin JSONL framing'
          git push origin HEAD:agent/m259-bound-tool-host-stdin-jsonl
