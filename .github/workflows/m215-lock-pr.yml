name: M215 PR lockfile validation

on:
  pull_request:
    paths:
      - .github/workflows/m215-lock-pr.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate M215 crates
        run: |
          cargo fmt --all -- --check
          cargo test -p world-investigation-local
          cargo test -p world-agent-tool-stdio
          cargo clippy -p world-investigation-local -p world-agent-tool-stdio --all-targets -- -D warnings
      - name: Commit generated lockfile to PR head
        run: |
          git config user.name hxddh
          git config user.email hxddh@users.noreply.github.com
          git add Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: update lockfile for stdio analyst process"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
# rerun after stable stderr handling
