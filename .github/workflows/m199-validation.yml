name: M199 causal consistency validation

on:
  push:
    branches:
      - agent/m199-causal-query-consistency

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m199-causal-query-consistency
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add crates/world-query/tests/causal_query_consistency.rs
            git diff --cached --check
            git commit -m "chore: format M199 consistency tests"
            git push origin HEAD:agent/m199-causal-query-consistency
          fi
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Boundary checks
        run: bash ./scripts/check-boundaries.sh
      - name: Query tests
        run: cargo test -p world-query
      - name: CLI tests
        run: cargo test -p world-cli
      - name: Focused clippy
        run: cargo clippy -p world-query -p world-cli --all-targets -- -D warnings
