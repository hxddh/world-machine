name: M53 Finalize Fixes

on:
  push:
    branches:
      - m53-process-backed-pack-runtime

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m53-process-backed-pack-runtime
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Sync and apply idempotent fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin m53-process-backed-pack-runtime
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/world-pack-process/src/lib.rs')
          text = path.read_text()
          text = text.replace('BufWriter, Read, Write', 'BufWriter, Write')
          text = text.replace('let error = registry.create("fixture.external").unwrap_err();', 'let error = registry.create("fixture.external").err().unwrap();')
          old = '        assert_eq!(session.archive().unwrap(), Some(archive));\n'
          new = '''        assert_eq!(session.archive().unwrap(), Some(archive.clone()));\n        drop(session);\n\n        let reopened = registry.open_archive(&archive).unwrap();\n        assert_eq!(reopened.pack(), descriptor().pack);\n        assert_eq!(reopened.snapshot().title, "Created externally");\n'''
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          cargo test -p world-pack-process
          rm -f .github/workflows/m53-fix.yml .github/workflows/m53-cleanup.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "M53: harden process runtime integration coverage"
          git pull --rebase origin m53-process-backed-pack-runtime
          git push origin HEAD:m53-process-backed-pack-runtime
