name: M164 patch

on:
  push:
    branches:
      - agent/m164-relation-diff-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m164-relation-diff-ui
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply Relation difference UI
        run: |
          python3 .github/scripts/m164_patch.py
          cargo fmt --all
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/world-strategy-gpui/src/lib.rs
          git commit -m "M164: surface Relation state differences"
          git push origin HEAD:agent/m164-relation-diff-ui
