name: M216 patch

on:
  push:
    branches:
      - agent/m216-cli-local-executor-dedup

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'M216 patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m216-cli-local-executor-dedup
          fetch-depth: 0

      - name: Apply M216 refactor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cargo = Path('crates/world-cli/Cargo.toml')
          text = cargo.read_text()
          old = 'world-investigation = { path = "../world-investigation" }\n'
          new = old + 'world-investigation-local = { path = "../world-investigation-local" }\n'
          assert old in text
          assert 'world-investigation-local = ' not in text
          cargo.write_text(text.replace(old, new, 1))

          main = Path('crates/world-cli/src/main.rs')
          text = main.read_text()

          old_import = '''use world_investigation::{
              investigate_first_divergence, ComparisonQueryExecutor, FirstDivergenceInvestigationRequest,
              InvestigationError,
          };
          '''
          new_import = '''use world_investigation::{
              investigate_first_divergence, FirstDivergenceInvestigationRequest, InvestigationError,
          };
          use world_investigation_local::LocalArchiveComparisonExecutor;
          '''
          assert old_import in text
          text = text.replace(old_import, new_import, 1)

          old_executor = '''struct SnapshotComparisonQueryExecutor<'a> {
              left: &'a ProjectionSnapshot,
              right: &'a ProjectionSnapshot,
          }

          impl ComparisonQueryExecutor for SnapshotComparisonQueryExecutor<'_> {
              type Error = world_query::QueryError;

              fn execute(
                  &mut self,
                  request: &EvidenceComparisonQueryRequest,
              ) -> Result<world_query::EvidenceComparisonQueryResponse, Self::Error> {
                  execute_comparison_query_request(self.left, self.right, request)
              }
          }

          '''
          assert old_executor in text
          text = text.replace(old_executor, '', 1)

          old_report = '''fn evidence_investigate_compare_json_report(
              left_path: &Path,
              right_path: &Path,
              request_json: &str,
          ) -> Result<String, Box<dyn Error>> {
              let left_archive = load_archive(left_path)?;
              let right_archive = load_archive(right_path)?;
              let registry = world_builtins::registry()?;
              let left_session = registry.open_archive(&left_archive)?;
              let right_session = registry.open_archive(&right_archive)?;
              let left = left_session.snapshot();
              let right = right_session.snapshot();
              evidence_investigate_compare_json_from_snapshots(&left, &right, request_json)
                  .map_err(|error| Box::new(error) as Box<dyn Error>)
          }

          fn evidence_investigate_compare_json_from_snapshots(
              left: &ProjectionSnapshot,
              right: &ProjectionSnapshot,
              request_json: &str,
          ) -> Result<String, CliError> {
              let request = parse_investigation_request(request_json)?;
              let mut executor = SnapshotComparisonQueryExecutor { left, right };
              let output = match investigate_first_divergence(&mut executor, &request) {
          '''
          new_report = '''fn evidence_investigate_compare_json_report(
              left_path: &Path,
              right_path: &Path,
              request_json: &str,
          ) -> Result<String, Box<dyn Error>> {
              let mut executor =
                  LocalArchiveComparisonExecutor::from_archive_paths(left_path, right_path)?;
              evidence_investigate_compare_json_with_executor(&mut executor, request_json)
                  .map_err(|error| Box::new(error) as Box<dyn Error>)
          }

          fn evidence_investigate_compare_json_from_snapshots(
              left: &ProjectionSnapshot,
              right: &ProjectionSnapshot,
              request_json: &str,
          ) -> Result<String, CliError> {
              let mut executor = LocalArchiveComparisonExecutor::new(left.clone(), right.clone());
              evidence_investigate_compare_json_with_executor(&mut executor, request_json)
          }

          fn evidence_investigate_compare_json_with_executor(
              executor: &mut LocalArchiveComparisonExecutor,
              request_json: &str,
          ) -> Result<String, CliError> {
              let request = parse_investigation_request(request_json)?;
              let output = match investigate_first_divergence(executor, &request) {
          '''
          assert old_report in text
          text = text.replace(old_report, new_report, 1)
          main.write_text(text)
          PY

      - name: Format
        run: cargo fmt --all

      - name: Boundary checks
        run: bash ./scripts/check-boundaries.sh

      - name: Focused tests
        run: cargo test -p world-cli -p world-investigation-local

      - name: Focused clippy
        run: cargo clippy -p world-cli -p world-investigation-local --all-targets -- -D warnings

      - name: Commit M216
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m216-patch.yml
          git add crates/world-cli/Cargo.toml crates/world-cli/src/main.rs Cargo.lock
          git commit -m "M216: reuse local investigation executor in CLI"
          git push origin HEAD:agent/m216-cli-local-executor-dedup
