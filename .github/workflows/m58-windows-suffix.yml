name: M58 Windows Program Suffix

on:
  push:
    branches: [m58-portable-pack-bundle]
    paths:
      - '.github/workflows/m58-windows-suffix.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m58-portable-pack-bundle
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python scripts/m58_windows_suffix.py
      - run: cargo fmt --all
      - run: cargo test -p world-pack-bundle
      - run: cargo test -p world-pack-catalog
      - run: cargo test -p tiny-society-pack
      - run: cargo clippy -p world-pack-bundle -p world-pack-catalog --all-targets -- -D warnings
      - run: bash ./scripts/check-boundaries.sh
      - name: Commit suffix fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/world-pack-bundle/src/lib.rs crates/world-pack-catalog/src/lib.rs
          git commit -m 'M58: preserve portable executable suffixes'
          git push origin HEAD:m58-portable-pack-bundle
