name: M248 one-shot preview polish

on:
  push:
    branches:
      - agent/m248-analyst-bounded-evidence-preview

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m248-analyst-bounded-evidence-preview
      - name: Polish M248 and self-delete
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("apps/world-machine-desktop/src/analyst_panel.rs")
          text = path.read_text()

          old = '        format!("{kind} preview · truncated at {ANALYST_TOOL_PAYLOAD_PREVIEW_BYTES} bytes")\n'
          new = '        format!("{kind} preview · truncated ({ANALYST_TOOL_PAYLOAD_PREVIEW_BYTES}-byte limit)")\n'
          if text.count(old) != 1:
              raise SystemExit("preview label anchor mismatch")
          text = text.replace(old, new, 1)

          anchor = '''        assert!(payload_preview_label("input", true).contains("truncated"));\n        assert_eq!(payload_preview_label("output", false), "output");\n\n'''
          replacement = '''        assert!(payload_preview_label("input", true).contains("truncated"));\n        assert_eq!(payload_preview_label("output", false), "output");\n\n        let output_heavy = world_analyst_client::AnalystToolCall {\n            call_id: "call-2".into(),\n            tool: "inspect_world".into(),\n            input: serde_json::json!({"small": true}),\n            output: serde_json::Value::String("y".repeat(4095)),\n            is_error: false,\n        };\n        let output_projected = panel_tool_call(&output_heavy);\n        assert!(!output_projected.input.truncated);\n        assert!(output_projected.output.truncated);\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit("symmetric projection test anchor mismatch")
          text = text.replace(anchor, replacement, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          git rm .github/workflows/m248-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/world-machine-desktop/src/analyst_panel.rs
          git commit -m "M248: clarify bounded preview labels"
          git push origin HEAD:agent/m248-analyst-bounded-evidence-preview
