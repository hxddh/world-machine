name: M60 Pack Activation Probe

on:
  push:
    branches: [m60-pack-activation-probe]
    paths:
      - '.github/workflows/m60-apply.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m60-pack-activation-probe
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python scripts/m60_apply.py
      - run: cargo fmt --all
      - run: cargo test -p world-pack-process
      - run: cargo test -p world-pack-catalog
      - run: cargo test -p tiny-society-pack
      - run: cargo clippy -p world-pack-process -p world-pack-catalog --all-targets -- -D warnings
      - run: cargo test -p world-machine-desktop
      - run: bash ./scripts/check-boundaries.sh
      - name: Commit activation probe implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/world-pack-process/src/lib.rs crates/world-pack-catalog/src/lib.rs apps/tiny-society-pack/tests/external_pack.rs apps/world-machine-desktop/src/main.rs
          git commit -m 'M60: quarantine Packs until durable activation probe passes'
          git push origin HEAD:m60-pack-activation-probe
