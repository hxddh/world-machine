name: M190 selection discovery
on:
  push:
    branches:
      - agent/m190-selection-discovery
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m190-selection-discovery
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: semantic
      - name: Apply machine selection discovery
        run: |
          python3 .github/scripts/m190_selection_discovery.py
          cargo fmt --all
          cargo test -p world-query
          cargo test -p world-cli
          cargo clippy -p world-query -p world-cli --all-targets -- -D warnings
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/world-query/src/lib.rs crates/world-cli/tests/machine_query_transport.rs
          if git diff --cached --quiet; then
            echo "No patch produced" >&2
            exit 1
          fi
          git commit -m "M190: add evidence selection discovery"
          git push origin HEAD:agent/m190-selection-discovery
