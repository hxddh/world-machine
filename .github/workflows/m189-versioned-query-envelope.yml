name: M189 versioned query envelope
on:
  push:
    branches:
      - agent/m189-versioned-query-envelope
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m189-versioned-query-envelope
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: semantic
      - name: Apply versioned machine query envelope
        run: |
          python3 .github/scripts/m189_versioned_query_envelope.py
          cargo fmt --all
          cargo test -p world-cli
          cargo clippy -p world-cli --all-targets -- -D warnings
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/world-cli/src/main.rs crates/world-cli/tests/machine_query_transport.rs
          if git diff --cached --quiet; then
            echo "No patch produced" >&2
            exit 1
          fi
          git commit -m "M189: version machine query envelopes"
          git push origin HEAD:agent/m189-versioned-query-envelope
