name: M46D Diagnose macOS

on:
  push:
    branches:
      - m46c-generic-world-fork
    paths:
      - .github/workflows/m46d-diagnose.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m46c-generic-world-fork
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Capture world-machine-desktop failure
        shell: bash
        run: |
          set +e
          cargo test -p world-machine-desktop > M46D_CI_LOG.txt 2>&1
          status=$?
          cat M46D_CI_LOG.txt
          if [ "$status" -eq 0 ]; then
            rm M46D_CI_LOG.txt
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add M46D_CI_LOG.txt
          git commit -m "M46D: capture macOS compile failure"
          git push origin HEAD:m46c-generic-world-fork
          exit 0
