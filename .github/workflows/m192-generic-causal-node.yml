name: M192 generic causal node
on:
  push:
    branches:
      - agent/m192-causal-ancestry
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m192-causal-ancestry
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: semantic
      - name: Apply generic causal node naming
        run: |
          python3 .github/scripts/m192_generic_causal_node.py
          cargo fmt --all
          cargo test -p world-query
          cargo test -p world-cli
          cargo clippy -p world-query -p world-cli --all-targets -- -D warnings
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/world-query/src/lib.rs
          if git diff --cached --quiet; then
            echo "No patch produced" >&2
            exit 1
          fi
          git commit -m "M192: generalize causal node DTO"
          git push origin HEAD:agent/m192-causal-ancestry
