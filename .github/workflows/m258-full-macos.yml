name: M258 Full macOS Gate
on:
  push:
    branches:
      - agent/m258-bound-world-cli-query-stdin
permissions:
  contents: write
jobs:
  gpui-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m258-bound-world-cli-query-stdin
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gpui-macos
      - run: cargo test -p world-library
      - run: cargo test -p tiny-society-pack
      - run: cargo test -p pocket-universe-pack
      - run: cargo test -p micro-company-pack
      - run: cargo check -p world-gpui
      - run: cargo check -p world-strategy-gpui
      - run: cargo check -p world-lineage-gpui
      - run: cargo test -p tiny-society-desktop
      - run: cargo test -p future-archaeologist-desktop
      - run: cargo test -p world-machine-desktop
      - run: cargo test -p strategy-comparison-desktop
      - run: cargo test -p lineage-explorer-desktop
      - name: Build and validate World Machine.app
        run: bash apps/world-machine-desktop/macos/build-app.sh
      - name: Smoke packaged analyst runtime
        run: node scripts/check-packaged-analyst-runtime.mjs "target/bundle/World Machine.app"
      - name: Archive World Machine.app
        run: ditto -c -k --keepParent "target/bundle/World Machine.app" target/bundle/World-Machine-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: world-machine-macos-app
          path: target/bundle/World-Machine-macOS.zip
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary validation workflow
        shell: bash
        run: |
          git rm .github/workflows/m258-full-macos.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore: remove M258 macOS validation workflow'
          git push origin HEAD:agent/m258-bound-world-cli-query-stdin
