name: M252 Apply v3
on:
  push:
    branches:
      - agent/m252-bound-analyst-response-framing
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m252-bound-analyst-response-framing
      - name: Reuse validated M252 patch carrier with reader reborrow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/m252-patch.yml')
          source = path.read_text()
          replacements = [
              (
                  "'    let mut limited = reader.take(read_limit as u64);',",
                  "'    let mut limited = (&mut *reader).take(read_limit as u64);',",
              ),
              (
                  "'        assert!(helper.contains(\"take(read_limit as u64)\"));',",
                  "'        assert!(helper.contains(\"(&mut *reader).take(read_limit as u64)\"));',",
              ),
              (
                  '          git rm .github/workflows/m252-patch.yml',
                  '          git rm .github/workflows/m252-patch.yml .github/workflows/m252-v3.yml',
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one carrier replacement, found {count}: {old}')
              source = source.replace(old, new, 1)
          path.write_text(source)

          lines = source.splitlines()
          start = lines.index('        run: |') + 1
          script = []
          for line in lines[start:]:
              if not line.startswith('          '):
                  break
              script.append(line[10:])
          Path('/tmp/m252-apply.sh').write_text('\n'.join(script) + '\n')
          PY
          bash /tmp/m252-apply.sh
