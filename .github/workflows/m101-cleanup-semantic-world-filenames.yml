name: M101 semantic filename cleanup

on:
  push:
    branches:
      - m101-semantic-world-filenames
    paths:
      - '.github/workflows/m101-cleanup-semantic-world-filenames.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m101-semantic-world-filenames
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Remove obsolete filename helper and validate Desktop strictly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/world-machine-desktop/src/main.rs')
          text = path.read_text()
          start = text.index('#[cfg(target_os = "macos")]\nfn canonical_world_name(label: &str) -> String {')
          end = text.index('\n#[cfg(target_os = "macos")]\nfn canonical_world_path', start)
          text = text[:start] + text[end + 1:]
          path.write_text(text)
          PY
          cargo fmt --all
          cargo clippy -p world-machine-desktop --all-targets -- -D warnings
          cargo test -p world-machine-desktop
          git diff --check
      - name: Commit cleanup and remove helper
        if: success()
        shell: bash
        run: |
          rm .github/workflows/m101-cleanup-semantic-world-filenames.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/world-machine-desktop/src/main.rs \
                  .github/workflows/m101-cleanup-semantic-world-filenames.yml
          git commit -m "M101: remove obsolete filename helper"
          git push origin HEAD:m101-semantic-world-filenames
