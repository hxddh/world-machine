name: M120 Apply Patch

on:
  push:
    branches:
      - agent/m120-legacy-feedback-loop
    paths:
      - scripts/m120-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m120-legacy-feedback-loop
          fetch-depth: 0
      - name: Apply M120 patch
        run: python3 scripts/m120_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Test Pocket Universe
        run: cargo test -p pocket-universe
      - name: Test Pocket Universe pack
        run: cargo test -p pocket-universe-pack
      - name: Check diff
        run: git diff --check
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worlds/pocket-universe/src/lib.rs \
                  worlds/pocket-universe/src/legacy.rs \
                  worlds/pocket-universe/tests/emergent_legacy.rs \
                  worlds/pocket-universe/tests/legacy_why.rs \
                  worlds/pocket-universe/Cargo.toml \
                  apps/pocket-universe-pack/Cargo.toml \
                  apps/world-machine-desktop/src/included_packs.rs \
                  Cargo.lock
          git commit -m "M120: let legacy reinforce later world cycles"
          git push origin HEAD:agent/m120-legacy-feedback-loop
