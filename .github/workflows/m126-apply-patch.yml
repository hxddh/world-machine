name: M126 Apply Patch

on:
  push:
    branches:
      - agent/m126-choice-evidence
    paths:
      - scripts/m126-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m126-choice-evidence
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply M126 product patch
        run: python3 scripts/m126_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Test Pocket Universe
        run: cargo test -p pocket-universe
      - name: Test Pocket Universe pack
        run: cargo test -p pocket-universe-pack
      - name: Check diff
        run: git diff --check
      - name: Commit product changes
        run: |
          git config user.name "hxddh"
          git config user.email "hxddh@users.noreply.github.com"
          git add Cargo.lock \
            apps/pocket-universe-pack/Cargo.toml \
            apps/world-machine-desktop/src/included_packs.rs \
            worlds/pocket-universe/Cargo.toml \
            worlds/pocket-universe/src/lib.rs \
            worlds/pocket-universe/src/projection.rs \
            worlds/pocket-universe/tests/choice_evidence.rs
          git commit -m "M126: verify choice consequences from Events"
          git push origin HEAD:agent/m126-choice-evidence
