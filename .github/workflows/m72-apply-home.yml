name: M72 apply included Worlds Home integration

on:
  push:
    branches:
      - m72-included-world-packs
    paths:
      - '.github/workflows/m72-apply-home.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m72-included-world-packs
      - name: Patch World Machine Home
        run: |
          python3 scripts/m72_apply_home.py
          cargo fmt --all
      - name: Commit Home integration and remove one-shot helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m72-apply-home.yml scripts/m72_apply_home.py
          git add apps/world-machine-desktop/src/main.rs
          git commit -m "M72: surface included external Worlds in Home"
          git push origin HEAD:m72-included-world-packs
