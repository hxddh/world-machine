name: M61 Pocket Universe Verify

on:
  push:
    branches: [m61-pocket-universe-pack]
    paths:
      - '.github/workflows/m61-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m61-pocket-universe-pack
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all
      - run: cargo test -p pocket-universe
      - run: cargo test -p pocket-universe-pack
      - run: cargo clippy -p pocket-universe -p pocket-universe-pack --all-targets -- -D warnings
      - run: bash ./scripts/check-boundaries.sh
      - name: Commit verified formatting and lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock worlds/pocket-universe apps/pocket-universe-pack
          if ! git diff --cached --quiet; then
            git commit -m 'M61: verify Pocket Universe external Pack'
            git push origin HEAD:m61-pocket-universe-pack
          fi
