name: M215 local stdio analyst process patch

on:
  push:
    branches:
      - agent/m215-stdio-analyst-process
    paths:
      - .github/workflows/m215-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Apply M215 patch
        run: python3 .github/m215_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Check boundaries
        run: bash ./scripts/check-boundaries.sh
      - name: Test local investigation adapter
        run: cargo test -p world-investigation-local
      - name: Test stdio analyst process
        run: cargo test -p world-agent-tool-stdio
      - name: Test M210 CLI regression
        run: cargo test -p world-cli --test machine_investigation_first_divergence
      - name: Test analyst host layers
        run: cargo test -p world-agent-tool-host && cargo test -p world-agent-tools
      - name: Clippy
        run: cargo clippy -p world-investigation-local -p world-agent-tool-stdio -p world-cli -p world-agent-tool-host -p world-agent-tools --all-targets -- -D warnings
      - name: Commit implementation
        run: |
          git config user.name hxddh
          git config user.email hxddh@users.noreply.github.com
          git add Cargo.toml Cargo.lock NEXT_TASK.md crates/world-investigation-local crates/world-agent-tool-stdio crates/world-cli/Cargo.toml crates/world-cli/src/main.rs
          if ! git diff --cached --quiet; then
            git commit -m "M215: add local stdio analyst process"
            git push
          fi
# retrigger after workflow registration
