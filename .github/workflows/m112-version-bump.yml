name: M112 version bump

on:
  push:
    branches:
      - agent/m112-pocket-universe-emergent-legacy
    paths:
      - scripts/m112-version-trigger

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m112-pocket-universe-emergent-legacy
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply Pocket Universe 0.13.0 version bump
        run: python scripts/m112_version_bump.py
      - name: Refresh workspace lockfile
        run: cargo check -p pocket-universe-pack
      - name: Commit versioned product sources
        shell: bash
        run: |
          git config user.name "world-machine-m112"
          git config user.email "actions@users.noreply.github.com"
          git add Cargo.lock worlds/pocket-universe/src/lib.rs worlds/pocket-universe/Cargo.toml apps/pocket-universe-pack/Cargo.toml apps/world-machine-desktop/src/included_packs.rs
          git diff --cached --quiet && { echo "version bump produced no changes" >&2; exit 1; }
          git commit -m "M112: bump Pocket Universe to 0.13.0"
          git push origin HEAD:agent/m112-pocket-universe-emergent-legacy
