name: M53A Process Runtime Fix

on:
  push:
    branches:
      - m53a-harden-process-pack-runtime

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m53a-harden-process-pack-runtime
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Harden process Pack runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/world-pack-process/src/lib.rs')
          s = p.read_text()
          s = s.replace('use std::io::{self, BufRead, BufReader, BufWriter, Read, Write};', 'use std::io::{self, BufRead, BufReader, BufWriter, Write};')
          old = '''fn resolve_command(manifest_path: &Path, command: &str) -> Result<PathBuf, HostError> {
    let command = PathBuf::from(command);
    let resolved = if command.is_absolute() {
        command
    } else {
        manifest_path
            .parent()
            .unwrap_or_else(|| Path::new("."))
            .join(command)
    };
    if !resolved.is_file() {
'''
          new = '''fn resolve_command(manifest_path: &Path, command: &str) -> Result<PathBuf, HostError> {
    let command = PathBuf::from(command);
    let resolved = if command.is_absolute() {
        command
    } else {
        let manifest_dir = manifest_path
            .parent()
            .filter(|parent| !parent.as_os_str().is_empty())
            .unwrap_or_else(|| Path::new("."));
        manifest_dir.join(command)
    };
    let resolved = resolved.canonicalize().map_err(|error| {
        HostError::pack_source(format!(
            "could not resolve Pack process command {}: {error}",
            resolved.display()
        ))
    })?;
    if !resolved.is_file() {
'''
          if old not in s:
              raise SystemExit('resolve_command marker not found')
          s = s.replace(old, new)
          s = s.replace('let error = registry.create("fixture.external").unwrap_err();', 'let error = match registry.create("fixture.external") {\n            Ok(_) => panic!("descriptor mismatch should fail"),\n            Err(error) => error,\n        };')
          p.write_text(s)
          PY
          cargo fmt --all
          cargo test -p world-pack-process
      - name: Commit fixes and remove helper workflow
        run: |
          rm -f .github/workflows/m53a-fix.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "M53A: harden process Pack workspace integration"
          git push origin HEAD:m53a-harden-process-pack-runtime
