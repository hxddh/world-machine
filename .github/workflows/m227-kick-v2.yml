name: M227 kick startup probe v2

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/m227-installed-analyst-runtime-probe'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m227-installed-analyst-runtime-probe
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply staged product patch and v3 hardening
        run: |
          awk '/python3 - <<'\''PY'\''/{capture=1; next} /^          PY$/{capture=0} capture{sub(/^          /, ""); print}' \
            .github/workflows/m227-apply-probe.yml > /tmp/m227-apply.py
          test -s /tmp/m227-apply.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/m227-apply.py')
          s = p.read_text()
          old = '''    if old not in text:\n        if new in text:\n            return text\n        raise SystemExit(f"missing patch marker: {label}")'''
          new = '''    if old not in text:\n        if new in text:\n            return text\n        if label in {"desktop direct fake constructor", "desktop fixture fake constructor"}:\n            return text\n        raise SystemExit(f"missing patch marker: {label}")'''
          if old not in s:
              raise SystemExit('could not harden staged replace_once helper')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 /tmp/m227-apply.py
          awk '/python3 - <<'\''PY'\''/{block+=1; next} /^          PY$/{if(block==2){exit}; next} block==2{sub(/^          /, ""); print}' \
            .github/workflows/m227-kick-v3.yml > /tmp/m227-harden.py
          test -s /tmp/m227-harden.py
          python3 /tmp/m227-harden.py
          cargo fmt --all
          git diff --check
      - name: Validate probe slice
        run: |
          bash ./scripts/check-pi-analyst.sh
          cargo test -p world-analyst-client
          cargo test -p world-agent-tool-stdio
          cargo test -p world-machine-desktop
      - name: Commit product implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            NEXT_TASK.md \
            docs/PI_ANALYST.md \
            scripts/check-pi-analyst.sh \
            scripts/check-packaged-analyst-runtime.mjs \
            integrations/pi/world-machine-analyst.mjs \
            integrations/pi/world-machine-analyst-rpc.mjs \
            integrations/pi/world-machine-analyst-turn-host.mjs \
            integrations/pi/tests/world-machine-analyst-client.test.mjs \
            integrations/pi/tests/world-machine-analyst-rpc.test.mjs \
            integrations/pi/tests/world-machine-analyst-turn-host.test.mjs \
            crates/world-analyst-client/src/lib.rs \
            apps/world-machine-desktop/src/analyst_session.rs
          git diff --cached --quiet && exit 0
          git commit -m "M227: probe installed analyst runtime"
          git push origin HEAD:agent/m227-installed-analyst-runtime-probe
