name: M157 patch

on:
  push:
    branches:
      - agent/m157-protocol-v2-negotiation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m157-protocol-v2-negotiation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Add protocol v2 negotiation
        run: python3 .github/m157_patch.py
      - name: Format and verify patch
        run: |
          cargo fmt --all
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/world-pack-protocol/src/lib.rs crates/world-pack-process/src/lib.rs
          git commit -m "M157: negotiate Pack protocol versions"
          git push origin HEAD:agent/m157-protocol-v2-negotiation
