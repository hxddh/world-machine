name: M157 patch

on:
  push:
    branches:
      - agent/m157-protocol-v2-negotiation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m157-protocol-v2-negotiation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Add protocol v2 negotiation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          protocol_path = Path('crates/world-pack-protocol/src/lib.rs')
          text = protocol_path.read_text()
          old = 'pub const PACK_PROTOCOL_VERSION: u32 = 1;\n'
          new = 'pub const PACK_PROTOCOL_VERSION_V1: u32 = 1;\npub const PACK_PROTOCOL_VERSION_V2: u32 = 2;\npub const PACK_PROTOCOL_VERSION: u32 = PACK_PROTOCOL_VERSION_V2;\n'
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''    pub fn validate(&self) -> Result<(), ProtocolError> {
        validate_protocol_version(self.protocol_version)
    }
}

#[derive(Clone, Debug, PartialEq, Serialize, Deserialize)]
pub struct PackResponseEnvelope {
'''
          new = '''    pub fn for_version(
        protocol_version: u32,
        request_id: u64,
        request: PackRequest,
    ) -> Result<Self, ProtocolError> {
        validate_protocol_version(protocol_version)?;
        Ok(Self {
            protocol_version,
            request_id,
            request,
        })
    }

    pub fn validate(&self) -> Result<(), ProtocolError> {
        validate_protocol_version(self.protocol_version)
    }
}

