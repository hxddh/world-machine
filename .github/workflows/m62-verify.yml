name: M62 Living Pocket Universe Verify

on:
  push:
    branches: [m62-pocket-universe-life]
    paths:
      - '.github/workflows/m62-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m62-pocket-universe-life
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python scripts/m62_pocket_life.py
      - run: cargo fmt --all
      - run: cargo test -p pocket-universe
      - run: cargo test -p pocket-universe-pack
      - run: cargo clippy -p pocket-universe -p pocket-universe-pack --all-targets -- -D warnings
      - run: bash ./scripts/check-boundaries.sh
      - name: Commit verified Pocket Universe v0.2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock worlds/pocket-universe apps/pocket-universe-pack
          git commit -m 'M62: make Pocket Universe grow into durable stories'
          git push origin HEAD:m62-pocket-universe-life
