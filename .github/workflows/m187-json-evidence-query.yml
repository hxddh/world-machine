name: M187 JSON evidence query
on:
  push:
    branches:
      - agent/m187-json-evidence-query
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m187-json-evidence-query
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: semantic
      - name: Apply machine-readable evidence query CLI
        run: |
          python3 .github/scripts/m187_json_evidence_query.py
          cargo fmt --all
          cargo test -p world-cli
          cargo clippy -p world-cli --all-targets -- -D warnings
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/world-cli/src/main.rs Cargo.lock
          if git diff --cached --quiet; then
            echo "No patch produced" >&2
            exit 1
          fi
          git commit -m "M187: add machine-readable evidence query CLI"
          git push origin HEAD:agent/m187-json-evidence-query
