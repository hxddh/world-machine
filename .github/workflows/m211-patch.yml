name: M211 read-only agent tool boundary patch

on:
  push:
    branches:
      - agent/m211-readonly-agent-tool-boundary
    paths:
      - .github/workflows/m211-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Apply M211 patch
        run: python3 .github/m211_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Check boundaries
        run: bash ./scripts/check-boundaries.sh
      - name: Test agent tools
        run: cargo test -p world-agent-tools
      - name: Test investigation regression
        run: cargo test -p world-investigation
      - name: Clippy
        run: cargo clippy -p world-agent-tools -p world-investigation --all-targets -- -D warnings
      - name: Commit implementation
        run: |
          git config user.name hxddh
          git config user.email hxddh@users.noreply.github.com
          git add Cargo.toml Cargo.lock NEXT_TASK.md scripts/check-boundaries.sh crates/world-agent-tools/Cargo.toml crates/world-agent-tools/src/lib.rs
          if ! git diff --cached --quiet; then
            git commit -m "M211: add read-only agent tool boundary"
            git push
          fi
# trigger after workflow registration
