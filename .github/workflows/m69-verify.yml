name: M69 Cleanup Helpers

on:
  push:
    branches: [m69-pocket-universe-social-arcs]
    paths:
      - '.github/workflows/m69-verify.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m69-pocket-universe-social-arcs
      - name: Remove temporary M69 helpers
        run: |
          git rm \
            scripts/m69_social_arcs.py \
            scripts/m69_projection_anchor_fix.py \
            scripts/m69_test_lifetime_fix.py \
            scripts/m69_persistent_arc_fields.py \
            scripts/m69_harden_committed_arc_fields.py \
            .github/workflows/m69-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'M69: remove temporary verification helpers'
          git push origin HEAD:m69-pocket-universe-social-arcs
