name: M112 apply source patch

on:
  push:
    branches:
      - agent/m112-pocket-universe-emergent-legacy
    paths:
      - scripts/m112-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m112-pocket-universe-emergent-legacy
      - name: Apply deterministic source patch
        run: python scripts/m112_patch.py
      - name: Format Pocket Universe sources
        run: cargo fmt --all
      - name: Commit generated source changes
        shell: bash
        run: |
          git config user.name "world-machine-m112"
          git config user.email "actions@users.noreply.github.com"
          git add worlds/pocket-universe/src/lib.rs worlds/pocket-universe/src/projection.rs
          git diff --cached --quiet && { echo "patch produced no source changes" >&2; exit 1; }
          git commit -m "M112: wire emergent Pocket Universe legacy"
          git push origin HEAD:agent/m112-pocket-universe-emergent-legacy
