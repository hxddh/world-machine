name: M214 analyst tool host patch

on:
  push:
    branches:
      - agent/m214-analyst-tool-host
    paths:
      - .github/workflows/m214-host-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Apply M214 host patch
        run: python3 .github/m214_host_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Check boundaries
        run: bash ./scripts/check-boundaries.sh
      - name: Test analyst host
        run: cargo test -p world-agent-tool-host
      - name: Test tool layer regressions
        run: cargo test -p world-agent-tools && cargo test -p world-investigation
      - name: Clippy
        run: cargo clippy -p world-agent-tool-host -p world-agent-tools -p world-investigation --all-targets -- -D warnings
      - name: Commit implementation
        run: |
          git config user.name hxddh
          git config user.email hxddh@users.noreply.github.com
          git add Cargo.toml Cargo.lock NEXT_TASK.md scripts/check-boundaries.sh crates/world-agent-tool-host/Cargo.toml crates/world-agent-tool-host/src/lib.rs
          if ! git diff --cached --quiet; then
            git commit -m "M214: add read-only analyst tool host"
            git push
          fi
