name: M226 finalizer

on:
  push:
    branches:
      - agent/m226-persistent-analyst-runtime-paths

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m226-persistent-analyst-runtime-paths
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Invalidate stale readiness and format
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/world-machine-desktop/src/analyst_panel.rs')
          source = path.read_text()
          old = '''                    Err(error) => {
                        this.cancellation = None;
                        this.phase = PanelPhase::Setup;
                        this.last_error = Some(error);
                    }
'''
          new = '''                    Err(error) => {
                        this.cancellation = None;
                        this.runtime = None;
                        this.phase = PanelPhase::Setup;
                        this.last_error = Some(error);
                    }
'''
          if old in source:
              path.write_text(source.replace(old, new, 1))
          elif 'this.runtime = None;' not in source:
              raise SystemExit('expected analyst startup failure block not found')
          PY
          cargo fmt --all
          git diff --check
      - name: Commit generated finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/world-machine-desktop/src/analyst_panel.rs apps/world-machine-desktop/src/analyst_runtime.rs apps/world-machine-desktop/src/analyst_settings.rs
          git diff --cached --quiet && exit 0
          git commit -m "M226: finalize analyst runtime settings"
          git push origin HEAD:agent/m226-persistent-analyst-runtime-paths
