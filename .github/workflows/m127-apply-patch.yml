name: M127 Apply Patch

on:
  push:
    branches:
      - agent/m127-causal-choice-history
    paths:
      - scripts/m127-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m127-causal-choice-history
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply M127 runtime patch
        run: |
          python3 scripts/m127_runtime.py
          python3 scripts/m127_helpers.py
          python3 scripts/m127_versions.py
      - name: Format
        run: cargo fmt --all
      - name: Test Pocket Universe
        run: cargo test -p pocket-universe
      - name: Test Pocket Universe pack
        run: cargo test -p pocket-universe-pack
      - name: Check diff
        run: git diff --check
      - name: Commit product changes
        run: |
          git config user.name "hxddh"
          git config user.email "hxddh@users.noreply.github.com"
          git add Cargo.lock \
            apps/pocket-universe-pack/Cargo.toml \
            apps/world-machine-desktop/src/included_packs.rs \
            worlds/pocket-universe/Cargo.toml \
            worlds/pocket-universe/src/lib.rs
          git commit -m "M127: carry durable choices into causal history"
          git push origin HEAD:agent/m127-causal-choice-history
