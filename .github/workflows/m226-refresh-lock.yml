name: M226 refresh Cargo lock

on:
  push:
    branches:
      - agent/m226-persistent-analyst-runtime-paths

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m226-persistent-analyst-runtime-paths
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh Cargo.lock
        run: cargo metadata --format-version 1 > /dev/null
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git diff --check -- Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Cargo.lock
          git commit -m "M226: refresh Cargo.lock"
          git push origin HEAD:agent/m226-persistent-analyst-runtime-paths
