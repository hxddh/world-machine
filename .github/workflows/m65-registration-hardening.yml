name: M65 Registration Provenance Hardening

on:
  push:
    branches: [m65-pocket-universe-mind-provenance]
    paths:
      - '.github/workflows/m65-registration-hardening.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m65-pocket-universe-mind-provenance
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python scripts/m65_registration_hardening.py
      - run: cargo fmt --all
      - run: cargo test -p pocket-universe
      - run: cargo test -p pocket-universe-pack
      - run: cargo clippy -p pocket-universe -p pocket-universe-pack --all-targets -- -D warnings
      - run: bash ./scripts/check-boundaries.sh
      - name: Commit registration hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worlds/pocket-universe/src/lib.rs apps/pocket-universe-pack/src/main.rs
          git commit -m 'M65: make mind provenance registration fallible'
          git push origin HEAD:m65-pocket-universe-mind-provenance
