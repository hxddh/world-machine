name: M255 Codex Fix
on:
  push:
    branches:
      - agent/m255-bound-analyst-tool-host-framing
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m255-bound-analyst-tool-host-framing
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply Codex fixes and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('integrations/pi/world-machine-analyst-client.mjs')
          text = p.read_text()
          old = "\n".join([
              '      const responsePromise = this.#nextLine();',
              '      await this.#writeLine(request);',
              '      const line = await this.#withAbort(responsePromise, signal);',
              '      if (this.framingError) throw this.framingError;',
          ])
          new = "\n".join([
              '      const responsePromise = this.#nextLine();',
              '      try {',
              '        await this.#writeLine(request);',
              '      } catch (error) {',
              '        responsePromise.catch(() => {});',
              '        if (this.framingError) throw this.framingError;',
              '        throw error;',
              '      }',
              '      const line = await this.#withAbort(responsePromise, signal);',
              '      if (this.framingError) throw this.framingError;',
          ])
          if old not in text:
              raise SystemExit('roundTrip write-race pattern not found')
          text = text.replace(old, new, 1)
          old2 = '      promise.then(() => true),'
          new2 = '      promise.then(() => true, () => false),'
          if old2 not in text:
              raise SystemExit('settledBefore rejection pattern not found')
          text = text.replace(old2, new2, 1)
          p.write_text(text)

          t = Path('integrations/pi/tests/world-machine-analyst-client.test.mjs')
          tests = t.read_text()
          marker = 'test("provider tool names are deterministic and constrained", () => {'
          if marker not in tests:
              raise SystemExit('test insertion marker not found')
          added = "\n".join([
              'test("Analyst JSONL framing observes the pending response when request writing fails", async () => {',
              '  const maxRecordBytes = 32;',
              '  const { client, child } = controlledClient(() => {}, { maxRecordBytes });',
              '  const originalWrite = child.stdin.write.bind(child.stdin);',
              '  child.stdin.write = (chunk, encoding, callback) => {',
              '    child.stdout.write(Buffer.alloc(maxRecordBytes + 2, 0x78));',
              '    queueMicrotask(() => callback(new Error("simulated EPIPE")));',
              '    return true;',
              '  };',
              '',
              '  try {',
              '    await assert.rejects(',
              '      client.listTools(),',
              '      (error) => error instanceof AnalystBridgeError && /record exceeded/.test(error.message),',
              '    );',
              '    await new Promise((resolve) => setImmediate(resolve));',
              '  } finally {',
              '    child.stdin.write = originalWrite;',
              '  }',
              '});',
              '',
              'test("Analyst JSONL framing still escalates when the exit wait rejects on child error", async () => {',
              '  const maxRecordBytes = 32;',
              '  const { client, child, killSignals } = controlledClient(',
              '    () => {},',
              '    { maxRecordBytes },',
              '    { ignoreSigterm: true },',
              '  );',
              '',
              '  child.stdout.write(Buffer.alloc(maxRecordBytes + 2, 0x78));',
              '  child.emit("error", new Error("simulated child error during termination"));',
              '  await assert.rejects(client.listTools(), /record exceeded/);',
              '  await new Promise((resolve) => setImmediate(resolve));',
              '  assert.deepEqual(killSignals, ["SIGTERM", "SIGKILL"]);',
              '  assert.equal(child.signalCode, "SIGKILL");',
              '});',
              '',
              '',
          ])
          t.write_text(tests.replace(marker, added + marker, 1))
          PY
          node --check integrations/pi/world-machine-analyst-client.mjs
          node --test integrations/pi/tests/world-machine-analyst-client.test.mjs
          bash ./scripts/check-pi-analyst.sh
          cargo fmt --all -- --check
          git rm .github/workflows/m255-codex-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add integrations/pi/world-machine-analyst-client.mjs integrations/pi/tests/world-machine-analyst-client.test.mjs
          git commit -m 'M255: close framing write and exit races'
          git push origin HEAD:agent/m255-bound-analyst-tool-host-framing
