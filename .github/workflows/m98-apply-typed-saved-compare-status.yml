name: M98 typed Saved Compare status

on:
  push:
    branches: [m98-typed-saved-compare-status]

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m98-typed-saved-compare-status
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply and test
        shell: bash
        run: |
          python3 -c "import base64; exec(base64.b64decode(''))"
          cargo fmt --all
          cargo test -p world-machine-desktop
          git diff --check
      - name: Commit and remove helper
        if: success()
        shell: bash
        run: |
          rm .github/workflows/m98-apply-typed-saved-compare-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/world-machine-desktop/src/saved_compare.rs .github/workflows/m98-apply-typed-saved-compare-status.yml
          git commit -m "M98: give Saved Compare explicit status semantics"
          git push origin HEAD:m98-typed-saved-compare-status
