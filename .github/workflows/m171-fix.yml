name: M171 fix

on:
  push:
    branches:
      - agent/m171-stable-relation-identity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m171-stable-relation-identity
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply compatibility fallback
        run: |
          python3 .github/scripts/m171_fix.py
          cargo fmt --all
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/world-compare/src/lib.rs
          git commit -m "M171: preserve legacy Relation comparison fallback"
          git push origin HEAD:agent/m171-stable-relation-identity
