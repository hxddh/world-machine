name: Release Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Tag to create and release from this commit: v<app-version> for a
          stable release or v<app-version>-pre.N (N >= 1) for a pre-release.
          Leave empty for a pre.0 dry run that only uploads an Actions artifact.
        required: false
        type: string
  push:
    tags:
      - 'v*-pre.*'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: prerelease-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos

      - name: Resolve release tag
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "create_tag=false" >> "$GITHUB_OUTPUT"
          elif [[ -n "${INPUT_RELEASE_TAG:-}" ]]; then
              echo "tag=$INPUT_RELEASE_TAG" >> "$GITHUB_OUTPUT"
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "create_tag=true" >> "$GITHUB_OUTPUT"
          else
              echo "tag=" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "create_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release tag
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, sys
          metadata = json.load(sys.stdin)
          for package in metadata["packages"]:
              if package["name"] == "world-machine-desktop":
                  print(package["version"])
                  break
          else:
              raise SystemExit("world-machine-desktop package not found")
          ')"
          python3 - "$RELEASE_TAG" "$VERSION" <<'PY'
          import re
          import sys

          tag, version = sys.argv[1:]
          if not re.fullmatch(rf"v{re.escape(version)}(-pre\.([1-9][0-9]*))?", tag):
              raise SystemExit(
                  f"release tag {tag!r} must match app version {version!r} as "
                  f"v{version} or v{version}-pre.N with N >= 1"
              )
          PY

      - name: Test release-critical macOS paths
        run: |
          cargo test -p world-library
          cargo test -p pocket-universe-pack
          cargo test -p micro-company-pack
          cargo test -p tiny-society-pack
          cargo test -p world-machine-desktop

      - name: Install universal build targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Signing and notarization switch on by adding repository secrets; the
      # pipeline is otherwise identical. See docs/RELEASE_SIGNING.md.
      #   APPLE_CERTIFICATE_P12       base64 of the Developer ID Application .p12
      #   APPLE_CERTIFICATE_PASSWORD  password of that .p12
      #   APPLE_ID                    Apple ID that owns the certificate
      #   APPLE_TEAM_ID               ten-character Team ID
      #   APPLE_APP_PASSWORD          app-specific password for notarytool
      - name: Import Developer ID certificate
        id: signing
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -z "${APPLE_CERTIFICATE_P12:-}" ]]; then
              echo "No Developer ID certificate configured; building the ad-hoc package."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/world-machine-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A \
              -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$CERT_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
              | grep -o '"Developer ID Application: [^"]*"' | head -n 1 | tr -d '"')"
          if [[ -z "$IDENTITY" ]]; then
              echo "The certificate did not yield a Developer ID Application identity" >&2
              exit 1
          fi
          echo "WORLD_MACHINE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          if [[ -n "${APPLE_ID:-}" && -n "${APPLE_TEAM_ID:-}" && -n "${APPLE_APP_PASSWORD:-}" ]]; then
              xcrun notarytool store-credentials world-machine \
                  --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                  --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN"
              echo "WORLD_MACHINE_NOTARIZE=1" >> "$GITHUB_ENV"
              echo "WORLD_MACHINE_NOTARY_PROFILE=world-machine" >> "$GITHUB_ENV"
          else
              echo "Certificate present but notarization secrets missing; a signed, unnotarized package is not publishable." >&2
              exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build and validate universal World Machine.app
        env:
          WORLD_MACHINE_UNIVERSAL: "1"
        run: bash apps/world-machine-desktop/macos/build-app.sh

      - name: Package release build
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
              export WORLD_MACHINE_RELEASE_TAG="$RELEASE_TAG"
          fi
          bash apps/world-machine-desktop/macos/package-release.sh

      - name: Validate publishable tag package
        if: steps.release.outputs.publish == 'true'
        run: python3 scripts/validate_release_package.py --publishing target/release-package

      - name: Render release notes
        if: steps.release.outputs.publish == 'true'
        run: |
          python3 scripts/render_release_notes.py \
            target/release-package/release-manifest.json \
            --repository "$GITHUB_REPOSITORY" \
            > target/RELEASE_NOTES.md

      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CREATE_TAG: ${{ steps.release.outputs.create_tag }}
        run: |
          # A tag push releases the pushed tag and refuses to invent one.
          # A dispatch with release_tag creates that tag at the dispatched
          # commit, which is how a release is cut without local tag access.
          if [[ "$CREATE_TAG" == "true" ]]; then
              TAG_ARGS=(--target "$GITHUB_SHA")
          else
              TAG_ARGS=(--verify-tag)
          fi
          # A -pre.N tag is a pre-release; a bare v<version> tag is the
          # stable release and becomes the "latest" release.
          if [[ "$RELEASE_TAG" == *-pre.* ]]; then
              KIND_ARGS=(--prerelease)
          else
              KIND_ARGS=(--latest)
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "${KIND_ARGS[@]}" \
            "${TAG_ARGS[@]}" \
            --title "World Machine $RELEASE_TAG" \
            --notes-file target/RELEASE_NOTES.md \
            target/release-package/*.dmg \
            target/release-package/*.dmg.sha256 \
            target/release-package/*.zip \
            target/release-package/*.zip.sha256 \
            target/release-package/release-manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: world-machine-release-package
          path: target/release-package/*
          if-no-files-found: error
          retention-days: 14
