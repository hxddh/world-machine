name: Release Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Tag to create and release from this commit: v<app-version> for a
          stable release or v<app-version>-pre.N (N >= 1) for a pre-release.
          Leave empty for a pre.0 dry run that only uploads an Actions artifact.
        required: false
        type: string
  push:
    tags:
      - 'v*-pre.*'
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Nothing by default. The build job, which runs the repository's code and
# holds the signing certificate, can only read; the publish job, which runs
# none of the repository's code, is the only one that can write.
permissions: {}

concurrency:
  group: prerelease-package-${{ github.ref }}
  cancel-in-progress: false

# Signing: explicit, and a switch for stable tags.
#
# - With no signing secrets, every package is built **ad-hoc signed and not
#   notarized**. The run says so in a warning and in its summary, the
#   manifest records `"signing": "ad-hoc"`, and the release notes carry the
#   Gatekeeper warning. That is how every release through v0.24 shipped.
# - Once the signing secrets exist (APPLE_CERTIFICATE_P12 and the notary
#   secrets below), every package is Developer ID signed and notarized, and
#   a stable tag (v<version>, not -pre.N) is refused unless its package
#   validates as signed.
# - The switch: set the repository variable
#   WORLD_MACHINE_REQUIRE_SIGNED_RELEASES to `true` (Settings -> Secrets and
#   variables -> Actions -> Variables) once signing is set up. From then on
#   a stable tag is refused before anything is built if the certificate
#   secret is missing (expired, rotated away, or a fork), rather than
#   quietly falling back to ad-hoc. Pre-release tags stay allowed ad-hoc.
#   See docs/RELEASE_SIGNING.md.

jobs:
  macos-release:
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      create_tag: ${{ steps.release.outputs.create_tag }}
      signing: ${{ steps.policy.outputs.signing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-macos

      - name: Resolve release tag
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "create_tag=false" >> "$GITHUB_OUTPUT"
          elif [[ -n "${INPUT_RELEASE_TAG:-}" ]]; then
              echo "tag=$INPUT_RELEASE_TAG" >> "$GITHUB_OUTPUT"
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "create_tag=true" >> "$GITHUB_OUTPUT"
          else
              echo "tag=" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "create_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release tag
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          VERSION="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c '
          import json, sys
          metadata = json.load(sys.stdin)
          for package in metadata["packages"]:
              if package["name"] == "world-machine-desktop":
                  print(package["version"])
                  break
          else:
              raise SystemExit("world-machine-desktop package not found")
          ')"
          python3 - "$RELEASE_TAG" "$VERSION" <<'PY'
          import re
          import sys

          tag, version = sys.argv[1:]
          if not re.fullmatch(rf"v{re.escape(version)}(-pre\.([1-9][0-9]*))?", tag):
              raise SystemExit(
                  f"release tag {tag!r} must match app version {version!r} as "
                  f"v{version} or v{version}-pre.N with N >= 1"
              )
          PY

      - name: Decide signing
        id: policy
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PUBLISH: ${{ steps.release.outputs.publish }}
          # Only whether the certificate exists; the secret itself is read by
          # the import step alone.
          HAS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
          REQUIRE_SIGNED_RELEASES: ${{ vars.WORLD_MACHINE_REQUIRE_SIGNED_RELEASES }}
        run: |
          stable=false
          if [[ "$PUBLISH" == "true" && "$RELEASE_TAG" != *-pre.* ]]; then
              stable=true
          fi
          if [[ "$HAS_CERTIFICATE" == "true" ]]; then
              signing=developer-id
              label="Developer ID signed and notarized"
          elif [[ "$stable" == "true" && "$REQUIRE_SIGNED_RELEASES" == "true" ]]; then
              echo "::error title=Unsigned stable release refused::$RELEASE_TAG is a stable tag and WORLD_MACHINE_REQUIRE_SIGNED_RELEASES is true, but APPLE_CERTIFICATE_P12 is not set. Restore the signing secrets or cut a -pre.N tag. See docs/RELEASE_SIGNING.md."
              exit 1
          else
              signing=ad-hoc
              label="ad-hoc signed, NOT notarized (no signing secrets configured)"
              echo "::warning title=Ad-hoc signed package::This package is ad-hoc signed and not notarized; macOS Gatekeeper will interrupt its first launch. Add the signing secrets in docs/RELEASE_SIGNING.md to sign it."
          fi
          # A stable tag must validate as signed once signing is configured,
          # or once the switch says it must be.
          require_signed=false
          if [[ "$stable" == "true" && ( "$HAS_CERTIFICATE" == "true" || "$REQUIRE_SIGNED_RELEASES" == "true" ) ]]; then
              require_signed=true
          fi
          echo "signing=$signing" >> "$GITHUB_OUTPUT"
          echo "require_signed=$require_signed" >> "$GITHUB_OUTPUT"
          {
              echo "### Signing"
              echo ""
              echo "- Package: **$label**"
              echo "- Tag: \`${RELEASE_TAG:-none (dry run)}\`, stable: $stable"
              echo "- Signed package required to publish: $require_signed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test release-critical macOS paths
        run: |
          cargo test --locked -p world-library
          cargo test --locked -p pocket-universe-pack
          cargo test --locked -p tiny-society-pack
          cargo test --locked -p world-machine-desktop

      - name: Install universal build targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # The on-device model helper (apps/fm-helper) builds only where the
      # runner's SDK has FoundationModels (macOS 26 and later), signed ad
      # hoc; anywhere else the script says so and exits cleanly. It is not
      # part of the package yet and never holds up a release.
      - name: Build the on-device model helper (when the SDK has it)
        continue-on-error: true
        run: bash apps/fm-helper/build.sh

      # Signing and notarization switch on by adding repository secrets; the
      # pipeline is otherwise identical. See docs/RELEASE_SIGNING.md.
      #   APPLE_CERTIFICATE_P12       base64 of the Developer ID Application .p12
      #   APPLE_CERTIFICATE_PASSWORD  password of that .p12
      #   APPLE_ID                    Apple ID that owns the certificate
      #   APPLE_TEAM_ID               ten-character Team ID
      #   APPLE_APP_PASSWORD          app-specific password for notarytool
      - name: Import Developer ID certificate
        id: signing
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -z "${APPLE_CERTIFICATE_P12:-}" ]]; then
              echo "No Developer ID certificate configured; building the ad-hoc package."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/world-machine-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A \
              -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$CERT_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
              | grep -o '"Developer ID Application: [^"]*"' | head -n 1 | tr -d '"')"
          if [[ -z "$IDENTITY" ]]; then
              echo "The certificate did not yield a Developer ID Application identity" >&2
              exit 1
          fi
          echo "WORLD_MACHINE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          if [[ -n "${APPLE_ID:-}" && -n "${APPLE_TEAM_ID:-}" && -n "${APPLE_APP_PASSWORD:-}" ]]; then
              xcrun notarytool store-credentials world-machine \
                  --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                  --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN"
              echo "WORLD_MACHINE_NOTARIZE=1" >> "$GITHUB_ENV"
              echo "WORLD_MACHINE_NOTARY_PROFILE=world-machine" >> "$GITHUB_ENV"
          else
              echo "Certificate present but notarization secrets missing; a signed, unnotarized package is not publishable." >&2
              exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build and validate universal World Machine.app
        env:
          WORLD_MACHINE_UNIVERSAL: "1"
        run: bash apps/world-machine-desktop/macos/build-app.sh

      - name: Package release build
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
              export WORLD_MACHINE_RELEASE_TAG="$RELEASE_TAG"
          fi
          bash apps/world-machine-desktop/macos/package-release.sh

      - name: Validate publishable tag package
        if: steps.release.outputs.publish == 'true'
        env:
          REQUIRE_SIGNED: ${{ steps.policy.outputs.require_signed }}
        run: |
          args=(--publishing)
          if [[ "$REQUIRE_SIGNED" == "true" ]]; then
              args+=(--require-signed)
          fi
          python3 scripts/validate_release_package.py "${args[@]}" target/release-package

      - name: Render release notes
        if: steps.release.outputs.publish == 'true'
        run: |
          mkdir -p target/release-notes
          python3 scripts/render_release_notes.py \
            target/release-package/release-manifest.json \
            --repository "$GITHUB_REPOSITORY" \
            > target/release-notes/RELEASE_NOTES.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: world-machine-release-package
          path: target/release-package/*
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.release.outputs.publish == 'true'
        with:
          name: world-machine-release-notes
          path: target/release-notes/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: macos-release
    if: needs.macos-release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Creates the tag (on a dispatch) and the release.
      contents: write
    steps:
      # No checkout: this job runs nothing from the repository. It publishes
      # exactly the package the build job validated.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: world-machine-release-package
          path: target/release-package
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: world-machine-release-notes
          path: target

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.macos-release.outputs.tag }}
          CREATE_TAG: ${{ needs.macos-release.outputs.create_tag }}
        run: |
          # A tag push releases the pushed tag and refuses to invent one.
          # A dispatch with release_tag creates that tag at the dispatched
          # commit, which is how a release is cut without local tag access.
          if [[ "$CREATE_TAG" == "true" ]]; then
              TAG_ARGS=(--target "$GITHUB_SHA")
          else
              TAG_ARGS=(--verify-tag)
          fi
          # A -pre.N tag is a pre-release; a bare v<version> tag is the
          # stable release and becomes the "latest" release.
          if [[ "$RELEASE_TAG" == *-pre.* ]]; then
              KIND_ARGS=(--prerelease)
          else
              KIND_ARGS=(--latest)
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "${KIND_ARGS[@]}" \
            "${TAG_ARGS[@]}" \
            --title "World Machine $RELEASE_TAG" \
            --notes-file target/RELEASE_NOTES.md \
            target/release-package/*.dmg \
            target/release-package/*.dmg.sha256 \
            target/release-package/*.zip \
            target/release-package/*.zip.sha256 \
            target/release-package/release-manifest.json
