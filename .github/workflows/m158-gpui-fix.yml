name: M158 GPUI fix

on:
  push:
    branches:
      - agent/m158-relation-selection-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m158-relation-selection-v2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Fix GPUI Event-only match
        run: python3 .github/m158_gpui_fix.py
      - name: Format patch
        run: |
          cargo fmt --all
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/world-gpui/src/macos.rs
          git commit -m "M158: keep Relation out of event-only GPUI paths"
          git push origin HEAD:agent/m158-relation-selection-v2
