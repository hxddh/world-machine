name: M96 strategy future semantic titles

on:
  push:
    branches:
      - m96-strategy-future-semantic-titles

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m96-strategy-future-semantic-titles
      - uses: dtolnay/rust-toolchain@stable
      - name: Preserve StrategyOutcome semantic titles when saving Futures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/world-machine-desktop/src/strategy_compare.rs')
          text = path.read_text()

          old = '''        let left_archive = evaluation\n            .left\n            .outcome()\n            .and_then(|outcome| outcome.archive.clone());\n        let right_archive = evaluation\n            .right\n            .outcome()\n            .and_then(|outcome| outcome.archive.clone());'''
          new = '''        let left_display_title = evaluation\n            .left\n            .outcome()\n            .and_then(|outcome| strategy_future_display_title(&outcome.snapshot.title));\n        let right_display_title = evaluation\n            .right\n            .outcome()\n            .and_then(|outcome| strategy_future_display_title(&outcome.snapshot.title));\n        let left_archive = evaluation\n            .left\n            .outcome()\n            .and_then(|outcome| outcome.archive.clone());\n        let right_archive = evaluation\n            .right\n            .outcome()\n            .and_then(|outcome| outcome.archive.clone());'''
          assert old in text, 'strategy outcome archive extraction changed unexpectedly'
          text = text.replace(old, new, 1)

          old = '''                    left_archive,\n                    right_archive,\n                    left_lineage,\n                    right_lineage,'''
          new = '''                    left_archive,\n                    right_archive,\n                    left_display_title,\n                    right_display_title,\n                    left_lineage,\n                    right_lineage,'''
          assert old in text, 'StrategyResultView construction changed unexpectedly'
          text = text.replace(old, new, 1)

          old = '''    left_archive: Option<WorldArchive>,\n    right_archive: Option<WorldArchive>,\n    left_lineage: WorldLineage,'''
          new = '''    left_archive: Option<WorldArchive>,\n    right_archive: Option<WorldArchive>,\n    left_display_title: Option<String>,\n    right_display_title: Option<String>,\n    left_lineage: WorldLineage,'''
          assert old in text, 'StrategyResultView fields changed unexpectedly'
          text = text.replace(old, new, 1)

          old = '''        let (archive, lineage, label, side_label) = match side {\n            FutureSide::Left => (\n                self.left_archive\n                    .clone()\n                    .ok_or_else(|| "Future A has no durable archive".to_string())?,\n                self.left_lineage.clone(),\n                self.left_label.clone(),\n                "Future A",\n            ),\n            FutureSide::Right => (\n                self.right_archive\n                    .clone()\n                    .ok_or_else(|| "Future B has no durable archive".to_string())?,\n                self.right_lineage.clone(),\n                self.right_label.clone(),\n                "Future B",\n            ),\n        };'''
          new = '''        let (archive, lineage, display_title, label, side_label) = match side {\n            FutureSide::Left => (\n                self.left_archive\n                    .clone()\n                    .ok_or_else(|| "Future A has no durable archive".to_string())?,\n                self.left_lineage.clone(),\n                self.left_display_title.clone(),\n                self.left_label.clone(),\n                "Future A",\n            ),\n            FutureSide::Right => (\n                self.right_archive\n                    .clone()\n                    .ok_or_else(|| "Future B has no durable archive".to_string())?,\n                self.right_lineage.clone(),\n                self.right_display_title.clone(),\n                self.right_label.clone(),\n                "Future B",\n            ),\n        };'''
          assert old in text, 'save_future tuple changed unexpectedly'
          text = text.replace(old, new, 1)

          old = '''        let future = WorldDocument::new(archive).with_lineage(lineage);'''
          new = '''        let future = strategy_future_document(archive, lineage, display_title);'''
          assert old in text, 'saved Future document construction changed unexpectedly'
          text = text.replace(old, new, 1)

          marker = '''fn strategy_lineage(\n    source_label: &str,'''
          helper = '''fn strategy_future_display_title(title: &str) -> Option<String> {\n    let title = title.trim();\n    (!title.is_empty()).then(|| title.to_owned())\n}\n\nfn strategy_future_document(\n    archive: WorldArchive,\n    lineage: WorldLineage,\n    display_title: Option<String>,\n) -> WorldDocument {\n    let document = WorldDocument::new(archive).with_lineage(lineage);\n    match display_title {\n        Some(title) => document.with_display_title(title),\n        None => document,\n    }\n}\n\nfn strategy_lineage(\n    source_label: &str,'''
          assert marker in text, 'strategy_lineage marker changed unexpectedly'
          text = text.replace(marker, helper, 1)

          test_marker = '''    #[test]\n    fn strategy_lineage_records_the_parent_branch_point_before_the_future_runs() {'''
          tests = '''    #[test]\n    fn saved_strategy_future_preserves_semantic_snapshot_title() {\n        let archive = WorldArchive {\n            format: WORLD_ARCHIVE_FORMAT.into(),\n            format_version: WORLD_ARCHIVE_VERSION,\n            pack: WorldPackRef::new("world-machine.strategy-title-mock", "1"),\n            world_time: 7,\n            events: Vec::new(),\n            pending: Vec::new(),\n        };\n        let lineage = strategy_lineage(\n            "Source.world",\n            &archive,\n            &StrategyChoice {\n                id: "mock.choose-a".into(),\n                title: "Choose A".into(),\n                detail: "A future".into(),\n            },\n            20,\n        );\n\n        let title = strategy_future_display_title("  Ares Pocket Colony  ");\n        let document = strategy_future_document(archive, lineage, title);\n\n        assert_eq!(\n            document.metadata.display_title.as_deref(),\n            Some("Ares Pocket Colony")\n        );\n        assert!(document.metadata.lineage.is_some());\n    }\n\n    #[test]\n    fn saved_strategy_future_leaves_blank_snapshot_title_unset() {\n        assert_eq!(strategy_future_display_title("   "), None);\n    }\n\n    #[test]\n    fn strategy_lineage_records_the_parent_branch_point_before_the_future_runs() {'''
          assert test_marker in text, 'strategy tests marker changed unexpectedly'
          text = text.replace(test_marker, tests, 1)

          path.write_text(text)
          PY
          cargo fmt --all
          cargo test -p world-machine-desktop
          git diff --check
      - name: Commit semantic Future titles and remove helper
        if: success()
        shell: bash
        run: |
          rm .github/workflows/m96-apply-strategy-future-semantic-titles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/world-machine-desktop/src/strategy_compare.rs \
                  .github/workflows/m96-apply-strategy-future-semantic-titles.yml
          git commit -m "M96: preserve semantic titles for saved strategy Futures"
          git push origin HEAD:m96-strategy-future-semantic-titles
