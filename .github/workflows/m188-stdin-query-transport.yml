name: M188 stdin query transport
on:
  push:
    branches:
      - agent/m188-stdin-query-transport
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m188-stdin-query-transport
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: semantic
      - name: Apply stdin-safe query transport
        run: |
          python3 .github/scripts/m188_stdin_query_transport.py
          cargo fmt --all
          cargo test -p world-cli
          cargo clippy -p world-cli --all-targets -- -D warnings
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/world-cli/src/main.rs crates/world-cli/tests/machine_query_transport.rs
          if git diff --cached --quiet; then
            echo "No patch produced" >&2
            exit 1
          fi
          git commit -m "M188: accept machine query JSON from stdin"
          git push origin HEAD:agent/m188-stdin-query-transport
