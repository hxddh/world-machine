name: M69 Resolved Steering Verify

on:
  push:
    branches: [m69-pocket-universe-social-arcs]
    paths:
      - '.github/workflows/m69-resolved-steering.yml'
      - 'scripts/m69_resolved_steering_fix.py'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m69-pocket-universe-social-arcs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python scripts/m69_resolved_steering_fix.py
      - run: cargo fmt --all
      - run: cargo test -p pocket-universe
      - run: cargo test -p pocket-universe-pack
      - run: cargo clippy -p pocket-universe -p pocket-universe-pack --all-targets -- -D warnings
      - run: bash ./scripts/check-boundaries.sh
      - name: Commit resolved steering hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worlds/pocket-universe apps/pocket-universe-pack Cargo.lock
          git commit -m 'M69: close steering after social arc resolution'
          git push origin HEAD:m69-pocket-universe-social-arcs
