name: M101 finalize semantic World filenames

on:
  push:
    branches:
      - m101-semantic-world-filenames
    paths:
      - '.github/workflows/m101-finalize-export-path.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m101-semantic-world-filenames
      - uses: dtolnay/rust-toolchain@stable
      - name: Canonicalize Export destination extension
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/world-machine-desktop/src/main.rs')
          text = path.read_text()
          old = '                Ok(Ok(Some(path))) => path,\n'
          matches = text.count(old)
          assert matches >= 1, f'expected Export path arm, found {matches}'
          export_start = text.index('    fn export_document(&mut self, document_id: WorldDocumentId, cx: &mut Context<Self>) {')
          export_end = text.index('\n    fn document_title_for_id', export_start)
          block = text[export_start:export_end]
          assert block.count(old) == 1, 'expected one Export destination arm'
          block = block.replace(old, '                Ok(Ok(Some(path))) => canonical_world_path(path),\n', 1)
          text = text[:export_start] + block + text[export_end:]
          path.write_text(text)
          PY
          cargo fmt --all
          cargo test -p world-machine-desktop
          git diff --check
      - name: Commit final source and remove helper
        if: success()
        shell: bash
        run: |
          rm .github/workflows/m101-finalize-export-path.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/world-machine-desktop/src/main.rs \
                  .github/workflows/m101-finalize-export-path.yml
          git commit -m "M101: keep exported Worlds on the .world extension"
          git push origin HEAD:m101-semantic-world-filenames
