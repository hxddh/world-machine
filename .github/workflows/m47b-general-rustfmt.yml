name: M47B General Rustfmt

on:
  push:
    branches:
      - m47b-general-saved-compare
    paths:
      - .github/workflows/m47b-general-rustfmt.yml

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m47b-general-saved-compare
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "M47B: apply rustfmt"
          git push origin HEAD:m47b-general-saved-compare
