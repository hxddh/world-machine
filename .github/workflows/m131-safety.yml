name: M131 Safety

on:
  push:
    branches:
      - agent/m131-recorded-causal-explanation
    paths:
      - scripts/m131-safety-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m131-recorded-causal-explanation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply M131 safety patch
        run: python3 scripts/m131_safety_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Test world projection
        run: cargo test -p world-projection
      - name: Test Pocket Universe
        run: cargo test -p pocket-universe
      - name: Test world GPUI
        run: cargo test -p world-gpui
      - name: Test Pocket Universe pack
        run: cargo test -p pocket-universe-pack
      - name: Check diff
        run: git diff --check
      - name: Commit product changes
        run: |
          git config user.name hxddh
          git config user.email hxddh@users.noreply.github.com
          git add crates/world-projection/src/influence.rs
          git diff --cached --check
          git commit -m "M131: keep structural effects event-local"
          git push origin HEAD:agent/m131-recorded-causal-explanation
