name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      gpui: ${{ steps.filter.outputs.gpui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gpui:
              - 'crates/world-gpui/**'
              - 'crates/world-strategy-gpui/**'
              - 'crates/world-lineage-gpui/**'
              - 'crates/world-pack-protocol/**'
              - 'crates/world-pack-bundle/**'
              - 'crates/world-pack-process/**'
              - 'crates/world-pack-catalog/**'
              - 'crates/world-pack-server/**'
              - 'crates/world-projection/**'
              - 'crates/world-compare/**'
              - 'crates/world-strategy/**'
              - 'crates/world-document/**'
              - 'crates/world-lineage/**'
              - 'crates/world-host/**'
              - 'crates/world-builtins/**'
              - 'crates/world-library/**'
              - 'apps/tiny-society-pack/**'
              - 'apps/pocket-universe-pack/**'
              - 'apps/tiny-society-desktop/**'
              - 'apps/future-archaeologist-desktop/**'
              - 'apps/world-machine-desktop/**'
              - 'apps/strategy-comparison-desktop/**'
              - 'apps/lineage-explorer-desktop/**'
              - 'worlds/tiny-society/**'
              - 'worlds/future-archaeologist/**'
              - 'worlds/pocket-universe/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: semantic
      - run: bash ./scripts/check-boundaries.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude world-gpui --exclude world-strategy-gpui --exclude world-lineage-gpui --exclude tiny-society-desktop --exclude future-archaeologist-desktop --exclude world-machine-desktop --exclude strategy-comparison-desktop --exclude lineage-explorer-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude world-gpui --exclude world-strategy-gpui --exclude world-lineage-gpui --exclude tiny-society-desktop --exclude future-archaeologist-desktop --exclude world-machine-desktop --exclude strategy-comparison-desktop --exclude lineage-explorer-desktop

  gpui-macos:
    needs: changes
    if: needs.changes.outputs.gpui == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gpui-macos
      - run: cargo test -p world-library
      - run: cargo test -p tiny-society-pack
      - run: cargo test -p pocket-universe-pack
      - run: cargo check -p world-gpui
      - run: cargo check -p world-strategy-gpui
      - run: cargo check -p world-lineage-gpui
      - run: cargo test -p tiny-society-desktop
      - run: cargo test -p future-archaeologist-desktop
      - run: cargo test -p world-machine-desktop
      - run: cargo test -p strategy-comparison-desktop
      - run: cargo test -p lineage-explorer-desktop
      - name: Build and validate World Machine.app
        run: bash apps/world-machine-desktop/macos/build-app.sh
      - name: Archive World Machine.app
        run: ditto -c -k --keepParent "target/bundle/World Machine.app" target/bundle/World-Machine-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: world-machine-macos-app
          path: target/bundle/World-Machine-macOS.zip
          if-no-files-found: error
          retention-days: 7
