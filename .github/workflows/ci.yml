name: CI

on:
  # One run per change: a pull request is checked by its pull_request run,
  # and main by its push run. (Pushes to every branch as well started each
  # PR's checks twice. The screenshot job's screenshots/** branches, which
  # carry no source, are not main and start nothing.)
  push:
    branches:
      - main
  pull_request:
  # A branch with no pull request yet: `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

# A newer push to the same pull request cancels the run it supersedes. On
# main every commit is checked to the end.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; a job that needs more says so itself.
permissions:
  contents: read

# Tests too slow for every pull request: they run every night instead, in
# release with the rest of the workspace (nightly.yml, long-bars, which
# skips none of them). Each takes from half a minute to seven in a debug
# build on CI's runner, and the slowest alone held the test job past 25
# minutes. They are skipped here by name, as libtest filters.
#
#   golden::no_night_glow_has_a_straight_hard_edge          world-gpui: the tile painter's
#   golden::no_shadow_has_a_straight_hard_edge              night-glow, shadow, dusk and
#   golden::dusk_is_gold                                    night-sky picture bars, each
#   golden::at_night_nothing_over_the_scene_is_brighter_than_its_sky   drawn many times over
env:
  SLOW: >-
    --skip golden::no_night_glow_has_a_straight_hard_edge
    --skip golden::no_shadow_has_a_straight_hard_edge
    --skip golden::dusk_is_gold
    --skip golden::at_night_nothing_over_the_scene_is_brighter_than_its_sky

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # paths-filter lists a pull request's files through the API.
      pull-requests: read
    outputs:
      gpui: ${{ steps.filter.outputs.gpui }}
      window: ${{ steps.filter.outputs.window }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # The app depends on every crate in the workspace (the kernel,
          # every System, both Worlds and their Packs), so a change to any
          # of them is a change to the app. The window is what the release
          # shots play: its drawing, the desktop app, and the harness.
          filters: |
            gpui:
              - 'crates/**'
              - 'systems/**'
              - 'worlds/**'
              - 'apps/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            window:
              - 'crates/world-gpui/**'
              - 'crates/world-theme/**'
              - 'crates/world-art/**'
              - 'crates/world-sound/**'
              - 'apps/world-machine-desktop/**'
              - 'scripts/release-shots*.sh'
              - '.github/workflows/release-shots.yml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'

  # The checks that read the tree, the format and the lints: everything
  # but the tests, beside them rather than before them.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint
      - run: bash ./scripts/check-boundaries.sh
      - name: Check included World Packs agree about their identity
        run: python3 ./scripts/check-included-packs.py
      - name: Check the desktop apps render text
        run: python3 ./scripts/check-desktop-fonts.py
      - name: Check the workflow files
        run: python3 ./scripts/check-workflows.py
      - name: Check the app icon
        run: python3 ./scripts/check-app-icon.py
      - name: Check no Rust file grows past its recorded size
        run: python3 ./scripts/check-file-sizes.py
      - run: cargo fmt --all -- --check
      # world-gpui builds and tests on Linux: its golden pictures are drawn
      # by a CPU rasteriser. Only the desktop app is macOS-gated, and it is
      # linted here too, as the AGENTS.md guardrail runs it: whatever is
      # macOS-only in it must be gated so, not left as dead code elsewhere.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # The workspace's tests, in five shards run side by side (balanced by
  # what each took in a debug build: the window's tests, each World, the
  # library's three years with the builtins' languages, and the rest). The last
  # shard is the whole workspace less the others, so a new crate is tested
  # without anyone adding it here (check-workflows.py holds that every
  # crate the last shard leaves out is tested by another).
  test:
    name: test (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: window
            packages: -p world-gpui
            save: false
          - name: Pocket Universe
            packages: -p pocket-universe
            save: false
          - name: Tiny Society
            packages: -p tiny-society
            save: false
          - name: library and builtins
            packages: -p world-library -p world-builtins
            save: false
          - name: the rest
            packages: >-
              --workspace --exclude world-machine-desktop
              --exclude world-gpui --exclude pocket-universe --exclude tiny-society
              --exclude world-library --exclude world-builtins
            save: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      # One cache for every shard, saved by the one that builds nearly
      # every crate (the rest builds the World crates and, through the
      # living-stage bench, the window's), so shards do not race to save.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: semantic
          save-if: ${{ matrix.shard.save }}
      - name: Test
        env:
          PACKAGES: ${{ matrix.shard.packages }}
        # PACKAGES and SLOW are lists of flags, split on purpose.
        run: |
          # shellcheck disable=SC2086
          cargo test --locked $PACKAGES -- $SLOW
      - name: Verify external Pack conformance command
        if: matrix.shard.name == 'the rest'
        run: |
          mkdir -p target/pack-check
          cargo run --locked -p tiny-society-pack -- --write-bundle target/pack-check/tiny-society.worldpack
          cargo run --locked -p world-pack-catalog --bin world-pack-check -- target/pack-check/tiny-society.worldpack

  # A quick release-shots check (docs/REVIEW_v0.30.md, P0) on changes to the
  # window: the release app in its real window under Xvfb, playing a new
  # World's first sitting to its Goodnight (the `first` scenario). A release
  # plays every scenario (release-package.yml).
  release-shots:
    needs: changes
    if: needs.changes.outputs.window == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release-shots.yml
    with:
      scenarios: first

  # What the app may be built from (deny.toml): permissive licences only,
  # no crate with a known vulnerability or yanked, no wildcard versions,
  # and sources limited to crates.io and the window toolkit's pinned
  # repositories.
  deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --locked

  # The app on Windows: compiled, linted and tested there, not only
  # checked. The whole workspace compiles (the desktop app's window
  # included, `cfg(gui)`, apps/world-machine-desktop/build.rs); the crates
  # whose code differs on Windows are linted with every warning an error
  # and tested: the Pack processes (world-pack-process, whose tests run a
  # scripted stand-in Pack, src/bin/world-pack-fixture.rs, instead of the
  # `/bin/sh` scripts they once needed), the World lock (world-library),
  # the language from the OS (world-i18n), Pack bundles (the catalog is
  # linted; its process tests are still unix scripts), a real Pack process end to end (tiny-society-pack's external Pack
  # test), and the desktop app itself (Credential Manager, the platform
  # folders, crash logs). The Steam spike is checked with its feature on;
  # it needs no Steam client to compile.
  windows:
    needs: changes
    if: needs.changes.outputs.gpui == 'true'
    runs-on: windows-2025
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows
      - run: cargo check --locked --workspace
      - name: Lint what differs on Windows
        run: >-
          cargo clippy --locked --all-targets
          -p world-pack-process -p world-library -p world-i18n
          -p world-pack-bundle -p world-pack-catalog -p world-machine-desktop
          -- -D warnings
      - run: cargo clippy --locked -p world-machine-desktop --features demo --all-targets -- -D warnings
      - run: cargo clippy --locked -p world-machine-desktop --features channel-store -- -D warnings
      - name: Check the Steam spike
        run: cargo clippy --locked -p world-machine-desktop --features steam -- -D warnings
      - name: Test what differs on Windows
        run: >-
          cargo test --locked
          -p world-pack-process -p world-library -p world-i18n
          -p world-pack-bundle
      - name: Test a real Pack process end to end
        run: cargo test --locked -p tiny-society-pack --test external_pack
      - name: Test the desktop app
        run: cargo test --locked -p world-machine-desktop

  gpui-macos:
    needs: changes
    if: needs.changes.outputs.gpui == 'true'
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: gpui-macos
      - run: cargo test --locked -p world-library
      - run: cargo test --locked -p tiny-society-pack
      - run: cargo test --locked -p pocket-universe-pack
      - run: cargo clippy --locked -p world-gpui -p world-machine-desktop --all-targets -- -D warnings
      - run: cargo test --locked -p world-machine-desktop
      - run: cargo clippy --locked -p world-machine-desktop --features demo --all-targets -- -D warnings
      - name: Build and validate World Machine.app
        run: bash apps/world-machine-desktop/macos/build-app.sh
      - name: Archive World Machine.app
        run: ditto -c -k --keepParent "target/bundle/World Machine.app" target/bundle/World-Machine-macOS.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: world-machine-macos-app
          path: target/bundle/World-Machine-macOS.zip
          if-no-files-found: error
          retention-days: 7

  # The v0.30 S0 spike's interim reading on real Metal (a virtual GPU):
  # the living stage, a whole place baked once into sprites and composited
  # by GPUI every frame with 300 people walking, timed per frame
  # (apps/living-stage-bench). It reports and never gates: a failure or a
  # slow frame here does not fail CI, and it runs beside gpui-macos rather
  # than inside it, so that job is no slower. The go/no-go is judged on a
  # real Mac (docs/REVIEW_v0.29.md, S0); this only says what CI's runner
  # managed.
  living-stage-macos:
    needs: changes
    if: needs.changes.outputs.gpui == 'true'
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: living-stage-macos
      - run: cargo build --locked --release -p living-stage-bench
      - name: Run the living stage for 20 seconds
        run: |
          set -o pipefail
          cargo run --locked --release -p living-stage-bench -- --seconds 20 --walkers 300 | tee living-stage.txt
          {
            echo '### Living stage (S0 spike) on the macOS runner'
            echo
            echo '```'
            cat living-stage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The living stage as the World window draws it (v0.30 S1a): looks
      # baked lazily as the camera pans and zooms, residents from their
      # routines, at the runner's display scale and baked for a Retina
      # display (scale 2) on it: frame plan and pixel memory, the S1b bar
      # for 120 Hz (plan p99 at most 4 ms, no interval over 33 ms once the
      # place shows) and what the looks baked again took from before.
      - name: Run the World window's living stage at display scale 1 and 2
        run: |
          set -o pipefail
          for scale in 1 2; do
            cargo run --locked --release -p living-stage-bench -- --window --scale "$scale" --seconds 40 | tee "living-stage-window-$scale.txt"
          done
          {
            echo '### Living stage in the World window (S1a, S1b): frame plan, the 120 Hz bar and pixel memory'
            echo
            echo '```'
            cat living-stage-window-1.txt living-stage-window-2.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
