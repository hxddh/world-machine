name: M144 Fix

on:
  push:
    branches:
      - agent/m144-event-entity-navigation

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[m144-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m144-event-entity-navigation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Refine M144 copy and fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/world-gpui/src/macos.rs')
          s = p.read_text()
          old = '.child("Entities whose recorded history names this visible event as a direct StateChange. Select one to inspect its current state and recorded history."),'
          new = '.child("Entities with a direct recorded StateChange from this visible event. Select one to inspect its current state and recorded history."),'
          assert old in s
          s = s.replace(old, new, 1)
          old = '.unwrap_or_else(|| (selection.stable_key(), "Entity".into()));'
          new = '.unwrap_or_else(|| ("Entity".into(), "Recorded entity".into()));'
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          cargo fmt --all
      - name: Commit M144 refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/world-gpui/src/macos.rs
          git commit -m "M144: refine direct entity effect navigation [m144-fix]"
          git push origin HEAD:agent/m144-event-entity-navigation
