              '  assert.ok(activeTools.includes("world_first_divergence"));\n',
              f'  assert.ok(activeTools.includes("world_first_divergence"));\n  assert.ok(commands.has("{READY}"), "packaged extension did not expose readiness marker");\n',
              "packaged smoke readiness assertion",
          )
          loop_anchor = '''    const request = JSON.parse(line);
    assert.equal(request.type, "prompt");
'''
          loop_replacement = '''    const request = JSON.parse(line);
    if (request.type === "get_state") {
