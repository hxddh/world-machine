              '    assert.equal(responses.length, 3, stdout);\n    assert.equal(responses[0].type, "ready");\n    assert.equal(responses[0].id, "smoke-probe");\n    assertTurn(responses[1], 1);\n    assertTurn(responses[2], 2);\n',
              "packaged smoke ready response",
