              '''    registerTool(tool) {
      assert.equal(typeof tool?.name, "string");
      tools.set(tool.name, tool);
    },
''',
              '''    registerTool(tool) {
      assert.equal(typeof tool?.name, "string");
      tools.set(tool.name, tool);
