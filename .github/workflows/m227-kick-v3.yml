name: M227 hardening payload

on:
  workflow_dispatch:

jobs:
  payload:
    runs-on: ubuntu-24.04
    steps:
      - name: Payload blocks
        run: |
          python3 - <<'PY'
          pass
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re

          READY = "world-machine-analyst-ready"

          def replace_once(text, old, new, label):
              if old not in text:
                  if new in text:
                      return text
                  raise SystemExit(f"missing hardening marker: {label}")
              return text.replace(old, new, 1)

          def replace_between(text, start, end, new, label):
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f"missing hardening start: {label}")
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f"missing hardening end: {label}")
              return text[:a] + new + text[b:]

          def patch_range(path, start_marker, end_marker, anchor, insertion, label):
              p = Path(path)
              text = p.read_text()
              a = text.find(start_marker)
              b = text.find(end_marker, a + 1) if a >= 0 else -1
              if a < 0 or b < 0:
                  raise SystemExit(f"could not locate {label} range")
              part = text[a:b]
              if READY not in part:
                  at = part.find(anchor)
                  if at < 0:
                      raise SystemExit(f"could not locate {label} anchor")
                  part = part[:at] + insertion + part[at:]
                  text = text[:a] + part + text[b:]
                  p.write_text(text)

          # Rust client: move process-level probe to AnalystTurnProcess.
          p = Path("crates/world-analyst-client/src/lib.rs")
          text = p.read_text()
          wrong_probe = '''    pub fn probe(
        &mut self,
        timeout_ms: Option<u64>,
    ) -> Result<(), AnalystTurnClientError> {
        let Some(client) = self.client.as_mut() else {
            return Err(AnalystTurnClientError::Poisoned);
        };
        let result = client.probe(timeout_ms);
        if client.is_poisoned() {
            self.client.take();
            terminate_child(&mut self.child);
        }
        result
    }

'''
          if text.count(wrong_probe) != 1:
              raise SystemExit(f"expected one misplaced process probe, got {text.count(wrong_probe)}")
          text = text.replace(wrong_probe, "", 1)
          process_probe = wrong_probe
          process_marker = '''    pub fn id(&self) -> u32 {
        self.child.id()
    }

    pub fn ask(
'''
          text = replace_once(
              text,
              process_marker,
              process_marker.replace("    pub fn ask(\n", process_probe + "    pub fn ask(\n"),
              "AnalystTurnProcess probe",
          )
          process_probe_test = '''    #[cfg(unix)]
    #[test]
    fn process_returns_poisoned_after_fatal_probe_teardown() {
        let mut child = Command::new("sh")
            .arg("-c")
            .arg("exit 0")
            .stdin(Stdio::piped())
            .stdout(Stdio::piped())
            .spawn()
            .unwrap();
        let stdin = child.stdin.take().unwrap();
        let stdout = child.stdout.take().unwrap();
        let mut process = AnalystTurnProcess {
            child,
            client: Some(AnalystTurnClient::new(
                BufReader::new(stdout),
                BufWriter::new(stdin),
            )),
        };

        let first = process.probe(Some(1000)).unwrap_err();
        assert!(first.is_session_fatal());
        assert!(matches!(
            process.probe(Some(1000)).unwrap_err(),
            AnalystTurnClientError::Poisoned
        ));
    }

'''
          text = replace_once(
              text,
              "    #[cfg(unix)]\n    #[test]\n    fn process_returns_poisoned_after_fatal_teardown() {",
              process_probe_test + "    #[cfg(unix)]\n    #[test]\n    fn process_returns_poisoned_after_fatal_teardown() {",
              "process fatal probe regression",
          )
          p.write_text(text)

          # Desktop fake processes get a default successful startup probe.
          p = Path("apps/world-machine-desktop/src/analyst_session.rs")
          text = p.read_text()
          pattern = re.compile(r"Ok\(FakeProcess \{\n(?P<body>.*?\n)(?P<indent>\s*)\}\)", re.S)
          def fix_fake(match):
              body = match.group("body")
              if "probe_error:" in body:
                  return match.group(0)
              indent = match.group("indent")
              return "Ok(FakeProcess {\n" + body + indent + "    probe_error: None,\n" + indent + "})"
          text, count = pattern.subn(fix_fake, text)
          if count == 0:
              raise SystemExit("no FakeProcess constructors found")
          p.write_text(text)

          # Extension readiness marker is registered only after catalog load + active tool setup.
          p = Path("integrations/pi/world-machine-analyst.mjs")
          text = p.read_text()
          text = replace_once(
              text,
              'const RIGHT_ENV = "WORLD_MACHINE_RIGHT_ARCHIVE";\n',
              f'const RIGHT_ENV = "WORLD_MACHINE_RIGHT_ARCHIVE";\nconst READY_COMMAND = "{READY}";\n',
              "extension readiness constant",
          )
          text = replace_once(
              text,
              "  const registeredHostTools = new Map();\n",
              "  const registeredHostTools = new Map();\n  let readinessCommandRegistered = false;\n",
              "extension readiness state",
          )
          text = replace_once(
              text,
              "      pi.setActiveTools(activeToolNames);\n",
              '''      pi.setActiveTools(activeToolNames);
      if (!readinessCommandRegistered) {
        pi.registerCommand(READY_COMMAND, {
          description: "Internal World Machine analyst readiness marker.",
          async handler() {},
        });
        readinessCommandRegistered = true;
      }
''',
              "extension readiness registration",
          )
          p.write_text(text)

          # Pi RPC probe validates process state and the post-catalog extension marker.
          p = Path("integrations/pi/world-machine-analyst-rpc.mjs")
          text = p.read_text()
          text = replace_once(
              text,
              "const DEFAULT_PROMPT_TIMEOUT_MS = 120000;\n",
              f'const DEFAULT_PROMPT_TIMEOUT_MS = 120000;\nconst ANALYST_READY_COMMAND = "{READY}";\n',
              "rpc readiness constant",
          )
          hardened_probe = '''  async probe({ signal, timeoutMs = DEFAULT_PROBE_TIMEOUT_MS } = {}) {
    if (this.busy) {
      throw new PiAnalystRpcProtocolError("Pi analyst RPC session is single-flight");
    }
    if (this.closed || this.closedError) {
      throw this.closedError ?? new PiAnalystRpcTransportError("Pi analyst RPC session is closed");
    }
    if (!Number.isSafeInteger(timeoutMs) || timeoutMs <= 0) {
      throw new PiAnalystRpcProtocolError(
        "Pi analyst probe timeout must be a positive safe integer",
      );
    }
    if (signal?.aborted) {
      const error = new PiAnalystRpcTransportError("Pi analyst probe aborted before dispatch");
      await this.#terminateAfterBrokenTurn(error);
      throw error;
    }

    const probeId = `world-analyst-probe-${this.nextProbeNumber++}`;
    const deadline = Date.now() + timeoutMs;
    this.busy = true;
    try {
      const state = await this.#probeCommand(
        { id: `${probeId}-state`, type: "get_state" },
        "get_state",
        signal,
        deadline,
        probeId,
      );
      if (!state.data || typeof state.data !== "object" || Array.isArray(state.data)) {
        throw new PiAnalystRpcProtocolError("Pi analyst get_state probe returned invalid state", {
          requestId: probeId,
          response: state,
        });
      }

      const commands = await this.#probeCommand(
        { id: `${probeId}-commands`, type: "get_commands" },
        "get_commands",
        signal,
        deadline,
        probeId,
      );
      const entries = commands.data?.commands;
      if (!Array.isArray(entries)) {
        throw new PiAnalystRpcProtocolError("Pi analyst get_commands probe returned invalid commands", {
          requestId: probeId,
          response: commands,
        });
      }
      const ready = entries.some(
        (command) =>
          command &&
          command.name === ANALYST_READY_COMMAND &&
          command.source === "extension",
      );
      if (!ready) {
        throw new PiAnalystRpcProtocolError(
          "Pi analyst extension did not expose the World Machine readiness marker",
          { requestId: probeId },
        );
      }
      return { requestId: probeId };
    } catch (error) {
      if (!(error instanceof PiAnalystRpcCommandError)) {
        await this.#terminateAfterBrokenTurn(error);
      }
      throw error;
    } finally {
      this.busy = false;
    }
  }

  async #probeCommand(request, expectedCommand, signal, deadline, requestId) {
    const remaining = deadline - Date.now();
    if (remaining <= 0) {
      throw new PiAnalystRpcTransportError("Pi analyst probe timed out", { requestId });
    }
    await this.#write(request);
    const response = await this.#nextRecordWithInterruption(
      signal,
      remaining,
      requestId,
      "probe",
    );
    if (!response || response.type !== "response") {
      throw new PiAnalystRpcProtocolError(
        `Pi analyst probe received an event before ${expectedCommand} response`,
        { requestId, response },
      );
    }
    if (response.id !== request.id || response.command !== expectedCommand) {
      throw new PiAnalystRpcProtocolError("Pi analyst probe correlation mismatch", {
        expectedId: request.id,
        actualId: response.id,
        expectedCommand,
        command: response.command,
      });
    }
    if (response.success !== true) {
      throw new PiAnalystRpcCommandError(`Pi analyst ${expectedCommand} probe was rejected`, {
        requestId,
        response,
      });
    }
    return response;
  }

'''
          text = replace_between(
              text,
              "  async probe({ signal, timeoutMs = DEFAULT_PROBE_TIMEOUT_MS } = {}) {",
              "  async prompt(message, { signal, timeoutMs = DEFAULT_PROMPT_TIMEOUT_MS } = {}) {",
