'''
          text = replace_once(text, loop_anchor, loop_replacement, "packaged smoke RPC readiness")
          p.write_text(text)

          # Pin the readiness mechanism in source-level integration checks.
          p = Path("scripts/check-pi-analyst.sh")
          text = p.read_text()
          text = replace_once(
