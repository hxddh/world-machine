              '''    registerTool(tool) {
      registered.push(tool);
    },
''',
              '''    registerTool(tool) {
      registered.push(tool);
    },
    registerCommand(name, command) {
      registeredCommands.push({ name, command });
    },
''',
              "extension test registerCommand",
          )
