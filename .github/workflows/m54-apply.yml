name: M54 Apply Catalog

on:
  push:
    branches:
      - m54-installed-pack-catalog

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m54-installed-pack-catalog
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - run: python scripts/m54_process_patch.py
      - run: python scripts/m54_catalog_patch.py
      - run: cargo fmt --all
      - run: cargo test -p world-pack-process -p world-pack-catalog
      - run: cargo clippy -p world-pack-process -p world-pack-catalog --all-targets -- -D warnings
      - run: bash ./scripts/check-boundaries.sh
      - name: Commit final M54 sources
        run: |
          rm -f scripts/m54_process_patch.py scripts/m54_catalog_patch.py .github/workflows/m54-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "M54: implement installed Pack catalog and content pins" || exit 0
          git push origin HEAD:m54-installed-pack-catalog
