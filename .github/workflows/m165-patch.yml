name: M165 patch

on:
  push:
    branches:
      - agent/m165-entity-relation-adjacency

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m165-entity-relation-adjacency
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply typed Entity Relation adjacency
        run: |
          python3 .github/scripts/m165_patch.py
          cargo fmt --all
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/world-projection/src/lib.rs crates/world-projection/tests/entity_relation_adjacency.rs
          git commit -m "M165: expose typed Entity Relation adjacency"
          git push origin HEAD:agent/m165-entity-relation-adjacency
