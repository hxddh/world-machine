name: M143 Fix

on:
  push:
    branches:
      - agent/m143-event-entity-effects

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[m143-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m143-event-entity-effects
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Anchor reverse effects to visible timeline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/world-projection/src/lib.rs')
          s = p.read_text()
          old = "    pub fn directly_changed_entities(&self, event: EventId) -> Vec<EntityId> {\n        let event_key = SelectionId::Event(event).stable_key();"
          new = "\n".join([
              "    pub fn directly_changed_entities(&self, event: EventId) -> Vec<EntityId> {",
              "        let event_selection = SelectionId::Event(event);",
              "        if !self",
              "            .timeline",
              "            .items",
              "            .iter()",
              "            .any(|item| item.id == event_selection)",
              "        {",
              "            return Vec::new();",
              "        }",
              "        let event_key = event_selection.stable_key();",
          ])
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          cargo fmt --all
      - name: Commit M143 visibility guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/world-projection/src/lib.rs crates/world-projection/tests/event_entity_effects.rs
          git commit -m "M143: anchor reverse effects to visible events [m143-fix]"
          git push origin HEAD:agent/m143-event-entity-effects
