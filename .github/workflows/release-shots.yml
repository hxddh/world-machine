name: Release shots

# The first ten minutes and the key moments of the release app, in its real
# window: `scripts/release-shots.sh` builds the desktop app in release, runs
# it under Xvfb at the World window's default size, plays a new World's
# first sitting to its Goodnight, a Find, a new sitting's morning after
# time away, every zoom level, a second year and each place at noon, dusk
# and night, and saves what the window showed. It fails if a key moment
# shows an unpainted frame, if the loading wash a window opens under lasts
# more than 2 seconds (3 for a new World), or if a sitting's morning or
# Goodnight is not what the game does. The pictures are kept as an
# artifact of the run, for the art director's sign-off and the store page.
#
# It runs for every release as a job of the release package workflow
# (release-package.yml calls it, and publishes nothing unless it passes),
# and by hand:
#   gh workflow run release-shots.yml --ref main
# It has no tag trigger of its own: a tag the release workflow creates starts
# no other workflow, and a pushed tag already runs it through the release.
#
# Linux is not a Mac: fonts and window chrome differ, and the renderer is a
# software one. What it proves is that every picture the player is shown is
# a painted one, in the release build, in the real window.

# CI (ci.yml) also calls it on every pull request that touches the window,
# with only the `first` scenario: the first ten minutes of a new World, a
# quick check that fits CI's budget. A release always plays every scenario.
on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Scenarios to play (scripts/release-shots.sh); empty plays all of them.
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      scenarios:
        description: Scenarios to play (scripts/release-shots.sh); empty plays all of them.
        required: false
        type: string
        default: ''

permissions:
  contents: read

# Called by the release (or CI), `github.workflow` is the caller's name, so
# a run by hand on the same ref never cancels the one a release waits for.
# A pull request's newer push cancels its older check; on main and for a
# release each commit plays to the end.
concurrency:
  group: release-shots-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  linux-release-shots:
    name: The first ten minutes in the real window (release, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Make room for a release build of the app
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-shots
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
      # The window's Linux build (GPUI on X11 with a software Vulkan
      # renderer, cpal on ALSA), the harness's tools, and fonts for every
      # language the app shows.
      - name: Install the window's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xdotool x11-utils x11-apps imagemagick \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libx11-xcb-dev libvulkan-dev mesa-vulkan-drivers \
            libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev \
            fonts-dejavu-core fonts-noto-cjk
      - name: Play the first ten minutes and the key moments
        env:
          SCENARIOS: ${{ inputs.scenarios }}
        # SCENARIOS is a list of names, split on purpose.
        run: |
          # shellcheck disable=SC2086
          bash scripts/release-shots.sh "$RUNNER_TEMP/shots" $SCENARIOS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-shots${{ inputs.scenarios && '-quick' || '' }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: error
          retention-days: 30
