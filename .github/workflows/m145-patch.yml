name: M145 Patch

on:
  push:
    branches:
      - agent/m145-comparison-event-entity-navigation

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[m145-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m145-comparison-event-entity-navigation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply M145 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/world-strategy-gpui/src/lib.rs')
          s = p.read_text()

          old = "const ENTITY_HISTORY_LIMIT: usize = 6;"
          new = "const ENTITY_HISTORY_LIMIT: usize = 6;\nconst EVENT_ENTITY_EFFECT_LIMIT: usize = 6;"
          assert old in s
          s = s.replace(old, new, 1)

          old = "        if let SelectionId::Event(event) = selected.selection {\n            let mut causes = div().flex().flex_col().gap_2();"
          new = "\n".join([
              "        if let SelectionId::Event(event) = selected.selection {",
              "            let changed_entities = snapshot.directly_changed_entities(event);",
              "            if !changed_entities.is_empty() {",
              "                let mut entities = div().flex().flex_col().gap_2();",
              "                for entity in changed_entities.iter().take(EVENT_ENTITY_EFFECT_LIMIT) {",
              "                    entities = entities.child(self.render_event_entity_effect(",
              "                        selected.side,",
              "                        SelectionId::Entity(*entity),",
              "                        cx,",
              "                    ));",
              "                }",
              "                if let Some(notice) = hidden_notice(",
              "                    changed_entities.len(),",
              "                    EVENT_ENTITY_EFFECT_LIMIT,",
              "                    \"directly changed entities\",",
              "                ) {",
              "                    entities = entities.child(truncation_notice(notice));",
              "                }",
              "                panel = panel",
              "                    .child(div().text_sm().child(\"Entities changed by this event\"))",
              "                    .child(",
              "                        div()",
              "                            .text_xs()",
              "                            .text_color(rgb(0x66705f))",
              "                            .child(\"Entities with a direct recorded StateChange from this visible event. Select one to inspect its state and recorded history on this same future.\"),",
              "                    )",
              "                    .child(entities);",
              "            }",
              "",
              "            let mut causes = div().flex().flex_col().gap_2();",
          ])
          assert old in s
          s = s.replace(old, new, 1)

          marker = "    fn render_entity_history_event("
          helper = "\n".join([
              "    fn render_event_entity_effect(",
              "        &self,",
              "        side: ComparisonSide,",
              "        selection: SelectionId,",
              "        cx: &mut Context<Self>,",
              "    ) -> impl IntoElement {",
              "        let (title, subtitle) = self",
              "            .snapshot(side)",
              "            .and_then(|snapshot| snapshot.inspector(selection))",
              "            .map(|inspector| (inspector.title.clone(), inspector.subtitle.clone()))",
              "            .unwrap_or_else(|| (\"Entity\".into(), \"Recorded entity\".into()));",
              "        let selected = self.is_selected(side, selection);",
              "        div()",
              "            .id(SharedString::from(format!(",
              "                \"event-entity-effect-{}-{}\",",
              "                side.key(),",
              "                selection.stable_key()",
              "            )))",
              "            .p_2()",
              "            .rounded_md()",
              "            .border_1()",
              "            .border_color(if selected {",
              "                rgb(0x4e6fb3)",
              "            } else {",
              "                rgb(0xe2e4e8)",
              "            })",
              "            .bg(rgb(0xffffff))",
              "            .cursor_pointer()",
              "            .flex()",
              "            .flex_col()",
              "            .gap_1()",
              "            .child(div().text_sm().child(title))",
              "            .child(div().text_xs().text_color(rgb(0x666666)).child(subtitle))",
              "            .on_click(cx.listener(move |this, _, _, cx| this.select(side, selection, cx)))",
              "    }",
              "",
          ])
          assert marker in s
          s = s.replace(marker, helper + marker, 1)

          p.write_text(s)
          PY
          cargo fmt --all
      - name: Commit M145
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/world-strategy-gpui/src/lib.rs
          git commit -m "M145: navigate comparison event entity effects [m145-patch]"
          git push origin HEAD:agent/m145-comparison-event-entity-navigation
