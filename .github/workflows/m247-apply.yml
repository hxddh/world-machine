name: M247 one-shot stable Setup identity

on:
  push:
    branches:
      - agent/m247-analyst-setup-selected-identity

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m247-analyst-setup-selected-identity
      - name: Apply M247 and self-delete
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/world-machine-desktop/src/analyst_panel.rs')
          text = path.read_text()

          def block(lines):
              return '\n'.join(lines) + '\n'

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          old = block([
              '            let mut card = div()',
              '                .id(SharedString::from(format!("analyst-{slug}-world-{id}")))',
              '                .p_2()',
              '                .rounded_md()',
              '                .border_1()',
              '                .flex()',
              '                .flex_col()',
              '                .gap_1()',
              '                .child(div().text_sm().child(title));',
              '            if let Some(document_id_label) = document_id_label {',
              '                card = card.child(',
              '                    div()',
              '                        .text_xs()',
              '                        .text_color(rgb(0x777770))',
              '                        .child(document_id_label),',
              '                );',
              '            }',
          ])
          new = block([
              '            let mut card = div()',
              '                .id(SharedString::from(format!("analyst-{slug}-world-{id}")))',
              '                .w_full()',
              '                .min_w(px(0.0))',
              '                .p_2()',
              '                .rounded_md()',
              '                .border_1()',
              '                .flex()',
              '                .flex_col()',
              '                .gap_1()',
              '                .child(',
              '                    div()',
              '                        .id(SharedString::from(format!(',
              '                            "analyst-{slug}-world-{id}-title"',
              '                        )))',
              '                        .w_full()',
              '                        .min_w(px(0.0))',
              '                        .overflow_x_scroll()',
              '                        .text_sm()',
              '                        .child(title),',
              '                );',
              '            if let Some(document_id_label) = document_id_label {',
              '                card = card.child(',
              '                    div()',
              '                        .id(SharedString::from(format!(',
              '                            "analyst-{slug}-world-{id}-stable-id"',
              '                        )))',
              '                        .w_full()',
              '                        .min_w(px(0.0))',
              '                        .overflow_x_scroll()',
              '                        .text_xs()',
              '                        .text_color(rgb(0x777770))',
              '                        .child(document_id_label),',
              '                );',
              '            }',
          ])
          text = replace_once(text, old, new, 'selector card identity containment')

          old = block([
              '            .child(',
              '                div()',
              '                    .text_sm()',
              '                    .child(format!("{label} · {}", self.label_for(selected))),',
              '            )',
              '            .child(worlds)',
          ])
          new = block([
              '            .child(',
              '                div()',
              '                    .id(SharedString::from(format!(',
              '                        "analyst-{slug}-selected-world-identity"',
              '                    )))',
              '                    .w_full()',
              '                    .min_w(px(0.0))',
              '                    .overflow_x_scroll()',
              '                    .text_sm()',
              '                    .child(format!(',
              '                        "{label} · {}",',
              '                        document_identity_label(selected, &self.documents)',
              '                    )),',
              '            )',
              '            .child(worlds)',
          ])
          text = replace_once(text, old, new, 'fixed selector identity heading')

          old = block([
              '    fn label_for(&self, id: &WorldDocumentId) -> String {',
              '        self.documents',
              '            .iter()',
              '            .find(|document| document.id == *id)',
              '            .map(document_title)',
              '            .unwrap_or_else(|| id.to_string())',
              '    }',
          ])
          text = replace_once(text, old, '', 'obsolete label_for helper')

          old = block([
              'fn pair_identity_header(',
              '    left: &WorldDocumentId,',
              '    right: &WorldDocumentId,',
              '    documents: &[WorldDocumentSummary],',
              ') -> String {',
              '    let label_for = |id: &WorldDocumentId| {',
              '        documents',
              '            .iter()',
              '            .find(|document| document.id == *id)',
              '            .map(|document| {',
              '                let title = document_title(document);',
              '                match document_id_label(document) {',
              '                    Some(id_label) => format!("{title} · {id_label}"),',
              '                    None => title,',
              '                }',
              '            })',
              '            .unwrap_or_else(|| id.to_string())',
              '    };',
              '    format!("{} ↔ {}", label_for(left), label_for(right))',
              '}',
          ])
          new = block([
              'fn document_identity_label(',
              '    id: &WorldDocumentId,',
              '    documents: &[WorldDocumentSummary],',
              ') -> String {',
              '    documents',
              '        .iter()',
              '        .find(|document| document.id == *id)',
              '        .map(|document| {',
              '            let title = document_title(document);',
              '            match document_id_label(document) {',
              '                Some(id_label) => format!("{title} · {id_label}"),',
              '                None => title,',
              '            }',
              '        })',
              '        .unwrap_or_else(|| id.to_string())',
              '}',
              '',
              'fn pair_identity_header(',
              '    left: &WorldDocumentId,',
              '    right: &WorldDocumentId,',
              '    documents: &[WorldDocumentSummary],',
              ') -> String {',
              '    format!(',
              '        "{} ↔ {}",',
              '        document_identity_label(left, documents),',
              '        document_identity_label(right, documents)',
              '    )',
              '}',
          ])
          text = replace_once(text, old, new, 'shared document identity helper')

          marker = block([
              '    #[test]',
              '    fn active_pair_identity_header_preserves_order_and_stable_ids() {',
          ])
          inserted = block([
              '    #[test]',
              '    fn selected_identity_label_preserves_exact_max_length_id_in_both_title_paths() {',
              '        let max_id = "x".repeat(128);',
              '        let titled = summary(&max_id, "tiny", Some("Maple Street"));',
              '        let titled_id = titled.id.clone();',
              '        assert_eq!(',
              '            document_identity_label(&titled_id, &[titled]),',
              '            format!("Maple Street · ID {max_id}")',
              '        );',
              '',
              '        let untitled = summary(&max_id, "tiny", None);',
              '        let untitled_id = untitled.id.clone();',
              '        assert_eq!(',
              '            document_identity_label(&untitled_id, &[untitled]),',
              '            max_id',
              '        );',
              '',
              '        let missing = WorldDocumentId::new("missing-world").unwrap();',
              '        assert_eq!(',
              '            document_identity_label(&missing, &[]),',
              '            "missing-world"',
              '        );',
              '    }',
              '',
              '    #[test]',
              '    fn active_pair_identity_header_preserves_order_and_stable_ids() {',
          ])
          text = replace_once(text, marker, inserted, 'max-length identity regression')

          path.write_text(text)
          PY
          cargo fmt --all
          git diff --check
          unexpected="$(git diff --name-only | grep -v '^apps/world-machine-desktop/src/analyst_panel.rs$' | grep -v '^.github/workflows/m247-apply.yml$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "unexpected changed files:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git rm .github/workflows/m247-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/world-machine-desktop/src/analyst_panel.rs
          git commit -m "M247: keep stable selected identity visible in Setup"
          git push origin HEAD:agent/m247-analyst-setup-selected-identity
