name: M66 Pocket Universe Multi-Agent Verify

on:
  push:
    branches: [m66-pocket-universe-multi-agent]
    paths:
      - '.github/workflows/m66-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m66-pocket-universe-multi-agent
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python scripts/m66_multi_agent.py
      - run: cargo fmt --all
      - run: cargo test -p pocket-universe
      - run: cargo test -p pocket-universe-pack
      - run: cargo clippy -p pocket-universe -p pocket-universe-pack --all-targets -- -D warnings
      - run: bash ./scripts/check-boundaries.sh
      - name: Commit verified multi-agent slice
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock worlds/pocket-universe apps/pocket-universe-pack
          git commit -m 'M66: chain two agents through each Pocket Universe period'
          git push origin HEAD:m66-pocket-universe-multi-agent
