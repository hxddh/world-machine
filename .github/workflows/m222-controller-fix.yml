# Temporary M222-only workflow; delete after controller fix lands.
name: M222 controller fix

on:
  push:
    branches:
      - agent/m222-desktop-analyst-session

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Tighten controller API and lock metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/world-machine-desktop/src/analyst_session.rs')
          text = path.read_text()

          replacements = {
              'pub(crate) enum DesktopAnalystState': 'pub enum DesktopAnalystState',
              'pub(crate) struct DesktopAnalystConfig': 'pub struct DesktopAnalystConfig',
              'pub(crate) enum DesktopAnalystSessionError': 'pub enum DesktopAnalystSessionError',
              'pub(crate) trait AnalystSessionProcess': 'pub trait AnalystSessionProcess',
              'pub(crate) struct DesktopAnalystSession': 'pub struct DesktopAnalystSession',
              'pub(crate) fn new(turn_host_script: impl Into<PathBuf>)': 'pub fn new(turn_host_script: impl Into<PathBuf>)',
              'pub(crate) fn start(\n': 'pub fn start(\n',
              'pub(crate) fn left(&self)': 'pub fn left(&self)',
              'pub(crate) fn right(&self)': 'pub fn right(&self)',
              'pub(crate) fn left_path(&self)': 'pub fn left_path(&self)',
              'pub(crate) fn right_path(&self)': 'pub fn right_path(&self)',
              'pub(crate) fn state(&self)': 'pub fn state(&self)',
              'pub(crate) fn turns(&self)': 'pub fn turns(&self)',
              'pub(crate) fn ask(\n': 'pub fn ask(\n',
              'pub(crate) fn close(&mut self)': 'pub fn close(&mut self)',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected controller token: {old!r}')
              text = text.replace(old, new, 1)

          marker = 'pub struct DesktopAnalystSession<P: AnalystSessionProcess> {'
          text = text.replace(marker, '#[derive(Debug)]\n' + marker, 1)
          text = text.replace(
              '    struct FakeProcess {',
              '    #[derive(Debug)]\n    struct FakeProcess {',
              1,
          )
          path.write_text(text)

          lock = Path('Cargo.lock')
          lock_text = lock.read_text()
          package = '''[[package]]
          name = "world-machine-desktop"
          version = "0.1.0"
          dependencies = [
           "gpui",
           "gpui_platform",
           "url",
           "world-builtins",
          '''
          replacement = '''[[package]]
          name = "world-machine-desktop"
          version = "0.1.0"
          dependencies = [
           "gpui",
           "gpui_platform",
           "url",
           "world-analyst-client",
           "world-builtins",
          '''
          if package not in lock_text:
              raise SystemExit('world-machine-desktop Cargo.lock block did not match')
          lock.write_text(lock_text.replace(package, replacement, 1))
          PY
      - name: Validate controller
        run: |
          cargo fmt --all
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo test -p world-machine-desktop
          cargo clippy -p world-machine-desktop --all-targets -- -D warnings
      - name: Commit controller fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock apps/world-machine-desktop/src/analyst_session.rs
          git commit -m "M222: harden desktop analyst session boundary"
          git push
