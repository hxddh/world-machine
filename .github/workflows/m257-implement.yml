name: M257 Implement
on:
  push:
    branches:
      - agent/m257-bound-rust-analyst-request-writes
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m257-bound-rust-analyst-request-writes
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Implement bounded Rust Analyst request writes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/world-analyst-client/src/lib.rs')
          text = p.read_text()

          old = 'pub const ANALYST_TURN_MAX_RESPONSE_BYTES: usize = 64 * 1024 * 1024;\n'
          new = old + 'pub const ANALYST_TURN_MAX_REQUEST_BYTES: usize = 64 * 1024 * 1024;\n'
          if old not in text:
              raise SystemExit('constant marker not found')
          text = text.replace(old, new, 1)

          old = "\n".join([
              'pub struct AnalystTurnClient<R, W> {',
              '    reader: R,',
              '    writer: W,',
              '    next_request_id: u64,',
              '    poisoned: bool,',
              '}',
          ])
          new = "\n".join([
              'pub struct AnalystTurnClient<R, W> {',
              '    reader: R,',
              '    writer: W,',
              '    next_request_id: u64,',
              '    poisoned: bool,',
              '    max_request_bytes: usize,',
              '}',
          ])
          if old not in text:
              raise SystemExit('client struct marker not found')
          text = text.replace(old, new, 1)

          old = "\n".join([
              '        Self {',
              '            reader,',
              '            writer,',
              '            next_request_id: 1,',
              '            poisoned: false,',
              '        }',
          ])
          new = "\n".join([
              '        Self {',
              '            reader,',
              '            writer,',
              '            next_request_id: 1,',
              '            poisoned: false,',
              '            max_request_bytes: ANALYST_TURN_MAX_REQUEST_BYTES,',
              '        }',
          ])
          if old not in text:
              raise SystemExit('client constructor marker not found')
          text = text.replace(old, new, 1)

          old = "\n".join([
              '        let id = format!("world-rust-analyst-{}", self.next_request_id);',
              '        self.next_request_id += 1;',
              '        let request = AnalystTurnRequest::Probe {',
              '            id: id.clone(),',
              '            timeout_ms,',
              '        };',
              '        match self.transact(&request, &id)? {',
          ])
          new = "\n".join([
              '        let id = format!("world-rust-analyst-{}", self.next_request_id);',
              '        let request = AnalystTurnRequest::Probe {',
              '            id: id.clone(),',
              '            timeout_ms,',
              '        };',
              '        let encoded = encode_bounded_request(&request, self.max_request_bytes)?;',
              '        self.next_request_id += 1;',
              '        match self.transact(&encoded, &id)? {',
          ])
          if old not in text:
              raise SystemExit('probe dispatch marker not found')
          text = text.replace(old, new, 1)

          old = "\n".join([
              '        let id = format!("world-rust-analyst-{}", self.next_request_id);',
              '        self.next_request_id += 1;',
              '        let request = AnalystTurnRequest::Ask {',
              '            id: id.clone(),',
              '            prompt,',
              '            timeout_ms,',
              '        };',
              '        match self.transact(&request, &id)? {',
          ])
          new = "\n".join([
              '        let id = format!("world-rust-analyst-{}", self.next_request_id);',
              '        let request = AnalystTurnRequest::Ask {',
              '            id: id.clone(),',
              '            prompt,',
              '            timeout_ms,',
              '        };',
              '        let encoded = encode_bounded_request(&request, self.max_request_bytes)?;',
              '        self.next_request_id += 1;',
              '        match self.transact(&encoded, &id)? {',
          ])
          if old not in text:
              raise SystemExit('ask dispatch marker not found')
          text = text.replace(old, new, 1)

          start = text.find('    fn transact(\n')
          end = text.find('    fn remote_error<T>', start)
          if start < 0 or end < 0:
              raise SystemExit('transaction block markers not found')
          replacement = "\n".join([
              '    fn transact(',
              '        &mut self,',
              '        encoded_request: &[u8],',
              '        expected_id: &str,',
              '    ) -> Result<AnalystTurnResponse, AnalystTurnClientError> {',
              '        self.transact_with_response_limit(',
              '            encoded_request,',
              '            expected_id,',
              '            ANALYST_TURN_MAX_RESPONSE_BYTES,',
              '        )',
              '    }',
              '',
              '    fn transact_with_response_limit(',
              '        &mut self,',
              '        encoded_request: &[u8],',
              '        expected_id: &str,',
              '        max_response_bytes: usize,',
              '    ) -> Result<AnalystTurnResponse, AnalystTurnClientError> {',
              '        if let Err(error) = self.writer.write_all(encoded_request) {',
              '            self.poisoned = true;',
              '            return Err(AnalystTurnClientError::WriteRequest(error));',
              '        }',
              '        if let Err(error) = self.writer.write_all(b"\\n") {',
              '            self.poisoned = true;',
              '            return Err(AnalystTurnClientError::WriteRequest(error));',
              '        }',
              '        if let Err(error) = self.writer.flush() {',
              '            self.poisoned = true;',
              '            return Err(AnalystTurnClientError::WriteRequest(error));',
              '        }',
              '',
              '        let line = match read_bounded_response_line(&mut self.reader, max_response_bytes) {',
              '            Ok(Some(line)) => line,',
              '            Ok(None) => {',
              '                self.poisoned = true;',
              '                return Err(AnalystTurnClientError::UnexpectedEof);',
              '            }',
              '            Err(error) => {',
              '                self.poisoned = true;',
              '                return Err(error);',
              '            }',
              '        };',
              '',
              '        let value: Value = match serde_json::from_slice(&line) {',
              '            Ok(value) => value,',
              '            Err(error) => {',
              '                self.poisoned = true;',
              '                return Err(AnalystTurnClientError::InvalidResponseJson(error));',
              '            }',
              '        };',
              '        if let Err(error) = validate_response_shape(&value) {',
              '            self.poisoned = true;',
              '            return Err(error);',
              '        }',
              '        let envelope: AnalystTurnEnvelope = match serde_json::from_value(value) {',
              '            Ok(envelope) => envelope,',
              '            Err(error) => {',
              '                self.poisoned = true;',
              '                return Err(AnalystTurnClientError::InvalidResponseJson(error));',
              '            }',
              '        };',
              '',
              '        if envelope.protocol != ANALYST_TURN_PROTOCOL {',
              '            self.poisoned = true;',
              '            return Err(AnalystTurnClientError::ProtocolMismatch {',
              '                actual: envelope.protocol,',
              '            });',
              '        }',
              '        if envelope.version != ANALYST_TURN_PROTOCOL_VERSION {',
              '            self.poisoned = true;',
              '            return Err(AnalystTurnClientError::VersionMismatch {',
              '                actual: envelope.version,',
              '            });',
              '        }',
              '',
              '        let actual_id = response_id(&envelope.response).to_owned();',
              '        if actual_id != expected_id {',
              '            self.poisoned = true;',
              '            return Err(AnalystTurnClientError::CorrelationMismatch {',
              '                expected: expected_id.to_owned(),',
              '                actual: actual_id,',
              '            });',
              '        }',
              '        Ok(envelope.response)',
              '    }',
          ]) + '\n'
          text = text[:start] + replacement + text[end:]

          marker = 'fn read_bounded_response_line<R: BufRead>(\n'
          helper = "\n".join([
              'fn encode_bounded_request(',
              '    request: &AnalystTurnRequest,',
              '    max_bytes: usize,',
              ') -> Result<Vec<u8>, AnalystTurnClientError> {',
              '    let encoded = serde_json::to_vec(request).map_err(AnalystTurnClientError::SerializeRequest)?;',
              '    if encoded.len() > max_bytes {',
              '        return Err(AnalystTurnClientError::InvalidRequest(format!(',
              '            "serialized request exceeded the {max_bytes}-byte transport limit"',
              '        )));',
              '    }',
              '    Ok(encoded)',
              '}',
              '',
          ])
          if marker not in text:
              raise SystemExit('response helper marker not found')
          text = text.replace(marker, helper + marker, 1)

          marker = '    #[test]\n    fn probe_serializes_request_and_accepts_provider_neutral_ready() {'
          tests = "\n".join([
              '    fn ask_request_len(prompt: &str) -> usize {',
              '        serde_json::to_vec(&AnalystTurnRequest::Ask {',
              '            id: "world-rust-analyst-1".into(),',
              '            prompt: prompt.into(),',
              '            timeout_ms: None,',
              '        })',
              '        .unwrap()',
              '        .len()',
              '    }',
              '',
              '    #[test]',
              '    fn request_payload_exact_limit_is_written_once_with_framing_lf_outside_budget() {',
              '        let prompt = "fit";',
              '        let limit = ask_request_len(prompt);',
              '        let mut client = response_client(success_response("world-rust-analyst-1"));',
              '        client.max_request_bytes = limit;',
              '        client.ask(prompt, None).unwrap();',
              '        let (_, written) = client.into_parts();',
              '        assert_eq!(written.len(), limit + 1);',
              '        assert_eq!(written.last(), Some(&b\'\\n\'));',
              '        assert_eq!(written[..limit].len(), limit);',
              '    }',
              '',
              '    #[test]',
              '    fn oversized_request_is_local_nonfatal_and_does_not_consume_request_id() {',
              '        let valid_prompt = "fit";',
              '        let limit = ask_request_len(valid_prompt);',
              '        let mut client = response_client(success_response("world-rust-analyst-1"));',
              '        client.max_request_bytes = limit;',
              '',
              '        let error = client.ask("fits", None).unwrap_err();',
              '        assert!(matches!(error, AnalystTurnClientError::InvalidRequest(_)));',
              '        assert!(!error.is_session_fatal());',
              '        assert!(!client.is_poisoned());',
              '        assert!(client.writer.is_empty());',
              '',
              '        let turn = client.ask(valid_prompt, None).unwrap();',
              '        assert_eq!(turn.text.as_deref(), Some("answer"));',
              '        let (_, written) = client.into_parts();',
              '        let request: Value = serde_json::from_slice(&written[..written.len() - 1]).unwrap();',
              '        assert_eq!(request["id"], "world-rust-analyst-1");',
              '    }',
              '',
              '    #[test]',
              '    fn request_limit_counts_serialized_utf8_bytes() {',
              '        let ascii_len = ask_request_len("e");',
              '        let utf8_len = ask_request_len("é");',
              '        assert!(utf8_len > ascii_len);',
              '        let mut client = response_client(success_response("world-rust-analyst-1"));',
              '        client.max_request_bytes = ascii_len;',
              '        let error = client.ask("é", None).unwrap_err();',
              '        assert!(matches!(error, AnalystTurnClientError::InvalidRequest(_)));',
              '        assert!(client.writer.is_empty());',
              '        assert!(!client.is_poisoned());',
              '    }',
              '',
              '    #[test]',
              '    fn probe_uses_same_bounded_request_path() {',
              '        let request = AnalystTurnRequest::Probe {',
              '            id: "world-rust-analyst-1".into(),',
              '            timeout_ms: None,',
              '        };',
              '        let exact = serde_json::to_vec(&request).unwrap().len();',
              '        let mut client = response_client(ready_response("world-rust-analyst-1"));',
              '        client.max_request_bytes = exact;',
              '        client.probe(None).unwrap();',
              '        let (_, written) = client.into_parts();',
              '        assert_eq!(written.len(), exact + 1);',
              '        assert_eq!(written.last(), Some(&b\'\\n\'));',
              '    }',
              '',
          ])
          if marker not in text:
              raise SystemExit('test insertion marker not found')
          text = text.replace(marker, tests + marker, 1)

          old = "\n".join([
              '        let error = client',
              '            .transact_with_response_limit(&request, "world-rust-analyst-1", 8)',
              '            .unwrap_err();',
          ])
          new = "\n".join([
              '        let encoded = serde_json::to_vec(&request).unwrap();',
              '        let error = client',
              '            .transact_with_response_limit(&encoded, "world-rust-analyst-1", 8)',
              '            .unwrap_err();',
          ])
          if old not in text:
              raise SystemExit('oversized response transaction test marker not found')
          text = text.replace(old, new, 1)

          marker = '    #[cfg(unix)]\n    #[test]\n    fn process_returns_poisoned_after_fatal_probe_teardown() {'
          process_test = "\n".join([
              '    #[cfg(unix)]',
              '    #[test]',
              '    fn process_keeps_child_alive_after_locally_oversized_request() {',
              '        let mut child = Command::new("sh")',
              '            .arg("-c")',
              '            .arg("cat >/dev/null")',
              '            .stdin(Stdio::piped())',
              '            .stdout(Stdio::piped())',
              '            .spawn()',
              '            .unwrap();',
              '        let stdin = child.stdin.take().unwrap();',
              '        let stdout = child.stdout.take().unwrap();',
              '        let mut client = AnalystTurnClient::new(',
              '            BufReader::new(stdout),',
              '            BufWriter::new(stdin),',
              '        );',
              '        client.max_request_bytes = 32;',
              '        let pid = child.id();',
              '        let mut process = AnalystTurnProcess {',
              '            child,',
              '            client: Some(client),',
              '        };',
              '',
              '        let error = process.ask("oversized", None).unwrap_err();',
              '        assert!(matches!(error, AnalystTurnClientError::InvalidRequest(_)));',
              '        assert!(!error.is_session_fatal());',
              '        assert!(process.client.is_some());',
              '        let alive = Command::new("/bin/kill")',
              '            .arg("-0")',
              '            .arg(pid.to_string())',
              '            .status()',
              '            .unwrap();',
              '        assert!(alive.success(), "local request rejection must not stop the child");',
              '        process.shutdown().unwrap();',
              '    }',
              '',
          ])
          if marker not in text:
              raise SystemExit('process test insertion marker not found')
          text = text.replace(marker, process_test + marker, 1)

          marker = '    #[test]\n    fn analyst_response_framing_source_is_bounded_and_byte_based() {'
          source_test = "\n".join([
              '    #[test]',
              '    fn analyst_request_preflight_serializes_before_transport_and_reuses_encoded_bytes() {',
              '        let source = include_str!("lib.rs");',
              '        let encoder = source',
              '            .split_once("fn encode_bounded_request(")',
              '            .unwrap()',
              '            .1',
              '            .split_once("fn read_bounded_response_line")',
              '            .unwrap()',
              '            .0;',
              '        assert!(encoder.contains("serde_json::to_vec(request)"));',
              '        assert!(encoder.contains("encoded.len() > max_bytes"));',
              '',
              '        let transport = source',
              '            .split_once("fn transact_with_response_limit(")',
              '            .unwrap()',
              '            .1',
              '            .split_once("fn remote_error")',
              '            .unwrap()',
              '            .0;',
              '        assert!(transport.contains("write_all(encoded_request)"));',
              '        assert!(!transport.contains("serde_json::to_vec"));',
              '    }',
              '',
          ])
          if marker not in text:
              raise SystemExit('source test insertion marker not found')
          text = text.replace(marker, source_test + marker, 1)

          p.write_text(text)
          PY
          cargo fmt --all -- --check || cargo fmt --all
          cargo test -p world-analyst-client
          cargo clippy -p world-analyst-client --all-targets -- -D warnings
          bash ./scripts/check-pi-analyst.sh
          cargo fmt --all -- --check
          git rm .github/workflows/m257-implement.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/world-analyst-client/src/lib.rs
          git commit -m 'M257: bound Rust analyst request writes'
          git push origin HEAD:agent/m257-bound-rust-analyst-request-writes
