name: M116 apply recent Worlds

on:
  push:
    branches:
      - agent/m116-recent-worlds
    paths:
      - scripts/m116-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m116-recent-worlds
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply recent Worlds patch
        run: python scripts/m116_patch.py
      - name: Format and test World Library
        shell: bash
        run: |
          cargo fmt --all
          cargo test -p world-library
      - name: Commit product change
        shell: bash
        run: |
          git config user.name "world-machine-m116"
          git config user.email "actions@users.noreply.github.com"
          git add crates/world-library/src/lib.rs
          git diff --cached --quiet && { echo "patch produced no product changes" >&2; exit 1; }
          git commit -m "M116: list recently persisted Worlds first"
          git push origin HEAD:agent/m116-recent-worlds
