name: M143 Patch

on:
  push:
    branches:
      - agent/m143-event-entity-effects

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[m143-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m143-event-entity-effects
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply M143 projection method
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/world-projection/src/lib.rs')
          s = p.read_text()
          marker = "    pub fn influence(&self, event: EventId) -> Vec<(usize, &TimelineItem)> {"
          method = "\n".join([
              "    pub fn directly_changed_entities(&self, event: EventId) -> Vec<EntityId> {",
              "        let event_key = SelectionId::Event(event).stable_key();",
              "        self.inspectors",
              "            .iter()",
              "            .filter_map(|(selection, inspector)| {",
              "                let SelectionId::Entity(entity) = selection else {",
              "                    return None;",
              "                };",
              "                inspector",
              "                    .sections",
              "                    .iter()",
              "                    .find(|section| section.title == ENTITY_HISTORY_SECTION)",
              "                    .filter(|section| {",
              "                        section",
              "                            .rows",
              "                            .iter()",
              "                            .any(|row| row.value.as_str() == event_key.as_str())",
              "                    })",
              "                    .map(|_| *entity)",
              "            })",
              "            .collect()",
              "    }",
              "",
          ])
          assert marker in s
          s = s.replace(marker, method + marker, 1)
          p.write_text(s)
          PY
          cargo fmt --all
      - name: Commit M143
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/world-projection/src/lib.rs crates/world-projection/tests/event_entity_effects.rs
          git commit -m "M143: expose direct event-to-entity effects [m143-patch]"
          git push origin HEAD:agent/m143-event-entity-effects
