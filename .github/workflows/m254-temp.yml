name: M254 Temp
on:
  push:
    branches:
      - agent/m254-bound-pi-rpc-record-framing
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m254-bound-pi-rpc-record-framing
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply and validate M254
        shell: bash
        run: |
          cat > /tmp/m254.py <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}")
              p.write_text(text.replace(old, new, 1))

          rpc = "integrations/pi/world-machine-analyst-rpc.mjs"
          replace(
              rpc,
              'const DEFAULT_PROMPT_TIMEOUT_MS = 120000;\nconst ANALYST_READY_COMMAND = "world-machine-analyst-ready";',
              'const DEFAULT_PROMPT_TIMEOUT_MS = 120000;\nconst DEFAULT_MAX_RPC_RECORD_BYTES = 64 * 1024 * 1024;\nconst ANALYST_READY_COMMAND = "world-machine-analyst-ready";',
          )
          replace(
              rpc,
              '''  constructor(child) {
    if (!child.stdin || !child.stdout) {
      throw new PiAnalystRpcTransportError("Pi analyst RPC child must expose piped stdin/stdout");
    }

    this.child = child;
    this.buffer = Buffer.alloc(0);
    this.records = [];
    this.waiters = [];
    this.closedError = null;
    this.closed = false;
    this.busy = false;
    this.nextRequestNumber = 1;
    this.nextProbeNumber = 1;
''',
              '''  constructor(child, { maxRecordBytes = DEFAULT_MAX_RPC_RECORD_BYTES } = {}) {
    if (!child.stdin || !child.stdout) {
      throw new PiAnalystRpcTransportError("Pi analyst RPC child must expose piped stdin/stdout");
    }
    if (
      !Number.isSafeInteger(maxRecordBytes) ||
      maxRecordBytes <= 0 ||
      maxRecordBytes >= Number.MAX_SAFE_INTEGER
    ) {
      throw new PiAnalystRpcProtocolError(
        "Pi analyst RPC max record bytes must be a positive safe integer with framing headroom",
      );
    }

    this.child = child;
    this.maxRecordBytes = maxRecordBytes;
    this.recordBuffer = Buffer.alloc(0);
    this.recordBytes = 0;
    this.records = [];
    this.waiters = [];
    this.closedError = null;
    this.closed = false;
    this.busy = false;
    this.nextRequestNumber = 1;
    this.nextProbeNumber = 1;
''',
          )
          replace(
              rpc,
              '''  #acceptChunk(chunk) {
    this.buffer = Buffer.concat([this.buffer, chunk]);
    while (true) {
      const newline = this.buffer.indexOf(0x0a);
      if (newline < 0) return;
      const raw = this.buffer.subarray(0, newline);
      this.buffer = this.buffer.subarray(newline + 1);
      const line = raw.toString("utf8").replace(/\\r$/, "");
      if (line.length === 0) continue;

      let record;
      try {
        record = JSON.parse(line);
      } catch (error) {
        this.#finish(
          new PiAnalystRpcProtocolError(`invalid Pi analyst RPC JSON: ${error.message}`, {
            line,
          }),
        );
        return;
      }

      const waiter = this.waiters.shift();
      if (waiter) waiter.resolve(record);
      else this.records.push(record);
    }
  }

  #finish(error) {
    if (this.closedError) return;
    this.closedError = error;
    const waiters = this.waiters.splice(0);
    for (const waiter of waiters) waiter.reject(error);
  }
''',
              '''  #acceptChunk(chunk) {
    if (this.closedError) return;
    const bytes = Buffer.isBuffer(chunk) ? chunk : Buffer.from(chunk);
    let offset = 0;

    while (offset < bytes.length) {
      const newline = bytes.indexOf(0x0a, offset);
      if (newline < 0) {
        this.#appendRecordFragment(bytes.subarray(offset));
        return;
      }

      if (!this.#appendRecordFragment(bytes.subarray(offset, newline))) return;
      const payload = this.#takeRecordPayload();
      if (payload === null) return;
      if (payload.length > 0 && !this.#acceptRecordPayload(payload)) return;
      offset = newline + 1;
    }
  }

  #appendRecordFragment(fragment) {
    const maxRawBytes = this.maxRecordBytes + 1;
    const totalBytes = this.recordBytes + fragment.length;
    if (totalBytes > maxRawBytes) {
      this.#failOversizedRecord();
      return false;
    }

    if (totalBytes === maxRawBytes) {
      const lastByte =
        fragment.length > 0
          ? fragment[fragment.length - 1]
          : this.recordBytes > 0
            ? this.recordBuffer[this.recordBytes - 1]
            : null;
      if (lastByte !== 0x0d) {
        this.#failOversizedRecord();
        return false;
      }
    }

    if (fragment.length === 0) return true;
    this.#ensureRecordCapacity(totalBytes);
    fragment.copy(this.recordBuffer, this.recordBytes);
    this.recordBytes = totalBytes;
    return true;
  }

  #ensureRecordCapacity(requiredBytes) {
    if (this.recordBuffer.length >= requiredBytes) return;
    const maxRawBytes = this.maxRecordBytes + 1;
    let nextCapacity =
      this.recordBuffer.length === 0 ? Math.min(4096, maxRawBytes) : this.recordBuffer.length;
    while (nextCapacity < requiredBytes) {
      nextCapacity = Math.min(maxRawBytes, Math.max(requiredBytes, nextCapacity * 2));
    }

    const next = Buffer.allocUnsafe(nextCapacity);
    if (this.recordBytes > 0) {
      this.recordBuffer.copy(next, 0, 0, this.recordBytes);
    }
    this.recordBuffer = next;
  }

  #takeRecordPayload() {
    const raw = this.recordBuffer.subarray(0, this.recordBytes);
    this.recordBuffer = Buffer.alloc(0);
    this.recordBytes = 0;
    const payload = raw.length > 0 && raw[raw.length - 1] === 0x0d ? raw.subarray(0, -1) : raw;
    if (payload.length > this.maxRecordBytes) {
      this.#failOversizedRecord();
      return null;
    }
    return payload;
  }

  #acceptRecordPayload(payload) {
    const line = payload.toString("utf8");
    let record;
    try {
      record = JSON.parse(line);
    } catch (error) {
      this.#finish(
        new PiAnalystRpcProtocolError(`invalid Pi analyst RPC JSON: ${error.message}`, {
          line,
        }),
      );
      return false;
    }

    const waiter = this.waiters.shift();
    if (waiter) waiter.resolve(record);
    else this.records.push(record);
    return true;
  }

  #failOversizedRecord() {
    const error = new PiAnalystRpcProtocolError(
      `Pi analyst RPC record exceeded the ${this.maxRecordBytes}-byte transport limit`,
      { maxRecordBytes: this.maxRecordBytes },
    );
    this.records.length = 0;
    this.#finish(error);
    this.kill();
  }

  #finish(error) {
    if (this.closedError) return;
    this.recordBuffer = Buffer.alloc(0);
    this.recordBytes = 0;
    this.closedError = error;
    const waiters = this.waiters.splice(0);
    for (const waiter of waiters) waiter.reject(error);
  }
''',
          )

          tests = "integrations/pi/tests/world-machine-analyst-rpc.test.mjs"
          replace(
              tests,
              'import { spawn } from "node:child_process";\nimport test from "node:test";',
              'import { spawn } from "node:child_process";\nimport { EventEmitter } from "node:events";\nimport { PassThrough } from "node:stream";\nimport test from "node:test";',
          )
          replace(
              tests,
              '''function fakeSession(script) {
  const child = spawn(process.execPath, ["-e", script], {
    stdio: ["pipe", "pipe", "pipe"],
  });
  return new PiAnalystRpcSession(child);
}
''',
              '''function fakeSession(script, options = {}) {
  const child = spawn(process.execPath, ["-e", script], {
    stdio: ["pipe", "pipe", "pipe"],
  });
  return new PiAnalystRpcSession(child, options);
}

function controlledSession(onRequest, options = {}) {
  const child = new EventEmitter();
  child.stdin = new PassThrough();
  child.stdout = new PassThrough();
  child.exitCode = null;
  child.signalCode = null;
  child.kill = (signal = "SIGTERM") => {
    if (child.exitCode !== null || child.signalCode !== null) return false;
    child.signalCode = signal;
    queueMicrotask(() => child.emit("exit", null, signal));
    return true;
  };
  child.stdin.on("finish", () => child.kill("SIGTERM"));

  let buffer = "";
  child.stdin.setEncoding("utf8");
  child.stdin.on("data", (chunk) => {
    buffer += chunk;
    while (true) {
      const newline = buffer.indexOf("\\n");
      if (newline < 0) return;
      const line = buffer.slice(0, newline);
      buffer = buffer.slice(newline + 1);
      if (line.length === 0) continue;
      onRequest(JSON.parse(line), child.stdout);
    }
  });

  return { session: new PiAnalystRpcSession(child, options), child };
}

function promptAck(id) {
  return JSON.stringify({ type: "response", id, command: "prompt", success: true });
}

function exactSizedSettledRecord(byteLength) {
  const empty = JSON.stringify({ type: "agent_settled", padding: "" });
  const fillerBytes = byteLength - Buffer.byteLength(empty);
  assert.ok(fillerBytes >= 0, "test limit must fit the settled envelope");
  const record = JSON.stringify({ type: "agent_settled", padding: "x".repeat(fillerBytes) });
  assert.equal(Buffer.byteLength(record), byteLength);
  return record;
}
''',
          )
          p = Path(tests)
          p.write_text(p.read_text() + r'''

test("Pi RPC framing accepts an exact-limit LF record", async () => {
  const maxRecordBytes = 160;
  const settled = exactSizedSettledRecord(maxRecordBytes);
  const { session } = controlledSession((request, stdout) => {
    stdout.write(`${promptAck(request.id)}\n`);
    stdout.write(`${settled}\n`);
  }, { maxRecordBytes });

  try {
    const result = await session.prompt("question", { timeoutMs: 2000 });
    assert.equal(result.requestId, "world-analyst-1");
    assert.deepEqual(result.events, ["agent_settled"]);
  } finally {
    await session.shutdown();
  }
});

test("Pi RPC framing accepts an exact-limit CRLF record", async () => {
  const maxRecordBytes = 160;
  const settled = exactSizedSettledRecord(maxRecordBytes);
  const { session } = controlledSession((request, stdout) => {
    stdout.write(`${promptAck(request.id)}\n`);
    stdout.write(`${settled}\r\n`);
  }, { maxRecordBytes });

  try {
    const result = await session.prompt("question", { timeoutMs: 2000 });
    assert.deepEqual(result.events, ["agent_settled"]);
  } finally {
    await session.shutdown();
  }
});

test("Pi RPC framing accepts records split across one-byte stdout chunks", async () => {
  const maxRecordBytes = 160;
  const { session } = controlledSession((request, stdout) => {
    const bytes = Buffer.from(`${promptAck(request.id)}\n${JSON.stringify({ type: "agent_settled" })}\n`);
    for (const byte of bytes) stdout.write(Buffer.from([byte]));
  }, { maxRecordBytes });

  try {
    const result = await session.prompt("question", { timeoutMs: 2000 });
    assert.deepEqual(result.events, ["agent_settled"]);
  } finally {
    await session.shutdown();
  }
});

test("Pi RPC framing preserves multiple records delivered in one stdout chunk", async () => {
  const maxRecordBytes = 160;
  const { session } = controlledSession((request, stdout) => {
    const records = [
      promptAck(request.id),
      JSON.stringify({
        type: "message_end",
        message: { role: "assistant", content: "batched" },
      }),
      JSON.stringify({ type: "agent_settled" }),
    ];
    stdout.write(`${records.join("\n")}\n`);
  }, { maxRecordBytes });

  try {
    const result = await session.prompt("question", { timeoutMs: 2000 });
    assert.equal(result.text, "batched");
    assert.deepEqual(result.events, ["message_end", "agent_settled"]);
  } finally {
    await session.shutdown();
  }
});

test("Pi RPC framing rejects a newline-terminated oversized record before JSON parsing", async () => {
  const maxRecordBytes = 160;
  const { session, child } = controlledSession((request, stdout) => {
    stdout.write(`${promptAck(request.id)}\n`);
    stdout.write(`${"x".repeat(maxRecordBytes + 1)}\n`);
  }, { maxRecordBytes });

  await assert.rejects(
    session.prompt("question", { timeoutMs: 2000 }),
    (error) =>
      error instanceof PiAnalystRpcProtocolError &&
      /record exceeded/.test(error.message) &&
      !/invalid Pi analyst RPC JSON/.test(error.message),
  );
  assert.equal(child.signalCode, "SIGTERM");
  await assert.rejects(
    session.prompt("another question", { timeoutMs: 2000 }),
    (error) => error instanceof PiAnalystRpcProtocolError && /record exceeded/.test(error.message),
  );
});

test("Pi RPC framing rejects an oversized no-newline stream promptly and kills the child", async () => {
  const maxRecordBytes = 160;
  const { session, child } = controlledSession((request, stdout) => {
    stdout.write(`${promptAck(request.id)}\n`);
    stdout.write(Buffer.alloc(maxRecordBytes + 2, 0x78));
  }, { maxRecordBytes });

  const started = Date.now();
  await assert.rejects(
    session.prompt("question", { timeoutMs: 2000 }),
    (error) => error instanceof PiAnalystRpcProtocolError && /record exceeded/.test(error.message),
  );
  assert.ok(Date.now() - started < 500, "framing overflow should fail before prompt timeout");
  assert.equal(child.signalCode, "SIGTERM");
});

test("Pi RPC framing never recovers from an oversized prefix in the same chunk", async () => {
  const maxRecordBytes = 160;
  const { session, child } = controlledSession((request, stdout) => {
    const validAfterOverflow = JSON.stringify({ type: "agent_settled" });
    stdout.write(
      `${promptAck(request.id)}\n${"x".repeat(maxRecordBytes + 1)}\n${validAfterOverflow}\n`,
    );
  }, { maxRecordBytes });

  await assert.rejects(
    session.prompt("question", { timeoutMs: 2000 }),
    (error) => error instanceof PiAnalystRpcProtocolError && /record exceeded/.test(error.message),
  );
  assert.equal(child.signalCode, "SIGTERM");
  await assert.rejects(
    session.prompt("another question", { timeoutMs: 2000 }),
    (error) => error instanceof PiAnalystRpcProtocolError && /record exceeded/.test(error.message),
  );
});
''')
          PY
          python /tmp/m254.py
          node --check integrations/pi/world-machine-analyst-rpc.mjs
          node --test integrations/pi/tests/world-machine-analyst-rpc.test.mjs integrations/pi/tests/world-machine-analyst-rpc-abort.test.mjs
          bash ./scripts/check-pi-analyst.sh
          cargo fmt --all -- --check
          git rm .github/workflows/m254-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add integrations/pi/world-machine-analyst-rpc.mjs integrations/pi/tests/world-machine-analyst-rpc.test.mjs
          git commit -m 'M254: bound Pi analyst RPC record framing'
          git push origin HEAD:agent/m254-bound-pi-rpc-record-framing
