name: M53A Apply Runtime Patch

on:
  push:
    branches:
      - m53a-harden-process-pack-runtime

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m53a-harden-process-pack-runtime
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - run: python scripts/m53a_apply.py
      - name: Keep test-only wire type out of production imports
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/world-pack-process/src/lib.rs')
          s = p.read_text()
          s = s.replace(
              '    PackRequestEnvelope, PackResponse, PackRuntimeManifest, ProjectionIntentWire,\n    ProjectionSnapshotWire,\n',
              '    PackRequestEnvelope, PackResponse, PackRuntimeManifest, ProjectionIntentWire,\n',
          )
          s = s.replace(
              'use world_pack_protocol::{encode_response, PackResponseEnvelope, ProjectionCapabilitiesWire};',
              'use world_pack_protocol::{\n        encode_response, PackResponseEnvelope, ProjectionCapabilitiesWire, ProjectionSnapshotWire,\n    };',
          )
          p.write_text(s)
          PY
      - run: cargo fmt --all
      - run: cargo test -p world-pack-process
      - run: cargo clippy -p world-pack-process --all-targets -- -D warnings
      - run: bash ./scripts/check-boundaries.sh
      - run: |
          rm -f scripts/m53a_apply.py .github/workflows/m53a-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "M53A: harden process Pack runtime" || exit 0
          git push origin HEAD:m53a-harden-process-pack-runtime
