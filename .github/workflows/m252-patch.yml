name: M252 bounded framing patch

on:
  push:
    branches:
      - agent/m252-bound-analyst-response-framing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m252-bound-analyst-response-framing
      - name: Apply M252 product patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/world-analyst-client/src/lib.rs')
          source = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)

          replace_once(
              'use std::io::{self, BufRead, BufReader, BufWriter, Write};',
              'use std::io::{self, BufRead, BufReader, BufWriter, Read, Write};',
          )

          replace_once(
              'pub const ANALYST_TURN_MAX_TIMEOUT_MS: u64 = 9_007_199_254_740_991;\n',
              'pub const ANALYST_TURN_MAX_TIMEOUT_MS: u64 = 9_007_199_254_740_991;\n'
              'pub const ANALYST_TURN_MAX_RESPONSE_BYTES: usize = 64 * 1024 * 1024;\n',
          )

          replace_once(
              '    UnexpectedEof,\n    InvalidResponseJson(serde_json::Error),',
              '    UnexpectedEof,\n    ResponseTooLarge { max_bytes: usize },\n    InvalidResponseJson(serde_json::Error),',
          )

          replace_once(
              '            Self::UnexpectedEof => write!(f, "analyst turn host closed before responding"),\n'
              '            Self::InvalidResponseJson(error) => {',
              '            Self::UnexpectedEof => write!(f, "analyst turn host closed before responding"),\n'
              '            Self::ResponseTooLarge { max_bytes } => write!(\n'
              '                f,\n'
              '                "analyst turn response exceeded the {max_bytes}-byte transport limit"\n'
              '            ),\n'
              '            Self::InvalidResponseJson(error) => {',
          )

          replace_once(
              '            | Self::UnexpectedEof\n            | Self::InvalidResponseShape(_)',
              '            | Self::UnexpectedEof\n            | Self::ResponseTooLarge { .. }\n            | Self::InvalidResponseShape(_)',
          )

          old_transact = '''    fn transact(
        &mut self,
        request: &AnalystTurnRequest,
        expected_id: &str,
    ) -> Result<AnalystTurnResponse, AnalystTurnClientError> {
        let encoded =
            serde_json::to_vec(request).map_err(AnalystTurnClientError::SerializeRequest)?;
        if let Err(error) = self.writer.write_all(&encoded) {
            self.poisoned = true;
            return Err(AnalystTurnClientError::WriteRequest(error));
        }
        if let Err(error) = self.writer.write_all(b"\\n") {
            self.poisoned = true;
            return Err(AnalystTurnClientError::WriteRequest(error));
        }
        if let Err(error) = self.writer.flush() {
            self.poisoned = true;
            return Err(AnalystTurnClientError::WriteRequest(error));
