        let mut line = String::new();
        let read = match self.reader.read_line(&mut line) {
            Ok(read) => read,
            Err(error) => {
                self.poisoned = true;
                return Err(AnalystTurnClientError::ReadResponse(error));
            }
        };
        if read == 0 {
            self.poisoned = true;
            return Err(AnalystTurnClientError::UnexpectedEof);
