name: M57 Server Review Hardening

on:
  push:
    branches: [m57-pack-authoring-sdk]
    paths:
      - '.github/workflows/m57-server-review.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m57-pack-authoring-sdk
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python scripts/m57_server_review_fix.py
      - run: cargo fmt --all
      - run: cargo test -p world-pack-server
      - run: cargo test -p world-pack-catalog
      - run: cargo test -p tiny-society-pack
      - run: cargo clippy -p world-pack-server -p world-pack-catalog -p tiny-society-pack --all-targets -- -D warnings
      - run: bash ./scripts/check-boundaries.sh
      - name: Commit hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/world-pack-server/src/lib.rs
          git commit -m 'M57: make server response bounds state-safe'
          git push origin HEAD:m57-pack-authoring-sdk
