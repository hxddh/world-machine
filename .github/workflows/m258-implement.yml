name: M258 Implement
on:
  push:
    branches:
      - agent/m258-bound-world-cli-query-stdin
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m258-bound-world-cli-query-stdin
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Implement bounded world-cli query stdin
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('crates/world-cli/src/main.rs')
          text = p.read_text()

          anchor = 'const INVESTIGATION_PROTOCOL_VERSION: u64 = 1;\n'
          replacement = anchor + 'const MAX_MACHINE_QUERY_STDIN_BYTES: usize = 64 * 1024 * 1024;\n'
          if anchor not in text:
              raise SystemExit('protocol constant anchor not found')
          text = text.replace(anchor, replacement, 1)

          old = "\n".join([
              'fn read_query_request(request: &str) -> Result<String, Box<dyn Error>> {',
              '    if request != "-" {',
              '        return Ok(request.to_owned());',
              '    }',
              '',
              '    let mut json = String::new();',
              '    io::stdin().read_to_string(&mut json)?;',
              '    Ok(json)',
              '}',
          ])
          new = "\n".join([
              'fn read_query_request(request: &str) -> Result<String, Box<dyn Error>> {',
              '    if request != "-" {',
              '        return Ok(request.to_owned());',
              '    }',
              '',
              '    let stdin = io::stdin();',
              '    let mut stdin = stdin.lock();',
              '    read_bounded_query_request(&mut stdin, MAX_MACHINE_QUERY_STDIN_BYTES)',
              '}',
              '',
              'fn read_bounded_query_request<R: Read>(',
              '    reader: &mut R,',
              '    max_bytes: usize,',
              ') -> Result<String, Box<dyn Error>> {',
              '    let read_limit = max_bytes',
              '        .checked_add(1)',
              '        .ok_or_else(|| CliError("machine query stdin byte limit overflowed".into()))?;',
              '    let mut bytes = Vec::new();',
              '    let mut limited = reader.take(u64::try_from(read_limit)?);',
              '    limited.read_to_end(&mut bytes)?;',
              '    if bytes.len() > max_bytes {',
              '        return Err(Box::new(CliError(format!(',
              '            "machine query stdin exceeded the {max_bytes}-byte transport limit"',
              '        ))));',
              '    }',
              '    Ok(String::from_utf8(bytes)?)',
              '}',
          ])
          if old not in text:
              raise SystemExit('read_query_request block not found')
          text = text.replace(old, new, 1)

          test_anchor = "\n".join([
              '    use super::*;',
              '    use std::process;',
              '    use std::time::{SystemTime, UNIX_EPOCH};',
              '',
          ])
          tests = "\n".join([
              '    #[test]',
              '    fn bounded_query_stdin_accepts_below_and_exact_limit() {',
              '        for bytes in [b"abc".as_slice(), b"abcd".as_slice()] {',
              '            let mut reader = std::io::Cursor::new(bytes.to_vec());',
              '            let value = read_bounded_query_request(&mut reader, 4).unwrap();',
              '            assert_eq!(value.as_bytes(), bytes);',
              '        }',
              '    }',
              '',
              '    #[test]',
              '    fn bounded_query_stdin_rejects_limit_plus_one_without_overreading() {',
              '        let mut reader = std::io::Cursor::new(b"abcde-and-more".to_vec());',
              '        let error = read_bounded_query_request(&mut reader, 4).unwrap_err();',
              '        assert!(error.to_string().contains("4-byte transport limit"));',
              '        assert_eq!(reader.position(), 5);',
              '    }',
              '',
              '    #[test]',
              '    fn bounded_query_stdin_rejects_unbounded_reader_once_overflow_is_certain() {',
              '        let mut reader = std::io::repeat(b\'x\');',
              '        let error = read_bounded_query_request(&mut reader, 4).unwrap_err();',
              '        assert!(error.to_string().contains("4-byte transport limit"));',
              '    }',
              '',
              '    #[test]',
              '    fn bounded_query_stdin_is_strict_utf8_and_counts_bytes() {',
              '        let mut exact = std::io::Cursor::new("é".as_bytes().to_vec());',
              '        assert_eq!(read_bounded_query_request(&mut exact, 2).unwrap(), "é");',
              '',
              '        let mut too_small = std::io::Cursor::new("é".as_bytes().to_vec());',
              '        assert!(read_bounded_query_request(&mut too_small, 1).is_err());',
              '',
              '        let mut invalid = std::io::Cursor::new(vec![0xff]);',
              '        assert!(read_bounded_query_request(&mut invalid, 1).is_err());',
              '    }',
              '',
              '    #[test]',
              '    fn inline_query_request_bypasses_stdin_boundary() {',
              '        let request = r#"{"query":"selections"}"#;',
              '        assert_eq!(read_query_request(request).unwrap(), request);',
              '    }',
              '',
              '    #[test]',
              '    fn machine_query_stdin_source_is_bounded_before_json_decoding() {',
              '        let source = include_str!("main.rs");',
              '        let reader = source',
              '            .split_once("fn read_query_request(")',
              '            .unwrap()',
              '            .1',
              '            .split_once("fn load_archive")',
              '            .unwrap()',
              '            .0;',
              '        assert!(reader.contains("read_bounded_query_request"));',
              '        assert!(reader.contains("MAX_MACHINE_QUERY_STDIN_BYTES"));',
              '        assert!(reader.contains("reader.take"));',
              '        assert!(reader.contains("read_to_end(&mut bytes)"));',
              '        assert!(!reader.contains("read_to_string"));',
              '    }',
              '',
          ])
          if test_anchor not in text:
              raise SystemExit('test module import anchor not found')
          text = text.replace(test_anchor, test_anchor + tests, 1)
          p.write_text(text)
          PY

          cargo fmt --all
          cargo test -p world-cli
          cargo clippy -p world-cli --all-targets -- -D warnings
          bash ./scripts/check-boundaries.sh
          bash ./scripts/check-pi-analyst.sh
          cargo fmt --all -- --check

          git rm .github/workflows/m258-implement.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/world-cli/src/main.rs
          git commit -m 'M258: bound world-cli machine-query stdin'
          git push origin HEAD:agent/m258-bound-world-cli-query-stdin
