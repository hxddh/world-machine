name: M171 clippy fix
on:
  push:
    branches:
      - agent/m171-clippy-fix
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m171-clippy-fix
      - name: Elide needless lifetime
        run: |
          sed -i "s/fn indexed_rows_filter<'a>(/fn indexed_rows_filter(/" crates/world-compare/src/lib.rs
          sed -i "s/    inspector: &'a InspectorProjection,/    inspector: \&InspectorProjection,/" crates/world-compare/src/lib.rs
          sed -i "s/) -> BTreeMap<InspectorRowKey, &'a String> {/\) -> BTreeMap<InspectorRowKey, \&String> {/" crates/world-compare/src/lib.rs
          cargo fmt --all
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/world-compare/src/lib.rs
          if git diff --cached --quiet; then
            echo "No patch produced" >&2
            exit 1
          fi
          git commit -m "M171: elide needless lifetime"
          git push origin HEAD:agent/m171-clippy-fix
