name: M180 fix
on:
  push:
    branches:
      - agent/m180-cli-evidence
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m180-cli-evidence
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: semantic
      - name: Apply headless evidence query command
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/m180_cli_evidence.py')
          t = p.read_text()
          start = t.index('usage_old =')
          end = t.index("text = text.replace(\n    '''why", start)
          p.write_text(t[:start] + t[end:])
          PY
          python3 .github/scripts/m180_cli_evidence.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/world-cli/src/main.rs')
          lines = p.read_text().splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if '  world-cli list-packs' in line]
          if len(matches) != 1:
              raise SystemExit(f'expected one list-packs usage line, found {len(matches)}')
          i = matches[0]
          lines.insert(i, lines[i].replace('list-packs', 'evidence <file.world> <selection-key> [depth]'))
          p.write_text(''.join(lines))
          PY
          cargo fmt --all
          cargo test -p world-cli
          cargo clippy -p world-cli --all-targets -- -D warnings
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates/world-cli/Cargo.toml crates/world-cli/src/main.rs
          if git diff --cached --quiet; then
            echo "No patch produced" >&2
            exit 1
          fi
          git commit -m "M180: query evidence neighborhoods from CLI"
          git push origin HEAD:agent/m180-cli-evidence
