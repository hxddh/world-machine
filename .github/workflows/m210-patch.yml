name: M210 CLI investigation adapter patch

on:
  push:
    branches:
      - agent/m210-cli-investigation-adapter
    paths:
      - .github/workflows/m210-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Apply M210 patch
        run: python3 .github/m210_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Check boundaries
        run: bash ./scripts/check-boundaries.sh
      - name: Test CLI
        run: cargo test -p world-cli
      - name: Test investigation crate
        run: cargo test -p world-investigation
      - name: Clippy
        run: cargo clippy -p world-cli -p world-investigation --all-targets -- -D warnings
      - name: Commit implementation
        run: |
          git config user.name hxddh
          git config user.email hxddh@users.noreply.github.com
          git add Cargo.lock NEXT_TASK.md crates/world-cli/Cargo.toml crates/world-cli/src/main.rs crates/world-cli/tests/machine_investigation_first_divergence.rs
          if ! git diff --cached --quiet; then
            git commit -m "M210: add CLI investigation adapter"
            git push
          fi
