name: M116 harden mtime fallback

on:
  push:
    branches:
      - agent/m116-recent-worlds
    paths:
      - scripts/m116-harden-trigger

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m116-recent-worlds
      - uses: dtolnay/rust-toolchain@stable
      - name: Make mtime an optional browsing hint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/world-library/src/lib.rs")
          text = path.read_text()
          old = "                Ok(metadata) => return Ok(Some(metadata.modified()?)),"
          new = "                Ok(metadata) => return Ok(metadata.modified().ok()),"
          if text.count(old) != 1:
              raise SystemExit(f"expected one mtime read, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo test -p world-library
      - name: Commit mtime fallback
        shell: bash
        run: |
          git config user.name "world-machine-m116"
          git config user.email "actions@users.noreply.github.com"
          git add crates/world-library/src/lib.rs
          git diff --cached --quiet && { echo "mtime hardening produced no changes" >&2; exit 1; }
          git commit -m "M116: tolerate unavailable Library mtimes"
          git push origin HEAD:agent/m116-recent-worlds
