name: M183 query check
on:
  push:
    branches:
      - agent/m183-world-query
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m183-world-query
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: semantic
      - name: Validate headless query crate
        run: |
          cargo fmt --all
          cargo test -p world-query
          cargo clippy -p world-query --all-targets -- -D warnings
          git diff --check
      - name: Commit generated lock and formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates/world-query/src/lib.rs
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "M183: format and lock world-query"
          git push origin HEAD:agent/m183-world-query
