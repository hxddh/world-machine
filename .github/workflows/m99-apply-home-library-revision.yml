name: M99 refresh Home after host Library mutations

on:
  push:
    branches:
      - m99-refresh-home-after-host-mutations

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m99-refresh-home-after-host-mutations
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply host Library mutation revision
        shell: bash
        run: |
          python3 -c "import base64; exec(base64.b64decode(' dXNlIHN1cGVyOjp7CiAgICBzYW5pdGl6ZV9kb2N1bWVudF9iYXNlLCB1bmlxdWVfZG9jdW1lbnRfaWQsIERvY3VtZW50U3RhdHVzLCBTaGFyZWREb2N1bWVudCwgV29ybGREb2N1bWVudFZpZXcsCn07JycnLnJlcGxhY2UoJyAnLCAnJyksCiAgICAnJyc  dXNlIHN1cGVyOjp7CiAgICBzYW5pdGl6ZV9kb2N1bWVudF9iYXNlLCB1bmlxdWVfZG9jdW1lbnRfaWQsIERvY3VtZW50U3RhdHVzLCBTaGFyZWREb2N1bWVudCwgV29ybGREb2N1bWVudFZpZXcsCn07JycnLnJlcGxhY2UoJyAnLCAnJyksCiAgICAnJyc '))"
          cargo fmt --all
          cargo test -p world-machine-desktop
          git diff --check
      - name: Commit host revision signal and remove helper
        if: success()
        shell: bash
        run: |
          rm .github/workflows/m99-apply-home-library-revision.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/world-machine-desktop/src/main.rs \
                  apps/world-machine-desktop/src/world_fork.rs \
                  apps/world-machine-desktop/src/strategy_compare.rs \
                  apps/world-machine-desktop/src/world_fork/lineage.rs \
                  .github/workflows/m99-apply-home-library-revision.yml
          git commit -m "M99: refresh Home after host Library mutations"
          git push origin HEAD:m99-refresh-home-after-host-mutations
