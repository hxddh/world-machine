name: M170 patch

on:
  push:
    branches:
      - agent/m170-state-evidence-graph

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m170-state-evidence-graph
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply unified state evidence graph
        run: |
          python3 .github/scripts/m170_patch.py
          cargo fmt --all
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/world-projection/src/lib.rs crates/world-projection/tests/state_evidence_graph.rs
          git commit -m "M170: unify state evidence graph edges"
          git push origin HEAD:agent/m170-state-evidence-graph
