name: M205 first-divergence continuation patch

on:
  push:
    branches:
      - agent/m205-first-divergence-continuations
    paths:
      - .github/workflows/m205-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Apply M205 patch
        run: python .github/m205_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Check boundaries
        run: bash ./scripts/check-boundaries.sh
      - name: Test world-query
        run: cargo test -p world-query
      - name: Test world-cli
        run: cargo test -p world-cli
      - name: Clippy
        run: cargo clippy -p world-query -p world-cli --all-targets -- -D warnings
      - name: Commit implementation
        run: |
          git config user.name hxddh
          git config user.email hxddh@users.noreply.github.com
          git add NEXT_TASK.md crates/world-query/src/lib.rs crates/world-query/tests/causal_first_divergence_continuations.rs crates/world-cli/tests/machine_query_causal_first_divergence_continuation.rs
          if ! git diff --cached --quiet; then
            git commit -m "M205: add first-divergence continuations"
            git push
          fi
