name: M161 patch

on:
  push:
    branches:
      - agent/m161-comparison-relation-navigation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m161-comparison-relation-navigation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply Comparison Relation navigation
        run: |
          python3 .github/scripts/m161_patch.py
          cargo fmt --all
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/world-strategy-gpui/src/lib.rs
          git commit -m "M161: navigate Relation evidence in comparisons"
          git push origin HEAD:agent/m161-comparison-relation-navigation
