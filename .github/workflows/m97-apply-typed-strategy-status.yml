name: M97 typed Compare Futures status

on:
  push:
    branches:
      - m97-typed-strategy-status

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m97-typed-strategy-status
      - uses: dtolnay/rust-toolchain@stable
      - name: Type Compare Futures local feedback
        shell: bash
        run: |
          echo '' | base64 --decode | python3
          cargo fmt --all
          cargo test -p world-machine-desktop
          git diff --check
      - name: Commit typed Strategy feedback and remove helper
        if: success()
        shell: bash
        run: |
          rm .github/workflows/m97-apply-typed-strategy-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/world-machine-desktop/src/strategy_compare.rs \
                  .github/workflows/m97-apply-typed-strategy-status.yml
          git commit -m "M97: give Compare Futures explicit status semantics"
          git push origin HEAD:m97-typed-strategy-status
