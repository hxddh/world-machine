name: M215 generate stdio workspace lockfile

on:
  push:
    branches:
      - agent/m215-stdio-analyst-process-direct
    paths:
      - .github/workflows/m215-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate M215 crates and generate lockfile
        run: |
          cargo fmt --all -- --check
          cargo test -p world-investigation-local
          cargo test -p world-agent-tool-stdio
          cargo clippy -p world-investigation-local -p world-agent-tool-stdio --all-targets -- -D warnings
      - name: Commit lockfile
        run: |
          git config user.name hxddh
          git config user.email hxddh@users.noreply.github.com
          git add Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: update lockfile for stdio analyst process"
            git push
          fi
