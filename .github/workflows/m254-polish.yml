name: M254 Polish
on:
  push:
    branches:
      - agent/m254-bound-pi-rpc-record-framing
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m254-bound-pi-rpc-record-framing
      - name: Polish M254 formatting and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('integrations/pi/world-machine-analyst-rpc.mjs')
          text = p.read_text()
          old = '      const lastByte =\n        fragment.length > 0\n? fragment[fragment.length - 1]\n: this.recordBytes > 0\n  ? this.recordBuffer[this.recordBytes - 1]\n  : null;'
          new = '      const lastByte =\n        fragment.length > 0\n          ? fragment[fragment.length - 1]\n          : this.recordBytes > 0\n            ? this.recordBuffer[this.recordBytes - 1]\n            : null;'
          if old not in text:
              raise SystemExit('lastByte formatting pattern missing')
          text = text.replace(old, new, 1)
          old = '        new PiAnalystRpcProtocolError(`invalid Pi analyst RPC JSON: ${error.message}`, {\nline,\n        }),'
          new = '        new PiAnalystRpcProtocolError(`invalid Pi analyst RPC JSON: ${error.message}`, {\n          line,\n        }),' 
          if old not in text:
              raise SystemExit('JSON error formatting pattern missing')
          p.write_text(text.replace(old, new, 1))
          PY
          node --check integrations/pi/world-machine-analyst-rpc.mjs
          node --test integrations/pi/tests/world-machine-analyst-rpc.test.mjs integrations/pi/tests/world-machine-analyst-rpc-abort.test.mjs
          git rm .github/workflows/m254-polish.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add integrations/pi/world-machine-analyst-rpc.mjs
          git commit -m 'M254: polish bounded RPC framing implementation'
          git push origin HEAD:agent/m254-bound-pi-rpc-record-framing
