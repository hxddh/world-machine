name: M59 Reviewed Install Hardening

on:
  push:
    branches: [m59-pack-install-review]
    paths:
      - '.github/workflows/m59-preview-api.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m59-pack-install-review
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python scripts/m59_preview_api_fix.py
      - run: python scripts/m59_review_fixes.py
      - run: cargo fmt --all
      - run: cargo test -p world-pack-catalog
      - run: cargo clippy -p world-pack-catalog --all-targets -- -D warnings
      - run: cargo test -p world-machine-desktop
      - run: bash ./scripts/check-boundaries.sh
      - name: Commit reviewed-install hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/world-pack-catalog/src/lib.rs apps/world-machine-desktop/src/main.rs
          git commit -m 'M59: harden reviewed Pack installation'
          git push origin HEAD:m59-pack-install-review
