name: M123 Diagnose Full

on:
  push:
    branches:
      - agent/m123-return-compass
    paths:
      - scripts/m123-diagnose-full-trigger

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m123-return-compass
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply M123 patch
        run: python3 scripts/m123_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Capture full Pocket Universe test output
        run: |
          set +e
          cargo test -p pocket-universe -- --nocapture 2>&1 | tee m123-full-test.log
          echo "${PIPESTATUS[0]}" > m123-full-test-status.txt
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: m123-full-test-log
          path: |
            m123-full-test.log
            m123-full-test-status.txt
