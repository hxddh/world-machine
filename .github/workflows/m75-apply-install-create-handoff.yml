name: M75 apply install-to-create handoff

on:
  push:
    branches:
      - m75-install-create-handoff
    paths:
      - '.github/workflows/m75-apply-install-create-handoff.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m75-install-create-handoff
      - name: Patch World Machine install-to-create handoff
        run: |
          python3 scripts/m75_apply_install_create_handoff.py
          cargo fmt --all
      - name: Commit product handoff and remove one-shot helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m75-apply-install-create-handoff.yml scripts/m75_apply_install_create_handoff.py
          git add apps/world-machine-desktop/src/main.rs
          git commit -m "M75: hand trusted Packs off to first World creation"
          git push origin HEAD:m75-install-create-handoff
