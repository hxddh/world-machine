[package]
name = "world-gpui"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
world-theme = { path = "../world-theme" }
world-projection = { path = "../world-projection" }
world-i18n = { path = "../world-i18n" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "33c95853ed2b6956f339733c63a8220964ecbeb6", default-features = false }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "33c95853ed2b6956f339733c63a8220964ecbeb6", default-features = false, features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
