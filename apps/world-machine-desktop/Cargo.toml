[package]
name = "world-machine-desktop"
version = "0.28.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
# The free demo: the first hour of Tiny Society, then an ending card that
# keeps the World for the full app (src/demo.rs).
demo = []
# Builds the window on Linux too (cfg(gui), see build.rs), for the
# real-window screenshot harness and previews under Xvfb. Needs GPUI's
# Linux build dependencies (libxkbcommon-x11, Vulkan).
linux-window = [
  "dep:cpal",
  "dep:gpui",
  "dep:gpui_platform",
  "dep:url",
  "dep:world-pack-bundle",
  "dep:world-pack-catalog",
  "dep:world-pack-process",
  "dep:world-persistence",
]
# Where this build is distributed. A store build (Steam) is updated by the
# store, so it never asks GitHub for a newer release; see src/channel.rs.
channel-store = []
# The Steam spike (src/steam.rs): starts the Steamworks API when the app is
# launched by Steam, with the app id from WORLD_MACHINE_STEAM_APP_ID (or
# steam_appid.txt). Off by default and never part of the kernel or a
# System. A Steam build is also a store build, so it implies channel-store.
# Linking it needs the Steamworks SDK's redistributable library
# (steam_api64.dll / libsteam_api.dylib) beside the app, under Valve's SDK
# licence; checking it needs nothing.
steam = ["dep:steamworks", "channel-store"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
world-builtins = { path = "../../crates/world-builtins" }
world-host = { path = "../../crates/world-host" }
world-document = { path = "../../crates/world-document" }
world-library = { path = "../../crates/world-library" }
world-observer = { path = "../../crates/world-observer" }
world-gpui = { path = "../../crates/world-gpui" }
world-i18n = { path = "../../crates/world-i18n" }
world-sound = { path = "../../crates/world-sound" }
world-theme = { path = "../../crates/world-theme" }
world-voice = { path = "../../crates/world-voice" }
# The demo reads its farewell from a snapshot on every platform.
world-projection = { path = "../../crates/world-projection" }
steamworks = { version = "0.13.1", optional = true }

[dev-dependencies]
world-persistence = { path = "../../crates/world-persistence" }
world-projection = { path = "../../crates/world-projection" }

# The window: where the app has a GPUI platform (cfg(gui), see build.rs).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# Sound output only (Core Audio, WASAPI); the sound itself is made by
# world-sound on any platform, so a Linux build without a window needs no
# audio libraries.
cpal = "0.18"
gpui = { git = "https://github.com/zed-industries/zed", rev = "33c95853ed2b6956f339733c63a8220964ecbeb6", package = "gpui" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "33c95853ed2b6956f339733c63a8220964ecbeb6", package = "gpui_platform", features = ["font-kit"] }
url = "2"
world-pack-bundle = { path = "../../crates/world-pack-bundle" }
world-pack-catalog = { path = "../../crates/world-pack-catalog" }
world-pack-process = { path = "../../crates/world-pack-process" }
world-persistence = { path = "../../crates/world-persistence" }
world-projection = { path = "../../crates/world-projection" }

# Where the voice's API key is kept on Windows: the Windows Credential
# Manager (src/key_store.rs). MIT OR Apache-2.0.
[target.'cfg(target_os = "windows")'.dependencies]
keyring-core = "1"
windows-native-keyring-store = "1.1"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", optional = true }
gpui = { git = "https://github.com/zed-industries/zed", rev = "33c95853ed2b6956f339733c63a8220964ecbeb6", package = "gpui", optional = true }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "33c95853ed2b6956f339733c63a8220964ecbeb6", package = "gpui_platform", features = ["font-kit", "x11"], optional = true }
url = { version = "2", optional = true }
world-pack-bundle = { path = "../../crates/world-pack-bundle", optional = true }
world-pack-catalog = { path = "../../crates/world-pack-catalog", optional = true }
world-pack-process = { path = "../../crates/world-pack-process", optional = true }
world-persistence = { path = "../../crates/world-persistence", optional = true }
